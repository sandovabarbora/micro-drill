<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consumer Theory Drill</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<style>
:root{
  --ground:#eceef1; --panel:#ffffff; --panel-2:#f4f6f8; --panel-3:#eef1f4;
  --ink:#28313a; --muted:#5d6976; --faint:#8b96a1; --line:#dce1e6;
  --brand:#3a4652; --accent:#a86f38; --accent-soft:#f0e2d1; --mauve:#7e6b86;
  --ok:#2f7d5c; --ok-bg:#e6f1ea; --ok-line:#bfe0cf;
  --bad:#a8493d; --bad-bg:#f6e8e5; --bad-line:#e8c8c1;
  --warn:#9a7b1f; --warn-bg:#f3ecd6; --warn-line:#e0d4a8;
  --shadow:0 1px 2px rgba(40,49,58,.06),0 6px 20px rgba(40,49,58,.06);
  --radius:14px;
  --serif:ui-serif,Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#14181c; --panel:#1b222a; --panel-2:#212a33; --panel-3:#263039;
  --ink:#e7ecf1; --muted:#9caab6; --faint:#71808c; --line:#2c3742;
  --brand:#c6d0da; --accent:#d29a5c; --accent-soft:#332a20; --mauve:#a999b1;
  --ok:#5cba8c; --ok-bg:#17281f; --ok-line:#2c4636;
  --bad:#d9877a; --bad-bg:#2a1a17; --bad-line:#47302b;
  --warn:#d8c07a; --warn-bg:#2a2413; --warn-line:#463d20;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.28);
}}
:root[data-theme="dark"]{
  --ground:#14181c; --panel:#1b222a; --panel-2:#212a33; --panel-3:#263039;
  --ink:#e7ecf1; --muted:#9caab6; --faint:#71808c; --line:#2c3742;
  --brand:#c6d0da; --accent:#d29a5c; --accent-soft:#332a20; --mauve:#a999b1;
  --ok:#5cba8c; --ok-bg:#17281f; --ok-line:#2c4636;
  --bad:#d9877a; --bad-bg:#2a1a17; --bad-line:#47302b;
  --warn:#d8c07a; --warn-bg:#2a2413; --warn-line:#463d20;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);
  line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%}
.app{max-width:730px;margin:0 auto;padding:22px 18px 40px;display:flex;flex-direction:column;gap:14px;min-height:100vh}

.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:500}
h1{font-family:var(--serif);font-weight:700;font-size:26px;margin:2px 0 0;letter-spacing:-.01em;text-wrap:balance}
.tools{display:flex;align-items:center;gap:12px}
.score{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-align:right;line-height:1.35}
.score b{color:var(--ink);font-weight:700}
.score .acc{color:var(--accent)}
.iconbtn{width:34px;height:34px;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  border-radius:10px;cursor:pointer;font-size:15px;display:grid;place-items:center;transition:.15s}
.iconbtn:hover{color:var(--ink);border-color:var(--faint)}

.filters{display:flex;flex-wrap:wrap;gap:7px}
.filters.sub{gap:6px}
.chip{font-family:var(--mono);font-size:12px;font-weight:500;padding:5px 10px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;transition:.15s;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip:hover{border-color:var(--faint);color:var(--ink)}
.chip .n{color:var(--faint);font-size:11px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"],
:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#10151a}
.chip[aria-pressed="true"] .n{color:rgba(255,255,255,.7)}
:root[data-theme="dark"] .chip[aria-pressed="true"] .n,
:root:not([data-theme="light"]) .chip[aria-pressed="true"] .n{color:rgba(16,21,26,.6)}
.chip.sm{font-size:11px;padding:4px 9px}
.flabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);align-self:center;margin-right:2px}

.progress{height:5px;background:var(--panel-3);border-radius:999px;overflow:hidden}
.bar{height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .35s cubic-bezier(.4,0,.2,1)}

.stage{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:22px 22px 20px;display:flex;flex-direction:column;gap:15px}
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qmeta-l{display:flex;align-items:center;gap:9px;min-width:0}
.topic-tag{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.02em;color:var(--mauve);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.diffbadge{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border-radius:999px;flex:none;border:1px solid var(--line)}
.diffbadge.easy{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)}
.diffbadge.med{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.diffbadge.hard{color:var(--bad);background:var(--bad-bg);border-color:var(--bad-line)}
.qindex{font-family:var(--mono);font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.stem{font-family:var(--serif);font-size:19px;line-height:1.45;margin:0;color:var(--ink);text-wrap:pretty}
.stem sub,.stem sup{font-family:var(--serif)}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:var(--panel-2);border:1.5px solid var(--line);border-radius:11px;padding:13px 14px;
  color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.4;transition:.13s}
.opt:hover:not(:disabled){border-color:var(--mauve);background:var(--panel-3)}
.opt:disabled{cursor:default}
.opt .key{font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--muted);
  border:1.5px solid var(--line);border-radius:7px;min-width:24px;height:24px;display:grid;place-items:center;flex:none;margin-top:1px;transition:.13s}
.opt .otext{flex:1}
.opt .mark{font-size:16px;flex:none;width:20px;text-align:center;margin-top:1px;font-weight:700}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt.correct{background:var(--ok-bg);border-color:var(--ok-line)}
.opt.correct .key{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.correct .mark{color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad-line)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.wrong .mark{color:var(--bad)}
.opt.dim{opacity:.62}

.explain{display:none;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:9px;padding:12px 14px;font-family:var(--serif);font-size:15.5px;line-height:1.5;color:var(--muted)}
.explain.show{display:flex}
.explain .why{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);flex:none;font-weight:700;margin-top:4px}
.explain .etext{flex:1}
.explain .etext b,.explain .etext strong{color:var(--ink);font-weight:600}

.feedback{display:none;align-items:center;justify-content:space-between;gap:12px;min-height:22px}
.feedback.show{display:flex}
.verdict{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.01em}
.verdict.ok{color:var(--ok)}
.verdict.no{color:var(--bad)}
.next{font-family:var(--sans);font-weight:600;font-size:14.5px;color:#fff;background:var(--brand);
  border:none;border-radius:10px;padding:9px 18px;cursor:pointer;transition:.15s;white-space:nowrap}
:root[data-theme="dark"] .next,:root:not([data-theme="light"]) .next{color:#10151a}
.next:hover{background:var(--accent)}
:root[data-theme="dark"] .next:hover,:root:not([data-theme="light"]) .next:hover{color:#10151a}
.next:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.next.wide{width:100%;padding:13px}

.numrow{display:flex;gap:9px}
.numin{flex:1;font-family:var(--mono);font-size:16px;padding:12px 14px;border-radius:11px;
  border:1.5px solid var(--line);background:var(--panel-2);color:var(--ink);min-width:0}
.numin::placeholder{color:var(--faint);font-size:13.5px}
.numin:focus{outline:2px solid var(--accent);outline-offset:2px;border-color:var(--accent)}
.numin.good{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:700}
.numin.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);font-weight:700}

.ansline{display:flex;gap:11px;align-items:baseline;background:var(--panel-2);border:1.5px solid var(--ok-line);
  border-radius:11px;padding:13px 15px;font-family:var(--serif);font-size:16.5px;line-height:1.45;color:var(--ink)}
.anslabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ok);flex:none;font-weight:700}
.selfq{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.gradebtns{display:flex;gap:8px}
.grade{font-family:var(--sans);font-weight:600;font-size:13.5px;border-radius:10px;padding:8px 14px;cursor:pointer;
  border:1.5px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;gap:7px}
.grade .kb{font-family:var(--mono);font-size:10px;color:var(--faint)}
.grade.got{color:var(--ok);border-color:var(--ok-line);background:var(--ok-bg)}
.grade.miss{color:var(--bad);border-color:var(--bad-line);background:var(--bad-bg)}
.grade:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.done{text-align:center;padding:14px 4px 6px;display:flex;flex-direction:column;gap:10px;align-items:center}
.done .big{font-family:var(--serif);font-size:40px;font-weight:700;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.done p{margin:0;color:var(--muted);font-size:15px}
.done .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}

.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.btn{font-family:var(--sans);font-weight:600;font-size:13.5px;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:8px 13px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--faint)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn .kb{font-family:var(--mono);font-size:11px;color:var(--faint)}
.hint{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:auto;line-height:1.4}
.hint b{color:var(--muted);font-weight:500}
@media(max-width:560px){.hint{display:none}h1{font-size:22px}.stem{font-size:18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <div class="eyebrow">JEB104 · IES FSV UK · consumer theory</div>
      <h1>Consumer Theory Drill</h1>
    </div>
    <div class="tools">
      <div class="score" id="score" aria-live="polite"></div>
      <button class="iconbtn" id="theme" title="Light / dark" aria-label="Toggle light or dark">◐</button>
    </div>
  </header>

  <nav class="filters" id="filters" aria-label="Filter by topic"></nav>
  <nav class="filters sub" id="difffilters" aria-label="Filter by difficulty"></nav>

  <div class="progress" aria-hidden="true"><div class="bar" id="bar"></div></div>

  <main class="stage" id="stage"></main>

  <footer class="controls">
    <button class="btn" id="shuffle" aria-pressed="true">Shuffle</button>
    <button class="btn" id="restart">Restart</button>
    <button class="btn" id="reviewWrong" disabled>Drill wrong <span id="wrongN" class="kb">0</span></button>
    <span class="hint"><b>A–D</b> / <b>1–4</b> answer · <b>→</b> next</span>
  </footer>
</div>

<script>
const DATA=[{"id": 1, "topic": "OPT", "topicName": "Optimization & demand", "type": "reveal", "difficulty": "med", "q": "Frank buys bananas (x) and oranges (y). His budget line changes from y=30−2x to y=20−x. A possible explanation?", "explain": "Vertical intercept m/py falls 30 to 20 and slope size px/py falls 2 to 1. Holding px fixed, py must rise (slope px/py halves) and m must rise (old 30·py = 15·px is below new 20·py = 20·px), so oranges' price and income both increased.", "a": "The price of oranges and Frank's income both increased."}, {"id": 2, "topic": "OPT", "topicName": "Optimization & demand", "type": "num", "difficulty": "med", "q": "Willy: football 20 + Fortnite 30 is as good as football 50 + Fortnite 10; preferences convex. He now plays Fortnite 20 min. Minimum football time to be at least as well off? (convex ⇒ chord)", "explain": "With convex preferences the chord joining two indifferent bundles is at least as good; the midpoint of (football 20, Fortnite 30) and (football 50, Fortnite 10) is (35, 20), so at Fortnite 20 he needs football 35.", "answer": 35, "display": "35"}, {"id": 3, "topic": "OPT", "topicName": "Optimization & demand", "type": "reveal", "difficulty": "med", "q": "Peter's indifference curves: y = k/x − 2 (higher k is better). Peter strictly prefers (5,8) to which of (8,5), (9,4), (6,7)?", "explain": "Write k=(y+2)x: (5,8) gives 50 while (8,5) gives 56, (9,4) gives 54 and (6,7) gives 54; every alternative has a higher k, so Peter prefers none of them to (5,8).", "a": "None of these bundles. [k=(y+2)x: (5,8)→50, but (8,5)→56, (9,4)→54, (6,7)→54, all higher, so he prefers none of them.]"}, {"id": 4, "topic": "OPT", "topicName": "Optimization & demand", "type": "num", "difficulty": "med", "q": "Rachel consumes 5 packs blackberries + 6 oats, p(black)=2·p(oats). Income doubles, p(oats) doubles, p(black) unchanged. If she still buys 6 oats, max blackberry packs? (let p(oats)=1)", "explain": "Let p(oats)=1 so p(black)=2 and initial income = 5·2 + 6·1 = 16; after income doubles to 32 with p(oats)=2, oats cost 6·2 = 12, leaving 20 for blackberries at price 2, i.e. 10 packs.", "answer": 10, "display": "10"}, {"id": 5, "topic": "OPT", "topicName": "Optimization & demand", "type": "reveal", "difficulty": "easy", "q": "Elis loves sport most, also likes reading; reading on the horizontal axis, sport on the vertical. Her indifference curves are likely:", "explain": "Sport (vertical) is her favourite, so she sacrifices little sport for extra reading (horizontal); the MRS is small in size, giving relatively flat indifference curves (slope below 1 in absolute value).", "a": "Flatter — slope below 1 in absolute value (she gives up little sport for reading)."}, {"id": 6, "topic": "OPT", "topicName": "Optimization & demand", "type": "num", "difficulty": "med", "q": "Juliet has 400 for milk (25/bottle) and cereal. Cereal is 60 for the first 2 packs, then 80 each. She buys 3 cereal packs. How many milk bottles can she afford?", "explain": "Three cereal packs cost 60 + 60 + 80 = 200 (60 each for the first two, 80 for the third), leaving 400 minus 200 = 200 for milk at 25 each, i.e. 8 bottles.", "answer": 8, "display": "8"}, {"id": 7, "topic": "OPT", "topicName": "Optimization & demand", "type": "reveal", "difficulty": "med", "q": "Which is true? weakly vs strictly monotonic and neutral goods.", "explain": "Strict monotonicity means more of any good is strictly preferred, so no good can be neutral; only weak monotonicity permits a neutral good.", "a": "If preferences are strictly monotonic, a good can never be neutral. [weak monotonicity still allows a neutral good.]"}, {"id": 8, "topic": "OPT", "topicName": "Optimization & demand", "type": "reveal", "difficulty": "med", "q": "Tony: px doubles and py triples, income fixed. On the (x horizontal, y vertical) graph the new budget line is:", "explain": "New slope size (2·px)/(3·py) = (2/3)·(px/py) is smaller, so the line is flatter; both intercepts m/(2·px) and m/(3·py) shrink, so it lies inside the old line.", "a": "Flatter and lies below the old budget line."}, {"id": 9, "topic": "OPT", "topicName": "Optimization & demand", "type": "num", "difficulty": "med", "q": "Garry: perfect complements, 2 donuts per 1 coffee (never one without the other). Coffee horizontal, donuts vertical. Slope of the indifference curve at (2 coffees, 2 donuts)?", "explain": "With 2 donuts per coffee the kink needs donuts = 2·coffee; at (2 coffees, 2 donuts) donuts are scarce and coffee is in excess, so the point sits on the horizontal arm and the indifference-curve slope is 0.", "answer": 0, "display": "0"}, {"id": 10, "topic": "OPT", "topicName": "Optimization & demand", "type": "num", "difficulty": "med", "q": "Eve spends all income on avocados and walnuts. She can just afford (9 avocados, 10 walnuts) or (3, 12). One avocado costs 20. Her weekly income?", "explain": "Both bundles lie on the budget line: 9·20 + 10·pw = 3·20 + 12·pw gives pw = 60, so income = 9·20 + 10·60 = 780.", "answer": 780, "display": "780"}, {"id": 11, "topic": "OPT", "topicName": "Optimization & demand", "type": "num", "difficulty": "easy", "q": "Elis: u(x,y)=3x(y<sup>0.5</sup>+2), at (2,4). Marginal utility of x? [MU<sub>x</sub>=3(y<sup>0.5</sup>+2)=3(2+2)=12]", "explain": "MU_x = du/dx = 3(y^0.5 + 2); at y=4 that is 3(2+2) = 12 (it does not depend on x here).", "answer": 12, "display": "12"}, {"id": 12, "topic": "OPT", "topicName": "Optimization & demand", "type": "num", "difficulty": "hard", "q": "Henry: u(x,y)=(x+3)(y<sup>0.5</sup>+2), at (3,4). If y drops to 0, what x keeps him exactly as well off? [set (x+3)(0+2)=(6)(4)]", "explain": "Current utility (3+3)(4^0.5 + 2) = 6·4 = 24; with y=0 utility is (x+3)·2, so set 2(x+3) = 24, giving x+3 = 12 and x = 9.", "answer": 9, "display": "9"}, {"id": 13, "topic": "OPT", "topicName": "Optimization & demand", "type": "reveal", "difficulty": "med", "q": "u(x,y)=x<sup>0.7</sup>y<sup>0.3</sup> at (3,7), x horizontal. The absolute value of MRS<sub>yx</sub> is:", "explain": "Absolute MRS = (0.7/0.3)(y/x) = (7/3)(7/3) = 49/9 which is about 5.4, so it exceeds 1.", "a": "Greater than 1. [|MRS|=(0.7/0.3)(y/x)=(7/3)(7/3)=49/9≈5.4.]"}, {"id": 14, "topic": "OPT", "topicName": "Optimization & demand", "type": "reveal", "difficulty": "med", "q": "Willy always consumes 2 units of x with 3 units of y. A utility function representing his preferences could be:", "explain": "u=min(6x,4y) kinks where 6x = 4y, i.e. y = 1.5·x, which is 3 units of y for every 2 units of x, matching his fixed 2-with-3 ratio.", "a": "u=min(6x,4y) — kink at 6x=4y ⇒ y=(3/2)x, i.e. 2x with 3y. (Any positive transform such as 4·min(6x,4y) also works.)"}, {"id": 15, "topic": "OPT", "topicName": "Optimization & demand", "type": "reveal", "difficulty": "easy", "q": "Jill burns 300 cal per hour walking (w) and 500 cal per hour skiing (s), and wants to maximise calories. Her utility function might be:", "explain": "Calories are perfect substitutes; 300w + 500s, or any positive multiple such as 6w + 10s (ratio 300:500 = 6:10 = 3:5), represents maximising calories.", "a": "u(w,s)=6w+10s (perfect substitutes in the ratio of calories, 300:500 = 6:10)."}, {"id": 16, "topic": "OPT", "topicName": "Optimization & demand", "type": "reveal", "difficulty": "med", "q": "Henry: U(x1,x2)=x1 + x2<sup>0.5</sup>. His indifference curves are:", "explain": "u = x1 + sqrt(x2) is quasilinear in x1; solving x1 = U minus sqrt(x2) gives a downward slope minus 1/(2·sqrt(x2)) and positive curvature, so the curves are downward-sloping and convex.", "a": "Downward-sloping, convex curves (quasilinear in x1)."}, {"id": 17, "topic": "OPT", "topicName": "Optimization & demand", "type": "reveal", "difficulty": "hard", "q": "Two goods with always-positive marginal utilities and convex preferences. Then:", "explain": "Perfect complements have flat and vertical segments where extra units of the abundant good add zero marginal utility; strictly positive MU everywhere is incompatible, so they cannot be perfect complements.", "a": "These two goods cannot be perfect complements. [positive MU everywhere rules out the flat/vertical arms of an L-shape.]"}, {"id": 18, "topic": "OPT", "topicName": "Optimization & demand", "type": "reveal", "difficulty": "med", "q": "Which is true? strictly monotonic and perfect complements.", "explain": "On the arms of an L-shaped (complements) map, more of one good leaves utility unchanged, which violates strict monotonicity; hence strict monotonicity rules out perfect complements.", "a": "If preferences are strictly monotonic, goods can never be perfect complements."}, {"id": 19, "topic": "OPT", "topicName": "Optimization & demand", "type": "reveal", "difficulty": "hard", "q": "Which statement about the MRS is correct?", "explain": "Strict convexity forces a strictly diminishing MRS; ordinary (weak) convexity permits a constant MRS (perfect substitutes), so only the strict-convexity statement is correct.", "a": "Whenever preferences are STRICTLY convex, the MRS must be diminishing along the indifference curve. [plain convexity allows a constant MRS.]"}, {"id": 20, "topic": "OPT", "topicName": "Optimization & demand", "type": "num", "difficulty": "med", "q": "Jake: perfect complements, 2 donuts per 1 coffee. Donuts horizontal, coffee vertical. Slope of the indifference curve at (5 donuts, 2 coffees)?", "explain": "The kink needs donuts = 2·coffee; at (5 donuts, 2 coffees) only 4 donuts are needed, so donuts are in excess on the horizontal arm and the slope is 0.", "answer": 0, "display": "0"}, {"id": 21, "topic": "OPT", "topicName": "Optimization & demand", "type": "num", "difficulty": "hard", "q": "Luke: u(x,y)=x(y+1), income 30, demands 5 units of x and 1 unit of y. Price of y? [tangency + budget]", "explain": "Tangency (y+1)/x = px/py at (5,1) gives px/py = 2/5; the budget 5·px + py = 30 with px = (2/5)·py gives 3·py = 30, so py = 10.", "answer": 10, "display": "10"}, {"id": 22, "topic": "OPT", "topicName": "Optimization & demand", "type": "num", "difficulty": "med", "q": "Susan: u=min(4x,3y), income 30, px=2, consumes 3 units of x. Price of y? [kink 4x=3y ⇒ y=4; 2·3+py·4=30]", "explain": "The complements kink 4x = 3y with x=3 gives y=4; the budget 2·3 + py·4 = 30 gives py = 6.", "answer": 6, "display": "6"}, {"id": 23, "topic": "OPT", "topicName": "Optimization & demand", "type": "reveal", "difficulty": "med", "q": "Consumer's optimum has MU_beef/MU_pork &gt; p_beef/p_pork. Then she must:", "explain": "MU_beef/MU_pork greater than p_beef/p_pork rearranges to MU_beef/p_beef greater than MU_pork/p_pork; the last crown spent on beef beats pork everywhere, so the optimum is a corner with beef only.", "a": "Be consuming beef but no pork (corner: the last crown on beef beats pork)."}, {"id": 24, "topic": "OPT", "topicName": "Optimization & demand", "type": "num", "difficulty": "med", "q": "Rachel: u=4x+2y (coffee x, tea y), px=3, py=1, income 12. Cups of tea? [MU per crown: tea 2/1=2 vs coffee 4/3≈1.33 ⇒ all on tea]", "explain": "Perfect substitutes: compare marginal utility per crown, coffee 4/3 (about 1.33) against tea 2/1 = 2; tea yields more utility per crown, so she spends all 12 on tea, giving 12 cups.", "answer": 12, "display": "12"}, {"id": 25, "topic": "OPT", "topicName": "Optimization & demand", "type": "reveal", "difficulty": "med", "q": "Fanta &amp; Mirinda are one-for-one perfect substitutes. He bought 15 Fanta and 0 Mirinda. Which statement MUST be false?", "explain": "Buying only Fanta among one-for-one substitutes needs Fanta to be weakly cheaper (equal marginal utilities), so 'Fanta is more expensive than Mirinda' must be false.", "a": "Fanta is more expensive than Mirinda. [buying only Fanta needs Fanta weakly cheaper, so 'Fanta more expensive' is impossible.]"}, {"id": 26, "topic": "OPT", "topicName": "Optimization & demand", "type": "reveal", "difficulty": "med", "q": "In-kind vs cash transfer: when is the consumer as well off with cash as with an in-kind transfer of equal value?", "explain": "Cash weakly dominates an in-kind grant; they are equivalent only when the in-kind constraint does not bind, that is when she would already buy at least that much of the good.", "a": "If she usually consumes plenty of that good in her optimum (the in-kind constraint does not bind)."}, {"id": 27, "topic": "OPT", "topicName": "Optimization & demand", "type": "reveal", "difficulty": "med", "q": "Susan: p_ham=6, p_cheese=8, MU_ham=10, MU_cheese=7. Then:", "explain": "MU per crown is 10/6 (about 1.67) for ham against 7/8 (about 0.88) for cheese; since ham gives more utility per crown, shifting spending toward ham raises utility.", "a": "Without changing spending she could raise utility by consuming more ham and less cheese. [MU/p: 10/6 &gt; 7/8.]"}, {"id": 28, "topic": "OPT", "topicName": "Optimization & demand", "type": "reveal", "difficulty": "hard", "q": "Jim treats car-rental days and gasoline as perfect complements (3 gallons/day). The car-rental price doubles; other prices and the budget unchanged. Which is TRUE?", "explain": "With gasoline and days in a fixed 3-to-1 ratio, both fall in the same proportion; days = m/(r+3g) becomes m/(2r+3g), and (r+3g)/(2r+3g) exceeds 1/2, so each falls by less than 50%.", "a": "His gasoline use and rental days both fall by LESS than 50%."}, {"id": 29, "topic": "OPT", "topicName": "Optimization & demand", "type": "reveal", "difficulty": "hard", "q": "Peter: continuous, strictly convex, monotonic preferences, but a NON-convex budget set. Which statement is FALSE?", "explain": "With a non-convex budget set a tangency (MRS = budget slope) can be only a local optimum, so 'a tangency must be an optimum' is the false statement.", "a": "'If a bundle satisfies MRS = budget slope, it must be an optimum.' [with a non-convex budget the tangency can be a local, not global, best — so this is false.]"}, {"id": 30, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "easy", "q": "A consumer has income 40, px=4, py=2. If she spends everything on good x, how many units can she buy (the x-intercept of the budget line)?", "explain": "The x-intercept is m/px = 40/4 = 10 units.", "opts": ["10", "20", "8", "5"], "correct": 0}, {"id": 31, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "easy", "q": "With px=3 and py=6 (good x on the horizontal axis), the slope of the budget line is:", "explain": "The budget-line slope is minus px/py = minus 3/6 = minus 1/2.", "opts": ["minus 1/2", "minus 2", "minus 1/3", "minus 3"], "correct": 0}, {"id": 32, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "easy", "q": "A shop gives a uniform 50 percent discount on every good. The budget line:", "explain": "Cutting every price by the same proportion is like raising real income: the line shifts outward parallel with no kink.", "opts": ["shifts outward parallel to the old one, with no kink", "develops a kink at the discount point", "pivots inward about the y-intercept", "does not move"], "correct": 0}, {"id": 33, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "easy", "q": "Income rises from 60 to 90 with both prices unchanged. The budget line:", "explain": "A pure income change leaves the price ratio (slope) fixed, so the line shifts outward parallel.", "opts": ["shifts outward parallel to the old one", "becomes steeper", "becomes flatter", "pivots about the y-intercept"], "correct": 0}, {"id": 34, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "easy", "q": "The vertical intercept (on the good-y axis) of the budget line px·x + py·y = m equals:", "explain": "Setting x=0 gives py·y = m, so the vertical intercept is m/py.", "opts": ["m/py", "m/px", "minus px/py", "px/py"], "correct": 0}, {"id": 35, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "easy", "q": "The budget-line slope minus px/py represents:", "explain": "The slope minus px/py is the market rate of exchange: how many units of y must be given up to buy one more x.", "opts": ["the market rate at which x can be traded for y", "the consumer's marginal utility", "the consumer's income", "the level of utility"], "correct": 0}, {"id": 36, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "easy", "q": "At an interior (tangency) optimum, the marginal rate of substitution equals:", "explain": "The tangency condition sets the MRS equal to the price ratio px/py.", "opts": ["px/py", "py/px", "m/px", "0"], "correct": 0}, {"id": 37, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "easy", "q": "For Cobb-Douglas utility u = xᵃyᵇ, the share of income spent on good x is:", "explain": "Cobb-Douglas demand gives a constant expenditure share of a/(a+b) on good x.", "opts": ["a/(a+b)", "b/(a+b)", "a/b", "1/2"], "correct": 0}, {"id": 38, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "easy", "q": "For u = xᵃyᵇ the Marshallian demand x* = (a/(a+b))·m/px depends on:", "explain": "The Cobb-Douglas demand for x involves only income and its own price; py cancels out.", "opts": ["m and px only", "m, px and py", "px and py only", "m only"], "correct": 0}, {"id": 39, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "easy", "q": "For perfect substitutes u = ax + by, the consumer buys only good x when:", "explain": "Spend where marginal utility per crown is highest; only x is bought when a/px exceeds b/py.", "opts": ["a/px is greater than b/py", "a/px is less than b/py", "px is greater than py", "a is less than b"], "correct": 0}, {"id": 40, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "easy", "q": "For perfect complements u = min(x, y), the optimum always lies where:", "explain": "The L-shaped map has its kink on the ray x = y, where neither good is wasted.", "opts": ["x = y", "x = 2y", "px·x = py·y", "x + y = m"], "correct": 0}, {"id": 41, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "easy", "q": "When income rises and prices are fixed, the demand for a normal good:", "explain": "A normal good is defined by demand that rises with income.", "opts": ["rises", "falls", "stays the same", "becomes zero"], "correct": 0}, {"id": 42, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "easy", "q": "When income rises and prices are fixed, the demand for an inferior good:", "explain": "An inferior good is defined by demand that falls as income rises.", "opts": ["falls", "rises", "stays the same", "doubles"], "correct": 0}, {"id": 43, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "easy", "q": "Bruno's owner has 24 crowns for biscuits (px=3) and chews. Spending all of it on biscuits, how many biscuits can she buy?", "explain": "The biscuit intercept is 24/3 = 8 biscuits.", "opts": ["8", "6", "4", "12"], "correct": 0}, {"id": 44, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "easy", "q": "The horizontal intercept (on the good-x axis) of the budget line equals:", "explain": "Setting y=0 gives px·x = m, so the horizontal intercept is m/px.", "opts": ["m/px", "m/py", "minus px/py", "px·py"], "correct": 0}, {"id": 45, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "easy", "q": "For perfect substitutes u = ax + by, the optimum is generally:", "explain": "Straight-line indifference curves give a corner solution unless px/py exactly equals a/b.", "opts": ["a corner, unless the price ratio equals the MRS", "always interior", "always at x = y", "undefined"], "correct": 0}, {"id": 46, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "easy", "q": "A consumer is equally well off with cash as with an in-kind gift of the same value when:", "explain": "Cash weakly dominates; the two coincide only when the in-kind constraint does not bind.", "opts": ["she would have bought at least that much of the good anyway", "she dislikes the good", "the good is inferior", "the in-kind constraint binds"], "correct": 0}, {"id": 47, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "easy", "q": "If px rises while py and income stay fixed, the budget line:", "explain": "The y-intercept m/py is unchanged, the x-intercept m/px shrinks, so the line pivots inward and steepens.", "opts": ["pivots inward about the y-intercept and becomes steeper", "shifts outward parallel", "becomes flatter", "does not change"], "correct": 0}, {"id": 48, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "easy", "q": "For Cobb-Douglas u = xᵃyᵇ, doubling income (prices fixed) changes the demand for x so that:", "explain": "Cobb-Douglas demand x* = (a/(a+b))·m/px is proportional to income, so doubling m doubles x (income elasticity 1).", "opts": ["it doubles", "it is unchanged", "it halves", "it quadruples"], "correct": 0}, {"id": 49, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "easy", "q": "If px falls while py and income stay fixed, the budget line becomes:", "explain": "A lower px raises the x-intercept while the y-intercept is fixed, so the line pivots outward and flattens.", "opts": ["flatter, pivoting outward about the y-intercept", "steeper", "parallel-shifted inward", "unchanged"], "correct": 0}, {"id": 50, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "easy", "q": "For Bruno, hockey minutes and football minutes are one-for-one perfect substitutes (u = h + f), and hockey is cheaper. He spends:", "explain": "With identical marginal utilities he buys only the cheaper good, hockey.", "opts": ["everything on hockey", "everything on football", "half on each", "nothing"], "correct": 0}, {"id": 51, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "med", "q": "u = xy with income 40, px=2, py=4. The optimal quantity of x is:", "explain": "Cobb-Douglas with equal exponents: x* = (1/2)·m/px = (1/2)·40/2 = 10.", "opts": ["10", "5", "20", "8"], "correct": 0}, {"id": 52, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "med", "q": "u = xy with income 40, px=2, py=4. The optimal quantity of y is:", "explain": "y* = (1/2)·m/py = (1/2)·40/4 = 5.", "opts": ["5", "10", "20", "4"], "correct": 0}, {"id": 53, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "med", "q": "u = x^0.5·y^0.5, income 100, px=5. The optimal quantity of x is:", "explain": "Equal exponents give x* = (1/2)·m/px = (1/2)·100/5 = 10.", "opts": ["10", "20", "5", "50"], "correct": 0}, {"id": 54, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "med", "q": "u = x^0.3·y^0.7, income 60, px=3. The optimal quantity of x is:", "explain": "x* = (0.3/(0.3+0.7))·m/px = 0.3·60/3 = 6.", "opts": ["6", "14", "2", "20"], "correct": 0}, {"id": 55, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "med", "q": "u = x^0.4·y^0.6, income 200. Total spending on good y is:", "explain": "The y-share is 0.6, so spending on y is 0.6·200 = 120.", "opts": ["120", "80", "100", "200"], "correct": 0}, {"id": 56, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "med", "q": "u = 2x + 3y (perfect substitutes), px=2, py=2, income 12. The optimal quantity of y is:", "explain": "Marginal utility per crown is 2/2 = 1 for x and 3/2 = 1.5 for y, so all income goes to y: 12/2 = 6.", "opts": ["6", "4", "3", "12"], "correct": 0}, {"id": 57, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "med", "q": "u = x + y (one-for-one substitutes), px=3, py=4, income 24. The optimal quantity of x is:", "explain": "With equal marginal utilities he buys only the cheaper good x: 24/3 = 8.", "opts": ["8", "6", "0", "12"], "correct": 0}, {"id": 58, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "med", "q": "u = min(x, y), px=2, py=3, income 25. The optimal quantity of x is:", "explain": "On the ray x = y the budget is (px+py)·x = m, so x = 25/(2+3) = 5.", "opts": ["5", "25", "10", "12"], "correct": 0}, {"id": 59, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "med", "q": "u = min(2x, y) so the optimum needs y = 2x. With px=3, py=1, income 20, the optimal quantity of x is:", "explain": "Substitute y = 2x into the budget: 3x + 1·2x = 5x = 20, so x = 4.", "opts": ["4", "8", "2", "5"], "correct": 0}, {"id": 60, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "med", "q": "Income is 100 and py is fixed. If px rises from 5 to 10, the x-intercept of the budget line becomes:", "explain": "The x-intercept is m/px = 100/10 = 10 (down from 100/5 = 20).", "opts": ["10", "20", "5", "15"], "correct": 0}, {"id": 61, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "med", "q": "Income and px both double while py is fixed. The maximum affordable quantity of x:", "explain": "The x-intercept m/px becomes (2m)/(2px) = m/px, so it is unchanged.", "opts": ["is unchanged", "doubles", "halves", "quadruples"], "correct": 0}, {"id": 62, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "med", "q": "For Bruno one beef treat is worth two chicken treats (u = 2·beef + chicken). Beef costs 3, chicken 2. He buys:", "explain": "Marginal utility per crown is 2/3 (about 0.67) for beef and 1/2 for chicken, so beef wins: only beef.", "opts": ["only beef", "only chicken", "a mix of both", "nothing"], "correct": 0}, {"id": 63, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "med", "q": "u = min(x, y), income 20, py=1. If px rises from 3 to 7, the optimal quantity of x changes from 5 to:", "explain": "On x = y the demand is x = m/(px+py) = 20/(7+1) = 2.5.", "opts": ["2.5", "5", "2", "4"], "correct": 0}, {"id": 64, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "med", "q": "u = x^0.7·y^0.3 at the bundle (x=4, y=2). The absolute value of the MRS of x for y is:", "explain": "Absolute MRS = (0.7/0.3)(y/x) = (7/3)(2/4) = 7/6.", "opts": ["7/6", "6/7", "3/7", "7/3"], "correct": 0}, {"id": 65, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "med", "q": "u = x^(1/3)·y^(2/3), income 90, px=2. The optimal quantity of x is:", "explain": "x* = (1/3)·m/px = (1/3)·90/2 = 15.", "opts": ["15", "30", "45", "10"], "correct": 0}, {"id": 66, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "med", "q": "Film tickets f and streaming s give u = f^0.25·s^0.75. Income 48, price of a film ticket 4. The optimal number of film tickets is:", "explain": "f* = 0.25·m/pf = 0.25·48/4 = 3.", "opts": ["3", "9", "12", "4"], "correct": 0}, {"id": 67, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "hard", "q": "A consumer just exhausts income on either (12 units x, 3 units y) or (6 units x, 9 units y). If py=2, then px equals:", "explain": "Both bundles cost the same: 12·px + 3·2 = 6·px + 9·2, so 6·px = 12 and px = 2.", "opts": ["2", "3", "4", "1"], "correct": 0}, {"id": 68, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "hard", "q": "A consumer just exhausts income on either (9 units x, 2 units y) or (3 units x, 6 units y). If px=2, her income is:", "explain": "From 9·2 + 2·py = 3·2 + 6·py we get py = 3, so income = 9·2 + 2·3 = 24.", "opts": ["24", "30", "18", "36"], "correct": 0}, {"id": 69, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "hard", "q": "u = x²·y (so a=2, b=1), income 90, px=6. The optimal quantity of x is:", "explain": "x* = (a/(a+b))·m/px = (2/3)·90/6 = 10.", "opts": ["10", "5", "15", "20"], "correct": 0}, {"id": 70, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "hard", "q": "For u = 4x + 2y the consumer is willing to hold both goods (an interior optimum) only if px/py equals:", "explain": "Interior optima for perfect substitutes require the price ratio to equal the MRS a/b = 4/2 = 2.", "opts": ["2", "1/2", "4", "8"], "correct": 0}, {"id": 71, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "hard", "q": "For perfect complements u = min(3x, 4y) with px=2 and py=1, the own-price elasticity of demand for good y is:", "explain": "Demand y = m/((4/3)px + py); its own-price elasticity is minus 3py/(4px+3py) = minus 3/11 at px=2, py=1.", "opts": ["minus 3/11", "minus 8/11", "minus 1", "minus 6/11"], "correct": 0}, {"id": 72, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "hard", "q": "For perfect complements the two goods are always consumed together. Hence the cross-price elasticity of x with respect to py and the own-price elasticity of y are:", "explain": "Because x and y move in lockstep (fixed ratio), the percentage change in x equals that in y for any price change, so the two elasticities coincide.", "opts": ["equal", "equal in size but opposite in sign", "completely unrelated", "both exactly zero"], "correct": 0}, {"id": 73, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "hard", "q": "Demand is x = 0.04m minus 0.5·px. At m=1000 and px=20, the quantity demanded is:", "explain": "x = 0.04·1000 minus 0.5·20 = 40 minus 10 = 30.", "opts": ["30", "40", "10", "20"], "correct": 0}, {"id": 74, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "hard", "q": "Demand is x = 0.04m minus 0.5·px, giving x = 30 at m=1000, px=20. The income elasticity of demand is:", "explain": "Income elasticity = (dx/dm)(m/x) = 0.04·(1000/30) = 4/3 (a luxury at this point).", "opts": ["4/3", "3/4", "1", "4"], "correct": 0}, {"id": 75, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "hard", "q": "For the demand x = 0.04m minus 0.5·px, good x is:", "explain": "The income coefficient dx/dm = 0.04 is positive, so demand rises with income and x is normal.", "opts": ["normal, because demand rises with income", "inferior, because demand falls with income", "a Giffen good", "a perfect substitute"], "correct": 0}, {"id": 76, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "hard", "q": "u = min(2x, 5y) so the optimum needs 2x = 5y. With px=4, py=3, income 26, the optimal quantity of x is:", "explain": "Substitute y = (2/5)x into the budget: 4x + 3·(2/5)x = 5.2x = 26, so x = 5 (and y = 2).", "opts": ["5", "2", "4", "10"], "correct": 0}, {"id": 77, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "hard", "q": "u = x²·y³ (so a=2, b=3), income 100. Total spending on good x is:", "explain": "The x-share is a/(a+b) = 2/5, so spending on x is (2/5)·100 = 40.", "opts": ["40", "60", "50", "20"], "correct": 0}, {"id": 78, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "hard", "q": "u = (x+2)(y^0.5 + 1) at the bundle (x=2, y=9). If y falls to 0, the quantity of x that keeps utility unchanged is:", "explain": "Current utility is (2+2)(3+1) = 16; with y=0 it is (x+2)·1, so x + 2 = 16 gives x = 14.", "opts": ["14", "12", "10", "16"], "correct": 0}, {"id": 79, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "hard", "q": "u = xy, px=2, py=5, income 60. At the optimum the MRS y/x equals px/py. The optimal quantity of x is:", "explain": "Equal-exponent Cobb-Douglas: x* = (1/2)·m/px = (1/2)·60/2 = 15 (then y = 6, and y/x = 6/15 = 2/5 = px/py).", "opts": ["15", "6", "12", "10"], "correct": 0}, {"id": 80, "topic": "OPT", "topicName": "Optimization & demand", "type": "mc", "difficulty": "hard", "q": "For perfect complements u = min(3x, 4y) with px=2 and py=1, the own-price elasticity of demand for good x is:", "explain": "Demand x = m/(px + (3/4)py); its own-price elasticity is minus 4px/(4px+3py) = minus 8/11 at px=2, py=1.", "opts": ["minus 8/11", "minus 3/11", "minus 1", "minus 4/11"], "correct": 0}, {"id": 81, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "hard", "q": "Strict monotonicity implies indifference curves are:", "explain": "Strong (strict) monotonicity means adding to even one good strictly improves the bundle, so indifference curves can have no flat or vertical segment and must slope strictly downward.", "opts": ["horizontal", "upward sloping", "strictly downward sloping", "vertical"], "correct": 2}, {"id": 82, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "med", "q": "Which assumption guarantees that two indifference curves never cross?", "explain": "Transitivity (A≽B and B≽C ⇒ A≽C) prevents indifference curves from crossing; a crossing would force one bundle to be both strictly better than and indifferent to another.", "opts": ["transitivity", "monotonicity", "continuity", "convexity"], "correct": 0}, {"id": 83, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "easy", "q": "“A balanced mix is at least as good as either extreme” describes:", "explain": "Convexity is the axiom that a balanced mix (average) of two bundles is at least as good as either extreme.", "opts": ["monotonicity", "completeness", "convexity", "continuity"], "correct": 2}, {"id": 84, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "med", "q": "A diminishing MRS (in absolute value) as you move right is a consequence of strict:", "explain": "A diminishing MRS (curves bowed toward the origin) follows from strict convexity of preferences, not from monotonicity or the rationality axioms.", "opts": ["monotonicity", "transitivity", "reflexivity", "convexity"], "correct": 3}, {"id": 85, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "hard", "q": "Perfect-complement (Leontief) preferences violate strict:", "explain": "Perfect complements min(x,y) fail STRONG monotonicity: at x=y, adding only the abundant good leaves the min (and utility) unchanged, so 'more of one good' is not strictly better. They remain continuous, transitive and complete. (Original distractor 'convexity' was replaced: Leontief also fails strict convexity, which made two options correct.)", "opts": ["continuity", "transitivity", "monotonicity", "completeness"], "correct": 2}, {"id": 86, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "med", "q": "Which assumption ensures that an indifference curve passes through every bundle?", "explain": "Completeness — every pair of bundles can be ranked — guarantees every bundle is assigned to an indifference set, so an indifference curve passes through each bundle.", "opts": ["monotonicity", "transitivity", "convexity", "completeness"], "correct": 3}, {"id": 87, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "med", "q": "Bill finds C₁∼C₂∼C₃∼C₄∼C₅∼C₆ pairwise, yet strictly prefers C₁ to C₆. This violates:", "explain": "Chaining the indifferences C₁∼C₂∼…∼C₆ must give C₁∼C₆ by transitivity; a strict preference C₁≻C₆ contradicts it, so transitivity is violated.", "opts": ["completeness", "transitivity", "monotonicity", "reflexivity"], "correct": 1}, {"id": 88, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "med", "q": "For a consumer with a bliss point, moving beyond the bliss point violates:", "explain": "Past a bliss point more of a good lowers utility, so 'more is better' — monotonicity — fails there.", "opts": ["monotonicity", "transitivity", "continuity", "completeness"], "correct": 0}, {"id": 89, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "easy", "q": "In the lecture, “well-behaved” preferences are monotonic, convex, and:", "explain": "In the course, 'well-behaved' preferences are monotonic, convex and continuous.", "opts": ["reflexive", "continuous", "complete", "transitive"], "correct": 1}, {"id": 90, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "med", "q": "Good y is a “bad” (y vertical, good x horizontal). Its indifference curves are:", "explain": "If y is a bad, more y lowers utility, so to stay indifferent an increase in the good x must be matched by more of the bad y — the indifference curve slopes upward.", "opts": ["downward sloping", "upward sloping", "L-shaped", "vertical"], "correct": 1}, {"id": 91, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "easy", "q": "Perfect substitutes have indifference curves that are:", "explain": "Perfect substitutes have a constant MRS, so their indifference curves are straight lines with constant slope.", "opts": ["straight lines with constant slope", "L-shaped", "circles", "upward sloping"], "correct": 0}, {"id": 92, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "med", "q": "If good 1 (horizontal axis) is a neutral good, its indifference curves are:", "explain": "A neutral good on the horizontal axis does not affect utility, so utility depends only on good 2; indifference curves are horizontal lines (constant good 2).", "opts": ["vertical", "L-shaped", "horizontal", "upward sloping"], "correct": 2}, {"id": 93, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "easy", "q": "“More is better” is the everyday name for:", "explain": "'More is better' is the everyday statement of monotonicity.", "opts": ["convexity", "monotonicity", "transitivity", "continuity"], "correct": 1}, {"id": 94, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "med", "q": "Which indifference curve does NOT slope downward?", "explain": "If good 2 (vertical axis) is a bad, its indifference curves slope upward, not downward; the other cases all slope down.", "opts": ["Cobb-Douglas", "perfect substitutes", "one where good 2 is a bad", "well-behaved"], "correct": 2}, {"id": 95, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "easy", "q": "The indifference “curves” for a bliss point look like:", "explain": "Around a bliss point utility falls in every direction, so indifference sets are closed loops (concentric ovals) around it.", "opts": ["closed loops around the bliss point", "straight lines", "an L", "horizontal lines"], "correct": 0}, {"id": 96, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "easy", "q": "Completeness means:", "explain": "Completeness means any two bundles can be compared: A≽B, B≽A, or both.", "opts": ["preferences never cycle", "any two bundles can be compared", "more is better", "curves bow inward"], "correct": 1}, {"id": 97, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "med", "q": "If indifference curves are straight, downward-sloping lines, the two goods are:", "explain": "Straight, downward-sloping indifference lines (constant MRS) are the signature of perfect substitutes.", "opts": ["perfect complements", "neutral goods", "perfect substitutes", "one is a bad"], "correct": 2}, {"id": 98, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "easy", "q": "Strictly convex preferences have indifference curves that are:", "explain": "Strictly convex preferences give indifference curves that bow toward the origin (diminishing MRS).", "opts": ["bowed toward the origin", "straight", "bowed away from the origin", "vertical"], "correct": 0}, {"id": 99, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "med", "q": "Transitivity is the assumption that rules out:", "explain": "Transitivity rules out crossing indifference curves; a crossing would violate the consistency A≽B, B≽C ⇒ A≽C.", "opts": ["thick curves", "indifference curves that cross", "upward-sloping curves", "kinks"], "correct": 1}, {"id": 100, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "med", "q": "A consumer likes pepperoni (horizontal) and dislikes anchovies (vertical). The curves:", "explain": "Pepperoni is a good (horizontal), anchovies a bad (vertical); to stay indifferent more pepperoni must be offset by more anchovies, so the curve slopes upward.", "opts": ["slope downward", "are vertical", "are horizontal", "slope upward"], "correct": 3}, {"id": 101, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "easy", "q": "Weak monotonicity says:", "explain": "Weak monotonicity: a bundle with at least as much of every good is at least as good (a weak improvement).", "opts": ["more of every good makes you at least as well off", "indifference curves cross", "averages beat extremes", "you can always rank two bundles"], "correct": 0}, {"id": 102, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "easy", "q": "Strict convexity makes the indifference curve:", "explain": "Strict convexity makes indifference curves bow toward the origin.", "opts": ["a straight line", "slope upward", "bow toward the origin", "vertical"], "correct": 2}, {"id": 103, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "med", "q": "Which pairing gives L-shaped curves?", "explain": "A left and a right shoe are consumed in fixed proportion (perfect complements), giving L-shaped indifference curves.", "opts": ["two identical treats", "a left and a right shoe", "treats and baths", "treats and collar colour"], "correct": 1}, {"id": 104, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "med", "q": "A dog ignores collar colour (horizontal axis); only treats (vertical) matter. The curves are:", "explain": "Collar colour on the horizontal axis is a neutral good, so utility depends only on treats (vertical); indifference curves are horizontal lines.", "opts": ["vertical lines", "L-shaped", "upward sloping", "horizontal lines"], "correct": 3}, {"id": 105, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "easy", "q": "Diminishing MRS means that, moving right along the curve, the consumer gives up:", "explain": "Diminishing MRS: moving right (more good 1), the consumer gives up less and less good 2 per additional unit of good 1.", "opts": ["more good 2 per extra good 1", "less good 2 per extra good 1", "the same amount always", "nothing at all"], "correct": 1}, {"id": 106, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "easy", "q": "Transitivity guarantees:", "explain": "Transitivity guarantees indifference curves do not cross.", "opts": ["curves slope downward", "more is better", "curves are smooth", "curves do not cross"], "correct": 3}, {"id": 107, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "easy", "q": "Continuity guarantees:", "explain": "Continuity guarantees no sudden jumps in preference: bundles close together are ranked similarly.", "opts": ["no sudden jumps in preference", "more is better", "averages beat extremes", "any two bundles are comparable"], "correct": 0}, {"id": 108, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "med", "q": "Perfect substitutes u=2x+3y have a constant MRS (of x for y) equal to:", "explain": "MRS of x for y = MUx/MUy = 2/3 for u=2x+3y, and it is constant (perfect substitutes).", "opts": ["3/2", "2/3", "1", "6"], "correct": 1}, {"id": 109, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "easy", "q": "Which is NOT one of the three rationality axioms?", "explain": "The three rationality axioms are completeness, transitivity and reflexivity; convexity is a shape assumption, not a rationality axiom.", "opts": ["completeness", "transitivity", "convexity", "reflexivity"], "correct": 2}, {"id": 110, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "med", "q": "Which is NOT part of “well-behaved” preferences (lecture version)?", "explain": "'Well-behaved' preferences are monotonic, convex and continuous; completeness is a separate rationality axiom, not part of the well-behaved shape assumptions.", "opts": ["monotonicity", "convexity", "continuity", "completeness"], "correct": 3}, {"id": 111, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "med", "q": "If more of a good eventually makes you worse off (satiation), which fails there?", "explain": "Satiation means more of a good eventually lowers utility, which violates monotonicity ('more is better').", "opts": ["transitivity", "monotonicity", "completeness", "continuity"], "correct": 1}, {"id": 112, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "easy", "q": "Straight, parallel, downward-sloping indifference lines belong to:", "explain": "Straight, parallel, downward-sloping indifference lines (constant MRS) represent perfect substitutes.", "opts": ["perfect complements", "a bad", "perfect substitutes", "a bliss point"], "correct": 2}, {"id": 113, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "med", "q": "For u=min(x,y) at a bundle with x=y, adding only more x:", "explain": "For u=min(x,y) at x=y the goods are balanced; adding only more x raises the larger argument, so the min — and utility — is unchanged.", "opts": ["leaves utility unchanged", "increases utility", "decreases utility", "doubles utility"], "correct": 0}, {"id": 114, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "easy", "q": "A consumer who likes variety has indifference curves that are:", "explain": "A taste for variety means averages are preferred to extremes (convexity), so indifference curves bow toward the origin.", "opts": ["straight lines", "bowed toward the origin", "bowed away from the origin", "upward sloping"], "correct": 1}, {"id": 115, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "easy", "q": "Two indifference curves from the same preference map:", "explain": "Two indifference curves from one consistent (transitive) preference map can never cross.", "opts": ["can cross once", "can cross twice", "can never cross", "meet at the origin"], "correct": 2}, {"id": 116, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "med", "q": "With a good on the horizontal axis and a bad on the vertical axis, higher utility is found by moving:", "explain": "With a good on the horizontal axis and a bad on the vertical, utility rises by getting more of the good and less of the bad — moving down and to the right.", "opts": ["up and right", "down and right", "up and left", "down and left"], "correct": 1}, {"id": 117, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "med", "q": "Strict monotonicity rules out indifference curves that are:", "explain": "Strong (strict) monotonicity forbids flat or vertical segments, since adding to either good must strictly improve the bundle.", "opts": ["downward sloping", "bowed inward", "smooth", "flat or vertical anywhere"], "correct": 3}, {"id": 118, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "easy", "q": "The slope of an indifference curve is called the:", "explain": "The (absolute) slope of an indifference curve is the marginal rate of substitution (MRS).", "opts": ["marginal utility", "price ratio", "marginal rate of substitution", "budget line"], "correct": 2}, {"id": 119, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "med", "q": "A dog prefers park to yard and yard to couch. By transitivity it prefers:", "explain": "Transitivity applied to strict preference: park≻yard and yard≻couch imply park≻couch.", "opts": ["park to couch", "couch to park", "yard to park", "can't tell"], "correct": 0}, {"id": 120, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "easy", "q": "Which utility function represents perfect complements?", "explain": "u=min(x,y) is the fixed-proportion (Leontief) form representing perfect complements.", "opts": ["u=x+y", "u=xy", "u=2x+5y", "u=min(x,y)"], "correct": 3}, {"id": 121, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "easy", "q": "Reflexivity of preferences says that:", "explain": "Reflexivity states that every bundle is at least as good as itself (X≽X); it is one of the three rationality axioms alongside completeness and transitivity.", "opts": ["every bundle is at least as good as itself", "more is always better", "averages beat extremes", "any two bundles can be ranked"], "correct": 0}, {"id": 122, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "med", "q": "Local non-satiation means that, however small the neighbourhood around a bundle, there is:", "explain": "Local non-satiation: for any bundle and any radius ε there exists a bundle within ε that is strictly preferred, ruling out thick indifference bands and local bliss points.", "opts": ["a nearby bundle that is strictly preferred", "only strictly worse bundles nearby", "no better bundle anywhere", "a local bliss point"], "correct": 0}, {"id": 123, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "med", "q": "Under monotonicity, an indifference curve lying farther from the origin represents:", "explain": "Monotonicity (more is better) means a bundle with more of both goods is preferred, so indifference curves farther from the origin are strictly better.", "opts": ["a strictly higher level of utility", "a lower level of utility", "the same utility", "an undefined utility"], "correct": 0}, {"id": 124, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "hard", "q": "If u(x,y)=xy represents a consumer's preferences, which function represents the SAME preferences?", "explain": "Utility is ordinal: only strictly increasing transforms preserve preferences. ln x + ln y = ln(xy) applies the increasing function ln to xy (same ranking); the other three are decreasing in xy and reverse the order. Verified by identical MRS = y/x.", "opts": ["ln x + ln y", "10 − xy", "1/(xy)", "−xy"], "correct": 0}, {"id": 125, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "hard", "q": "Applying which transformation to a utility function would CHANGE the preferences it represents?", "explain": "Only strictly increasing transforms preserve preferences. g(u)=−u is strictly decreasing (g′=−1 less than 0), so it reverses the ranking; +5, ×2 and ln are strictly increasing and leave preferences unchanged.", "opts": ["taking the negative, g(u)=−u", "adding a constant, g(u)=u+5", "multiplying by 2, g(u)=2u", "taking logs, g(u)=ln u for u greater than 0"], "correct": 0}, {"id": 126, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "hard", "q": "Perfect complements u=min(x,y) satisfy weak monotonicity but fail strong monotonicity because, starting from x=y:", "explain": "Strong monotonicity requires that adding to even one good makes you strictly better off. At x=y, min(x,y) is unchanged when only the abundant good rises, so strong monotonicity fails while weak monotonicity (more of BOTH is at least as good) still holds.", "opts": ["adding only one good leaves utility unchanged", "adding both goods lowers utility", "utility becomes undefined", "the bundles cannot be compared"], "correct": 0}, {"id": 127, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "easy", "q": "The marginal rate of substitution (MRS) at a bundle equals:", "explain": "The MRS is the (absolute) slope of the indifference curve, equal to the ratio of marginal utilities MUx/MUy — the amount of good 2 the consumer will trade for one more unit of good 1 at constant utility.", "opts": ["the absolute slope of the indifference curve, MUx/MUy", "the slope of the budget line", "the marginal utility of income", "total utility divided by quantity"], "correct": 0}, {"id": 128, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "med", "q": "Moving down-right along a convex indifference curve (more x₁, less x₂), diminishing MRS means:", "explain": "Moving right, x₁ becomes abundant and x₂ scarce, so MUx falls and MUy rises; the ratio MRS = MUx/MUy declines. That is diminishing MRS, the hallmark of convex preferences.", "opts": ["MUx falls relative to MUy, so the MRS shrinks", "MUx rises relative to MUy", "both marginal utilities stay fixed", "total utility falls"], "correct": 0}, {"id": 129, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "hard", "q": "Bundles A = (5,5) and B = (6,4). Strong monotonicity ALONE tells us:", "explain": "Monotonicity ranks a bundle above another only when it has at least as much of every good. Here A has more x₂ but less x₁, so neither dominates and monotonicity alone cannot rank them.", "opts": ["nothing — neither bundle has at least as much of BOTH goods", "A is strictly preferred to B", "B is strictly preferred to A", "A and B are indifferent"], "correct": 0}, {"id": 130, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "med", "q": "A consumer says: “I simply cannot compare bundle A and bundle B.” This directly violates:", "explain": "Completeness requires that for any two bundles the consumer can state A≽B, B≽A, or both; declaring two bundles incomparable violates completeness (not transitivity, which concerns chains of rankings).", "opts": ["completeness", "transitivity", "monotonicity", "convexity"], "correct": 0}, {"id": 131, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "hard", "q": "A consumer prefers A to B and B to C, but also prefers C to A. Which axiom fails — and which still holds?", "explain": "Transitivity requires A≽B and B≽C ⇒ A≽C; the cycle A≻B≻C≻A contradicts it. Every pair is still ranked, so completeness is satisfied — the consumer is complete but intransitive.", "opts": ["transitivity fails; completeness still holds", "completeness fails; transitivity holds", "monotonicity fails; convexity holds", "continuity fails; completeness holds"], "correct": 0}, {"id": 132, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "hard", "q": "For u = x²y, the MRS (= MUx/MUy) at (x,y) = (2,3) is:", "explain": "MUx = 2xy = 12 and MUy = x² = 4, so MRS = 12/4 = 3 (equivalently MRS = (a/b)(y/x) = (2/1)(3/2) = 3). The distractors 6 and 12 are the raw marginal utilities.", "opts": ["3", "6", "2/3", "12"], "correct": 0}, {"id": 133, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "hard", "q": "Which single axiom, by itself, forces indifference curves to be both thin (not thick) and downward-sloping?", "explain": "Monotonicity ('more is better') implies that a bundle with more of both goods is strictly preferred; this rules out thick indifference bands and forces the curve to slope downward. Transitivity only prevents crossings; completeness and continuity say nothing about slope.", "opts": ["monotonicity", "completeness", "transitivity", "continuity"], "correct": 0}, {"id": 134, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "med", "q": "Bruno the dog strictly prefers a big treat to a small treat, and a small treat to a pat. If his preferences are transitive, he must:", "explain": "Transitivity applied to strict preference: big≻small and small≻pat imply big≻pat.", "opts": ["strictly prefer a big treat to a pat", "prefer a pat to a big treat", "be indifferent between a big treat and a pat", "be unable to compare them"], "correct": 0}, {"id": 135, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "hard", "q": "u = xy and v = x²y² rank all bundles identically. A quick check that they give the SAME indifference map is that:", "explain": "v = (xy)² is the increasing transform g(u)=u² of u=xy, so it represents the same preferences; both have MRS = MUx/MUy = y/x, so their indifference curves coincide.", "opts": ["both have MRS = y/x at every bundle", "both are linear", "both have a constant MRS", "v has twice the MRS of u"], "correct": 0}, {"id": 136, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "hard", "q": "Local non-satiation is WEAKER than monotonicity because it also permits:", "explain": "Monotonicity says more of every good is better; local non-satiation only requires a strictly better bundle arbitrarily close by. The latter still rules out thick curves but allows a 'bad' (you improve by consuming less of it).", "opts": ["a good to be a 'bad', as long as a strictly better bundle always exists nearby", "indifference curves to be thick", "preferences to cycle", "two bundles to be incomparable"], "correct": 0}, {"id": 137, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "med", "q": "The MRS at a bundle is determined by:", "explain": "MRS is the slope of the indifference curve — a feature of preferences. Prices set the budget line's slope; the two are equated only at an interior optimum, but the MRS itself is a preference concept.", "opts": ["the consumer's preferences (indifference-curve slope) at that bundle", "market prices only", "income only", "the budget line's intercepts"], "correct": 0}, {"id": 138, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "hard", "q": "The transform g(u) = u² preserves the preferences represented by u only when:", "explain": "g(u)=u² is strictly increasing only for u ≥ 0 (g′=2u greater than 0 there); if utility can be negative, squaring is not monotonic and scrambles the ranking. For non-negative utilities (e.g. u=xy on the positive quadrant) it is a valid monotonic transform.", "opts": ["utility is non-negative, so g is increasing on its range", "utility is negative", "the goods are perfect substitutes", "preferences are concave"], "correct": 0}, {"id": 139, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "med", "q": "For an ORDINAL utility function with u(A) = 10 and u(B) = 5, we may correctly conclude only that:", "explain": "Ordinal utility conveys only ranking: u(A) greater than u(B) means A≻B. Because any strictly increasing transform is allowed, the ratio 10/5 and the gap 10−5 carry no meaning — only the order does.", "opts": ["A is preferred to B", "A is exactly twice as good as B", "the utility gap A−B is meaningful", "B gives half the satisfaction of A"], "correct": 0}, {"id": 140, "topic": "Q1", "topicName": "Monotonicity & preferences", "type": "mc", "difficulty": "easy", "q": "Higher indifference curves being preferred to lower ones is a direct consequence of:", "explain": "Monotonicity ('more is better') is what makes bundles on indifference curves farther from the origin — which contain more of the goods — preferred.", "opts": ["monotonicity", "transitivity", "completeness", "continuity"], "correct": 0}, {"id": 141, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "easy", "q": "Price elasticity of demand measures:", "explain": "Own-price elasticity measures how quantity demanded responds to a price change: ε = (dq/dp)(p/q).", "opts": ["how much quantity responds to a price change", "how much price responds to quantity", "total revenue", "the budget line's slope"], "correct": 0}, {"id": 142, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "easy", "q": "Demand is “elastic” when the elasticity in absolute value is:", "explain": "Demand is elastic when the elasticity exceeds 1 in absolute value.", "opts": ["less than 1", "equal to 0", "greater than 1", "equal to 1"], "correct": 2}, {"id": 143, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "easy", "q": "A 10% price rise cuts quantity demanded by 20%. Demand is:", "explain": "The size of the elasticity is 20 percent over 10 percent = 2, which exceeds 1, so demand is elastic.", "opts": ["inelastic", "elastic", "unit elastic", "perfectly inelastic"], "correct": 1}, {"id": 144, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "easy", "q": "Which good is likely the most price-inelastic?", "explain": "Insulin is a life-saving necessity with no substitutes, so its demand is the most price-inelastic.", "opts": ["one brand of cola among many", "restaurant meals", "one particular airline", "life-saving insulin"], "correct": 3}, {"id": 145, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "easy", "q": "More available substitutes make demand:", "explain": "More substitutes let buyers switch away more easily, so demand becomes more elastic.", "opts": ["more elastic", "more inelastic", "unit elastic", "vertical"], "correct": 0}, {"id": 146, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "med", "q": "For an inelastic good, raising the price makes total revenue:", "explain": "For inelastic demand quantity falls proportionally less than the price rises, so total revenue rises.", "opts": ["fall", "go to zero", "rise", "stay the same"], "correct": 2}, {"id": 147, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "easy", "q": "A negative income elasticity means the good is:", "explain": "A negative income elasticity defines an inferior good.", "opts": ["normal", "inferior", "a luxury", "a substitute"], "correct": 1}, {"id": 148, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "easy", "q": "If the cross-price elasticity between two goods is positive, they are:", "explain": "A positive cross-price elasticity means the two goods are substitutes.", "opts": ["complements", "unrelated", "both inferior", "substitutes"], "correct": 3}, {"id": 149, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "easy", "q": "Over a longer time horizon, demand for a good usually becomes:", "explain": "Over a longer horizon buyers adjust more, so demand becomes more elastic.", "opts": ["more inelastic", "more elastic", "perfectly inelastic", "unchanged"], "correct": 1}, {"id": 150, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "easy", "q": "John's demand is more elastic than Jim's. After a price rise, John cuts his quantity:", "explain": "More elastic demand means a larger quantity response, so John cuts his quantity more than Jim.", "opts": ["less than Jim", "the same as Jim", "more than Jim", "not at all"], "correct": 2}, {"id": 151, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "easy", "q": "A perfectly inelastic demand curve is:", "explain": "Perfectly inelastic demand is a vertical line: quantity is fixed regardless of price.", "opts": ["horizontal", "vertical", "downward sloping", "45-degree"], "correct": 1}, {"id": 152, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "easy", "q": "A perfectly elastic demand curve is:", "explain": "Perfectly elastic demand is horizontal: any quantity is bought at one price.", "opts": ["vertical", "upward sloping", "L-shaped", "horizontal"], "correct": 3}, {"id": 153, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "easy", "q": "Unit elastic demand has an elasticity (absolute value) of:", "explain": "Unit-elastic demand has an elasticity of 1 in absolute value.", "opts": ["1", "0", "infinity", "greater than 2"], "correct": 0}, {"id": 154, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "easy", "q": "The own-price elasticity of demand is usually:", "explain": "Because demand slopes down, the own-price elasticity is normally negative.", "opts": ["positive", "zero", "negative", "exactly 1"], "correct": 2}, {"id": 155, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "med", "q": "If total revenue rises when the price falls, demand is:", "explain": "If a price cut raises total revenue, demand must be elastic.", "opts": ["inelastic", "elastic", "unit elastic", "perfectly inelastic"], "correct": 1}, {"id": 156, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "easy", "q": "A luxury good has an income elasticity that is:", "explain": "A luxury has an income elasticity greater than 1.", "opts": ["negative", "between 0 and 1", "exactly 0", "greater than 1"], "correct": 3}, {"id": 157, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "easy", "q": "A normal necessity has an income elasticity that is:", "explain": "A normal necessity has an income elasticity between 0 and 1.", "opts": ["greater than 1", "negative", "between 0 and 1", "infinite"], "correct": 2}, {"id": 158, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "easy", "q": "The cross-price elasticity of two substitutes (coffee and tea) is:", "explain": "Substitutes have a positive cross-price elasticity.", "opts": ["positive", "negative", "zero", "infinite"], "correct": 0}, {"id": 159, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "easy", "q": "The cross-price elasticity of two complements (cars and petrol) is:", "explain": "Complements have a negative cross-price elasticity.", "opts": ["positive", "negative", "zero", "greater than 1"], "correct": 1}, {"i
