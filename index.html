d": 160, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "med", "q": "Along a straight-line demand curve, demand is more elastic:", "explain": "A straight-line demand curve is more elastic near the top, where price is high and quantity low.", "opts": ["at the bottom (low price)", "everywhere the same", "only at the midpoint", "at the top (high price)"], "correct": 3}, {"id": 161, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "med", "q": "At the midpoint of a linear demand curve, demand is:", "explain": "The midpoint of a linear demand curve is the unit-elastic point (elasticity 1 in absolute value).", "opts": ["unit elastic", "perfectly elastic", "perfectly inelastic", "elastic"], "correct": 0}, {"id": 162, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "easy", "q": "If a 5% price increase leaves quantity unchanged, demand is:", "explain": "If quantity does not respond at all to price, demand is perfectly inelastic.", "opts": ["elastic", "unit elastic", "perfectly inelastic", "perfectly elastic"], "correct": 2}, {"id": 163, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "med", "q": "A firm wanting to raise revenue should raise its price if demand is:", "explain": "On the inelastic part revenue rises with price, so a firm raises revenue by raising price when demand is inelastic.", "opts": ["elastic", "inelastic", "unit elastic", "perfectly elastic"], "correct": 1}, {"id": 164, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "med", "q": "Which makes demand more inelastic?", "explain": "A good that takes only a tiny share of the budget has more inelastic demand.", "opts": ["the good is a tiny part of the budget", "many substitutes", "a long time horizon", "the good is a luxury"], "correct": 0}, {"id": 165, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "easy", "q": "Salt's demand is inelastic mainly because:", "explain": "Salt is a tiny-budget necessity with no close substitutes, so its demand is inelastic.", "opts": ["it is expensive", "it has close substitutes", "it is a luxury", "it is a tiny necessity with no substitutes"], "correct": 3}, {"id": 166, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "med", "q": "A Giffen good must be:", "explain": "A Giffen good is an inferior good whose income effect outweighs the substitution effect.", "opts": ["a normal good", "an inferior good", "a luxury", "a substitute"], "correct": 1}, {"id": 167, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "med", "q": "Demand tends to be more elastic when the good is defined:", "explain": "Narrowly defined goods have more substitutes, which makes demand more elastic.", "opts": ["very broadly (“food”)", "as a necessity", "very narrowly (“Granny Smith apples”)", "with no substitutes"], "correct": 2}, {"id": 168, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "med", "q": "If elasticity equals -0.4, a price rise makes total revenue:", "explain": "The size of the elasticity, 0.4, is below 1, so demand is inelastic and a price rise raises total revenue.", "opts": ["fall", "go to zero", "stay the same", "rise"], "correct": 3}, {"id": 169, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "easy", "q": "An income elasticity of +2.5 tells you the good is:", "explain": "An income elasticity of +2.5 exceeds 1, so the good is a normal luxury.", "opts": ["a luxury (normal)", "inferior", "a necessity", "a substitute"], "correct": 0}, {"id": 170, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "easy", "q": "Two goods with a cross-price elasticity of zero are:", "explain": "A zero cross-price elasticity means the goods are unrelated (independent).", "opts": ["substitutes", "complements", "unrelated (independent)", "both inferior"], "correct": 2}, {"id": 171, "topic": "Q2", "topicName": "Elasticity", "type": "num", "difficulty": "med", "q": "Demand x=0.025m−0.125p, with m=120 and p=20. Current own-price elasticity of demand? (write the sign) [ε=(∂x/∂p)(p/x), x=3−2.5=0.5]", "explain": "x = 0.025·120 minus 0.125·20 = 0.5; ε = (dx/dp)(p/x) = minus 0.125·(20/0.5) = minus 5.", "answer": -5, "display": "−5"}, {"id": 172, "topic": "Q2", "topicName": "Elasticity", "type": "reveal", "difficulty": "med", "q": "Elis has homothetic preferences. At income 500 she bought 10 books and 15 magazines. At income 400 (same prices) she buys:", "explain": "Homothetic preferences scale quantities with income: at 400/500 = 0.8 of income she buys 0.8·(10,15) = (8,12).", "a": "8 books and 12 magazines (homothetic ⇒ quantities scale with income, ×0.8)."}, {"id": 173, "topic": "Q2", "topicName": "Elasticity", "type": "reveal", "difficulty": "easy", "q": "Elasticity of demand for textbooks is −0.1; price rises 20%. Quantity change?", "explain": "Percentage change in quantity = ε·(percentage change in price) = minus 0.1·20 = minus 2 percent, so quantity falls 2 percent.", "a": "Quantity demanded decreases by 2% (−0.1 × 20%)."}, {"id": 174, "topic": "Q2", "topicName": "Elasticity", "type": "reveal", "difficulty": "hard", "q": "Two goods, one is Giffen. If the Giffen good's price falls (other price fixed), the demand for the OTHER good:", "explain": "If the Giffen good's price falls, its own quantity falls (Giffen), freeing budget; with only two goods all freed spending shifts, so the other good's demand must rise.", "a": "Must increase."}, {"id": 175, "topic": "Q2", "topicName": "Elasticity", "type": "reveal", "difficulty": "med", "q": "Income rises 20,000 → 25,000 (+25%); demand rises 30 → 60 (+100%). Which is correct?", "explain": "Percentage change in quantity is (60 minus 30)/30 = 100 percent and income change is (25000 minus 20000)/20000 = 25 percent, so income elasticity = 100/25 = 4, above 1, a luxury.", "a": "The good is likely a luxury (income elasticity = 100/25 = 4 &gt; 1)."}, {"id": 176, "topic": "Q2", "topicName": "Elasticity", "type": "reveal", "difficulty": "hard", "q": "Pat's price elasticity of demand for bread is −0.2 at CZK 30. Mat has the same demand. Their aggregate demand's price elasticity at CZK 30 is:", "explain": "Horizontally summing two identical demands doubles quantity at every price but leaves the elasticity unchanged, so it stays minus 0.2.", "a": "−0.2 (elasticity is unchanged by horizontally adding identical demands)."}, {"id": 177, "topic": "Q2", "topicName": "Elasticity", "type": "reveal", "difficulty": "med", "q": "Denis sold an inherited cottage (1,000,000) and now spends more on holidays abroad. Which is correct?", "explain": "Extra wealth from selling the cottage raised holiday spending, so holidays are a normal good and the income-offer curve slopes up; more than one statement is therefore correct.", "a": "More of these are correct — holidays are a normal good for Denis and his income-offer curve is increasing."}, {"id": 178, "topic": "Q2", "topicName": "Elasticity", "type": "reveal", "difficulty": "med", "q": "x and y are perfect substitutes (1-for-1) and y is cheaper. The income-offer curve is:", "explain": "With one-for-one substitutes he spends everything on the cheaper good y at every income, so the income-offer curve runs along the y-axis.", "a": "A line coinciding with the axis measuring good y (he spends everything on the cheaper good y)."}, {"id": 179, "topic": "Q2", "topicName": "Elasticity", "type": "reveal", "difficulty": "easy", "q": "Demand is downward-sloping and price-INELASTIC. Which is correct?", "explain": "Inelastic means the elasticity is below 1 in absolute value, so a 1 percent price fall raises quantity by less than 1 percent.", "a": "With a 1% price fall, quantity rises by less than 1%."}, {"id": 180, "topic": "Q2", "topicName": "Elasticity", "type": "reveal", "difficulty": "hard", "q": "Alisha's demand for rice is (m−p_l)/(2p_r). Which is true?", "explain": "For q_rice = (m minus p_l)/(2·p_r): the derivative with respect to m is 1/(2·p_r), which is positive (normal), and with respect to p_l is minus 1/(2·p_r), which is negative (a gross complement of lentils).", "a": "Rice is a normal good and a gross complement of lentils (demand rises with m, falls as p_l rises)."}, {"id": 181, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "easy", "q": "The own-price elasticity of demand is defined as:", "explain": "Own-price elasticity is the proportional response of quantity to price, (dq/dp)(p/q).", "opts": ["(dq/dp)·(p/q)", "(dp/dq)·(q/p)", "(dq/dp)·(q/p)", "dq/dp"], "correct": 0}, {"id": 182, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "easy", "q": "A good whose own-price elasticity of demand is positive (quantity rises when its own price rises) is:", "explain": "A positive own-price elasticity is the defining signature of a Giffen good.", "opts": ["a Giffen good", "a luxury", "a normal good", "a perfect substitute"], "correct": 0}, {"id": 183, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "med", "q": "Demand is q = 100 minus 2p. At p=10 the own-price elasticity is:", "explain": "q = 80, so ε = (dq/dp)(p/q) = minus 2·(10/80) = minus 0.25 (inelastic near the bottom).", "opts": ["minus 0.25", "minus 4", "minus 2", "minus 0.5"], "correct": 0}, {"id": 184, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "med", "q": "For q = 100 minus 2p, at p=40 the own-price elasticity is:", "explain": "q = 20, so ε = minus 2·(40/20) = minus 4 (elastic near the top).", "opts": ["minus 4", "minus 0.25", "minus 2", "minus 1"], "correct": 0}, {"id": 185, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "med", "q": "For q = 50 minus p, at p=30 the own-price elasticity is:", "explain": "q = 20, so ε = minus 1·(30/20) = minus 1.5, which is elastic.", "opts": ["minus 1.5", "minus 0.67", "minus 1", "minus 3"], "correct": 0}, {"id": 186, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "med", "q": "For q = 200 minus 4p, at p=25 the own-price elasticity is:", "explain": "q = 100, so ε = minus 4·(25/100) = minus 1, the unit-elastic point.", "opts": ["minus 1", "minus 4", "minus 0.5", "minus 2"], "correct": 0}, {"id": 187, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "med", "q": "For q = 300 minus 5p, at p=20 the own-price elasticity is:", "explain": "q = 200, so ε = minus 5·(20/200) = minus 0.5 (inelastic).", "opts": ["minus 0.5", "minus 2", "minus 1", "minus 0.25"], "correct": 0}, {"id": 188, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "med", "q": "For the demand q = 100/p, the own-price elasticity is:", "explain": "A constant-elasticity demand q = 100·p^(minus 1) has elasticity minus 1 at every price.", "opts": ["minus 1", "it varies with p", "0", "minus 100"], "correct": 0}, {"id": 189, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "med", "q": "For q = 40 minus 2p, at p=15 the own-price elasticity is:", "explain": "q = 10, so ε = minus 2·(15/10) = minus 3 (elastic).", "opts": ["minus 3", "minus 1", "minus 0.5", "minus 2"], "correct": 0}, {"id": 190, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "med", "q": "For q = 500 minus 10p, at p=25 the own-price elasticity is:", "explain": "q = 250, so ε = minus 10·(25/250) = minus 1, the unit-elastic midpoint.", "opts": ["minus 1", "minus 0.5", "minus 2", "minus 10"], "correct": 0}, {"id": 191, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "med", "q": "Between the points (p=10, q=100) and (p=12, q=80), the arc (midpoint) elasticity is:", "explain": "Arc ε uses midpoints: (minus 20/90)/(2/11) = minus 11/9.", "opts": ["minus 11/9", "minus 9/11", "minus 1", "minus 2"], "correct": 0}, {"id": 192, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "med", "q": "Income rises from 100 to 150 and quantity from 20 to 40. The income elasticity is:", "explain": "Percentage change in quantity 100 percent over income change 50 percent gives 2, above 1, a luxury.", "opts": ["2 (luxury)", "0.5 (necessity)", "minus 2 (inferior)", "1 (unit)"], "correct": 0}, {"id": 193, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "med", "q": "Income rises from 200 to 240 and quantity from 50 to 55. The income elasticity is:", "explain": "Quantity change 10 percent over income change 20 percent gives 0.5, between 0 and 1, a necessity.", "opts": ["0.5 (necessity)", "2 (luxury)", "minus 0.5 (inferior)", "1 (unit)"], "correct": 0}, {"id": 194, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "med", "q": "When the price of tea rises 10 percent, the quantity of coffee bought rises 5 percent. The cross-price elasticity is:", "explain": "Cross elasticity = +5/+10 = +0.5; a positive sign means substitutes.", "opts": ["+0.5 (substitutes)", "minus 0.5 (complements)", "+0.5 (complements)", "minus 0.5 (substitutes)"], "correct": 0}, {"id": 195, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "med", "q": "When the price of petrol rises 20 percent, the quantity of cars bought falls 4 percent. The cross-price elasticity is:", "explain": "Cross elasticity = minus 4/+20 = minus 0.2; a negative sign means complements.", "opts": ["minus 0.2 (complements)", "+0.2 (substitutes)", "minus 4 (complements)", "+0.2 (complements)"], "correct": 0}, {"id": 196, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "med", "q": "If demand is price-inelastic, a rise in price makes total revenue:", "explain": "When |ε| is below 1 quantity falls proportionally less than price rises, so revenue rises.", "opts": ["rise", "fall", "go to zero", "stay unchanged"], "correct": 0}, {"id": 197, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "med", "q": "Total revenue is maximised at the point of the demand curve where demand is:", "explain": "Revenue peaks where marginal revenue is zero, which is the unit-elastic point (|ε| = 1).", "opts": ["unit elastic", "perfectly elastic", "perfectly inelastic", "most elastic"], "correct": 0}, {"id": 198, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "med", "q": "If demand is price-elastic, a rise in price makes total revenue:", "explain": "When |ε| exceeds 1 quantity falls proportionally more than price rises, so revenue falls.", "opts": ["fall", "rise", "stay unchanged", "go to infinity"], "correct": 0}, {"id": 199, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "med", "q": "For the constant-elasticity demand q = 50·p⁻³, the own-price elasticity is:", "explain": "For q = k·p^(minus n) the elasticity is minus n everywhere, here minus 3.", "opts": ["minus 3", "minus 1", "it varies with p", "minus 50"], "correct": 0}, {"id": 200, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "med", "q": "Demand for film tickets is q = 60 minus 3p. At p=10 the own-price elasticity is:", "explain": "q = 30, so ε = minus 3·(10/30) = minus 1, exactly unit elastic.", "opts": ["minus 1", "minus 3", "minus 0.5", "minus 2"], "correct": 0}, {"id": 201, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "med", "q": "Two identical consumers each have own-price elasticity minus 0.8 at p=30. The market (horizontally summed) demand at p=30 has elasticity:", "explain": "Horizontally adding identical demands scales quantity but leaves the elasticity unchanged at minus 0.8.", "opts": ["minus 0.8", "minus 1.6", "minus 0.4", "cannot be determined"], "correct": 0}, {"id": 202, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "med", "q": "For the linear demand q = 500 minus 10p, demand is unit elastic at the price:", "explain": "Solving minus 10p/(500 minus 10p) = minus 1 gives p = 25 (the midpoint).", "opts": ["25", "50", "20", "10"], "correct": 0}, {"id": 203, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "med", "q": "Between the points (p=20, q=100) and (p=25, q=75), the arc (midpoint) elasticity is:", "explain": "Arc ε = (minus 25/87.5)/(5/22.5) = minus 9/7.", "opts": ["minus 9/7", "minus 7/9", "minus 1", "minus 2"], "correct": 0}, {"id": 204, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "hard", "q": "For the linear demand q = 100 minus 2p, demand is unit elastic at the price:", "explain": "Solving minus 2p/(100 minus 2p) = minus 1 gives 4p = 100, so p = 25 (the midpoint).", "opts": ["25", "50", "20", "33"], "correct": 0}, {"id": 205, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "hard", "q": "For q = 120 minus 3p, demand is elastic (|ε| greater than 1) for prices above:", "explain": "The unit-elastic price solves minus 3p/(120 minus 3p) = minus 1, giving p = 20; above it demand is elastic.", "opts": ["20", "40", "10", "30"], "correct": 0}, {"id": 206, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "hard", "q": "For the constant-elasticity demand q = 100·p⁻², the own-price elasticity is:", "explain": "For q = k·p^(minus 2) the elasticity is minus 2 at every price.", "opts": ["minus 2", "minus 1", "it varies with p", "minus 0.5"], "correct": 0}, {"id": 207, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "hard", "q": "Between (p=4, q=120) and (p=6, q=80), the arc (midpoint) elasticity is:", "explain": "Arc ε = (minus 40/100)/(2/5) = minus 1, unit elastic over this range.", "opts": ["minus 1", "minus 1.5", "minus 0.5", "minus 2"], "correct": 0}, {"id": 208, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "hard", "q": "For q = 100 minus 2p, demand is more elastic at:", "explain": "At p=40, ε = minus 4; at p=10, ε = minus 0.25; the larger size at p=40 means it is more elastic there.", "opts": ["p=40 than at p=10", "p=10 than at p=40", "both points equally", "neither point"], "correct": 0}, {"id": 209, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "hard", "q": "Income rises 25 percent and quantity falls 5 percent. The income elasticity is:", "explain": "Income elasticity = minus 5/+25 = minus 0.2; the negative sign marks an inferior good.", "opts": ["minus 0.2 (inferior)", "0.2 (necessity)", "minus 5", "0.8"], "correct": 0}, {"id": 210, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "hard", "q": "Demand is x = 0.04m minus 0.5p, giving x = 30 at m=1000, p=20. The income elasticity of demand is:", "explain": "Income elasticity = (dx/dm)(m/x) = 0.04·(1000/30) = 4/3, so at this point x is a luxury.", "opts": ["4/3", "3/4", "1", "4"], "correct": 0}, {"id": 211, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "hard", "q": "Demand for good x is qx = 40 minus 2·px + 3·py. At px=5, py=4, the cross-price elasticity with respect to py is:", "explain": "qx = 42 and dqx/dpy = 3, so cross ε = 3·(4/42) = 2/7, positive, so substitutes.", "opts": ["+2/7 (substitutes)", "minus 2/7 (complements)", "+3 (substitutes)", "0 (independent)"], "correct": 0}, {"id": 212, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "hard", "q": "The price of good B rises from 5 to 6 and the quantity of good A rises from 100 to 110. The arc cross-price elasticity is:", "explain": "Arc cross ε = (10/105)/(1/5.5) = 11/21, positive, so A and B are substitutes.", "opts": ["+11/21 (substitutes)", "minus 11/21 (complements)", "+1 (substitutes)", "0"], "correct": 0}, {"id": 213, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "hard", "q": "For q = 100 minus 2p, total revenue p·q is maximised at the price:", "explain": "TR = p(100 minus 2p); setting dTR/dp = 100 minus 4p = 0 gives p = 25 (the unit-elastic point).", "opts": ["25", "50", "20", "12.5"], "correct": 0}, {"id": 214, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "hard", "q": "For q = 100 minus 2p, raising the price from 10 to 11 changes total revenue by:", "explain": "TR goes from 10·80 = 800 to 11·78 = 858, a rise of 58, because demand is inelastic there.", "opts": ["+58 (it rises)", "minus 58 (it falls)", "0", "+158"], "correct": 0}, {"id": 215, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "hard", "q": "A linear demand q = a minus b·p has elasticity minus 1.5 at the point p=30, q=40. The slope coefficient b is:", "explain": "From minus b·(30/40) = minus 1.5 we get b = 1.5·40/30 = 2.", "opts": ["2", "1.5", "3", "0.5"], "correct": 0}, {"id": 216, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "hard", "q": "For q = 40 minus 2p, demand is unit elastic at the price:", "explain": "Solving minus 2p/(40 minus 2p) = minus 1 gives 4p = 40, so p = 10 (the midpoint).", "opts": ["10", "20", "5", "15"], "correct": 0}, {"id": 217, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "hard", "q": "For q = 80 minus 4p, the own-price elasticity equals minus 3 at the price:", "explain": "Solving minus 4p/(80 minus 4p) = minus 3 gives 16p = 240, so p = 15.", "opts": ["15", "10", "20", "5"], "correct": 0}, {"id": 218, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "hard", "q": "For q = 90 minus 3p at p=20, the own-price elasticity is:", "explain": "q = 30, so ε = minus 3·(20/30) = minus 2, elastic, so a price rise would lower total revenue.", "opts": ["minus 2 (elastic)", "minus 0.5 (inelastic)", "minus 1 (unit)", "minus 3"], "correct": 0}, {"id": 219, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "hard", "q": "A consumer with u = min(3x, 4y) faces px=2, py=1. The own-price elasticity of demand for good y is:", "explain": "For these complements y = m/((4/3)px + py) and its own-price elasticity is minus 3py/(4px+3py) = minus 3/11.", "opts": ["minus 3/11", "minus 8/11", "minus 1", "minus 6/11"], "correct": 0}, {"id": 220, "topic": "Q2", "topicName": "Elasticity", "type": "mc", "difficulty": "hard", "q": "For the constant-elasticity demand q = 100·p^(minus 0.5), the own-price elasticity everywhere is:", "explain": "For q = k·p^(minus n) the elasticity is minus n, here minus 0.5, inelastic at every price.", "opts": ["minus 0.5 (inelastic)", "minus 2 (elastic)", "minus 1 (unit)", "0"], "correct": 0}, {"id": 221, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "Two goods are gross substitutes if ∂ x<sub>1</sub>/∂ p<sub>2</sub> is:", "explain": "By definition gross substitutes satisfy ∂x₁/∂p₂ greater than 0: a rise in p₂ raises demand for x₁. So the sign is positive.", "opts": ["positive", "negative", "zero", "infinite"], "correct": 0}, {"id": 222, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "Butter and margarine are substitutes. If butter gets cheaper, margarine demand:", "explain": "Substitutes: a fall in butter's price makes buyers switch toward butter, so margarine (its substitute) demand falls. The cross-price effect is positive, so p down for one lowers the other's quantity.", "opts": ["rises", "doubles", "falls", "is unchanged"], "correct": 2}, {"id": 223, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "Cars and petrol are complements. If petrol gets cheaper, car demand:", "explain": "Complements: cheaper petrol raises the quantity of cars demanded (they are used together). Cross-price effect is negative: p_petrol down → cars up.", "opts": ["falls", "rises", "is unchanged", "goes to zero"], "correct": 1}, {"id": 224, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "Gross complements have a cross-price effect ∂ x<sub>1</sub>/∂ p<sub>2</sub> that is:", "explain": "Gross complements are defined by ∂x₁/∂p₂ less than 0 (negative): a rise in p₂ lowers x₁.", "opts": ["positive", "zero", "equal to 1", "negative"], "correct": 3}, {"id": 225, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "x1 is a gross substitute of x2. If p<sub>2</sub> rises, x1 demand:", "explain": "Gross substitute: ∂x₁/∂p₂ greater than 0, so a rise in p₂ raises x₁ — demand rises.", "opts": ["rises", "falls", "is unchanged", "can't tell"], "correct": 0}, {"id": 226, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "med", "q": "“Gross” effects (unlike “net” effects) include:", "explain": "Gross (uncompensated) effects include BOTH the substitution and the income effect; net (Hicksian/compensated) effects strip the income effect out.", "opts": ["only the substitution effect", "no income effect", "the income effect too", "only the price of x1"], "correct": 2}, {"id": 227, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "If the cross-price elasticity is negative, the goods are:", "explain": "A negative cross-price elasticity means p_j up → x_i down, which is the defining sign of complements.", "opts": ["substitutes", "complements", "unrelated", "both normal"], "correct": 1}, {"id": 228, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "A left shoe and a right shoe are:", "explain": "A left shoe and a right shoe are consumed together in fixed proportion — the classic perfect complements.", "opts": ["substitutes", "unrelated", "inferior", "complements"], "correct": 3}, {"id": 229, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "A rise in the price of tea increases the demand for coffee. Tea and coffee are:", "explain": "A rise in the tea price increasing coffee demand is a positive cross effect — the defining sign of substitutes.", "opts": ["complements", "unrelated", "substitutes", "both bads"], "correct": 2}, {"id": 230, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "x1 is a gross substitute of x2. If p<sub>2</sub> falls, x1 demand:", "explain": "Gross substitute: ∂x₁/∂p₂ greater than 0, so x₁ moves with p₂. p₂ falls → x₁ falls.", "opts": ["rises", "falls", "is unchanged", "can't tell"], "correct": 1}, {"id": 231, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "Two unrelated (independent) goods have a cross-price effect ∂ x<sub>1</sub>/∂ p<sub>2</sub> that is:", "explain": "Independent (unrelated) goods have zero cross-price effect: ∂x₁/∂p₂ = 0.", "opts": ["positive", "zero", "negative", "infinite"], "correct": 1}, {"id": 232, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "Coffee and sugar tend to be:", "explain": "Coffee and sugar are normally consumed together, so they are complements (negative cross effect).", "opts": ["substitutes", "unrelated", "complements", "both inferior"], "correct": 2}, {"id": 233, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "Pepsi and Coca-Cola are:", "explain": "Pepsi and Coca-Cola are close substitutes, so the cross-price effect is positive.", "opts": ["substitutes", "complements", "unrelated", "both bads"], "correct": 0}, {"id": 234, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "If the price of good 2 rises and demand for good 1 falls, the goods are:", "explain": "p₂ up together with x₁ down means ∂x₁/∂p₂ less than 0 — complements.", "opts": ["substitutes", "unrelated", "both normal", "complements"], "correct": 3}, {"id": 235, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "Tennis rackets and tennis balls are:", "explain": "Rackets and balls are used together — complements.", "opts": ["substitutes", "unrelated", "complements", "inferior"], "correct": 2}, {"id": 236, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "The price of tea rises, so demand for coffee (a substitute):", "explain": "Substitutes: a rise in the tea price shifts demand toward coffee, so coffee demand rises (positive cross effect).", "opts": ["rises", "falls", "is unchanged", "goes to zero"], "correct": 0}, {"id": 237, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "Printers and ink cartridges are:", "explain": "Printers and ink cartridges are used together — complements.", "opts": ["substitutes", "complements", "unrelated", "both luxuries"], "correct": 1}, {"id": 238, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "A positive cross-price elasticity means the goods are:", "explain": "A positive cross-price elasticity (ε_ij greater than 0) defines substitutes.", "opts": ["complements", "unrelated", "inferior", "substitutes"], "correct": 3}, {"id": 239, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "The price of good 2 falls and demand for good 1 rises. The goods are:", "explain": "p₂ down with x₁ up means ∂x₁/∂p₂ less than 0 — complements (they move in opposite directions with p₂).", "opts": ["substitutes", "unrelated", "complements", "both bads"], "correct": 2}, {"id": 240, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "If x1 is a gross complement of x2 and p<sub>2</sub> rises, x1 demand:", "explain": "Gross complement: ∂x₁/∂p₂ less than 0, so p₂ up → x₁ down (falls).", "opts": ["rises", "falls", "is unchanged", "can't tell"], "correct": 1}, {"id": 241, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "iPhones and Android phones are:", "explain": "iPhones and Android phones are substitutes — you buy one instead of the other.", "opts": ["complements", "substitutes", "unrelated", "inferior"], "correct": 1}, {"id": 242, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "Bread and butter are usually:", "explain": "Bread and butter are eaten together — complements.", "opts": ["substitutes", "complements", "unrelated", "both bads"], "correct": 1}, {"id": 243, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "The price of coffee rises and tea sales go up. Coffee and tea are:", "explain": "A rise in the coffee price raising tea sales is a positive cross effect — substitutes.", "opts": ["complements", "unrelated", "substitutes", "both inferior"], "correct": 2}, {"id": 244, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "Hot dogs and hot dog buns are:", "explain": "Hot dogs and buns are consumed together — complements.", "opts": ["complements", "substitutes", "unrelated", "luxuries"], "correct": 0}, {"id": 245, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "If ∂ x<sub>1</sub>/∂ p<sub>2</sub> = 0, the goods are:", "explain": "∂x₁/∂p₂ = 0 means no cross effect, so the goods are independent/unrelated.", "opts": ["substitutes", "complements", "unrelated", "can't tell"], "correct": 2}, {"id": 246, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "Cheaper airline tickets raise hotel bookings. Flights and hotels are:", "explain": "Cheaper flights raising hotel bookings is a negative cross effect (p_flight down → hotels up): complements.", "opts": ["substitutes", "unrelated", "inferior", "complements"], "correct": 3}, {"id": 247, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "Train tickets and plane tickets on the same route are:", "explain": "Train and plane on the same route are substitutes for making the trip.", "opts": ["complements", "substitutes", "unrelated", "both bads"], "correct": 1}, {"id": 248, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "If two goods are substitutes, a fall in the price of one:", "explain": "Substitutes: a fall in one good's price raises its own demand and pulls demand away from the other, so the other's demand falls.", "opts": ["raises demand for the other", "doubles it", "lowers demand for the other", "leaves it unchanged"], "correct": 2}, {"id": 249, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "If two goods are complements, a rise in the price of one:", "explain": "Complements: a rise in one good's price lowers demand for the other (they are used together).", "opts": ["lowers demand for the other", "raises it", "leaves it unchanged", "can't tell"], "correct": 0}, {"id": 250, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "Butter's price doubles and margarine flies off the shelves. They are:", "explain": "Dearer butter with margarine selling more is a positive cross effect — substitutes.", "opts": ["complements", "unrelated", "both inferior", "substitutes"], "correct": 3}, {"id": 251, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "A cross-price elasticity of +0.8 means the goods are:", "explain": "ε_ij = +0.8 is greater than 0 → substitutes.", "opts": ["substitutes", "complements", "unrelated", "inferior"], "correct": 0}, {"id": 252, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "A cross-price elasticity of -0.8 means the goods are:", "explain": "ε_ij = −0.8 is less than 0 → complements.", "opts": ["substitutes", "complements", "unrelated", "normal"], "correct": 1}, {"id": 253, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "A cross-price elasticity of 0 means the goods are:", "explain": "ε_ij = 0 means no cross effect → unrelated/independent.", "opts": ["substitutes", "complements", "unrelated", "can't tell"], "correct": 2}, {"id": 254, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "Peanut butter and jelly are:", "explain": "Peanut butter and jelly are eaten together — complements.", "opts": ["substitutes", "unrelated", "inferior", "complements"], "correct": 3}, {"id": 255, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "Tea and coffee are:", "explain": "Tea and coffee are substitutes (positive cross effect).", "opts": ["substitutes", "complements", "unrelated", "both bads"], "correct": 0}, {"id": 256, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "If the price of x2 rises and x1 demand rises, x1 and x2 are:", "explain": "p₂ up with x₁ up (same direction) → ∂x₁/∂p₂ greater than 0 → substitutes.", "opts": ["complements", "substitutes", "unrelated", "both inferior"], "correct": 1}, {"id": 257, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "If the price of x2 rises and x1 demand falls, x1 and x2 are:", "explain": "p₂ up with x₁ down (opposite directions) → ∂x₁/∂p₂ less than 0 → complements.", "opts": ["substitutes", "unrelated", "both normal", "complements"], "correct": 3}, {"id": 258, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "A game console and its games are:", "explain": "A console and its games are used together — complements.", "opts": ["substitutes", "complements", "unrelated", "luxuries"], "correct": 1}, {"id": 259, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "Two goods with no cross effect are called:", "explain": "A zero cross effect defines independent goods.", "opts": ["substitutes", "complements", "independent", "inferior"], "correct": 2}, {"id": 260, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "easy", "q": "Uber and traditional taxis are:", "explain": "Uber and traditional taxis are substitutes for a ride.", "opts": ["substitutes", "complements", "unrelated", "both bads"], "correct": 0}, {"id": 261, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "med", "q": "For Cobb-Douglas u=x<sup>a</sup> y<sup>b</sup>, demand for x does not depend on p<sub>y</sub>, so x and y are (gross):", "explain": "Cobb-Douglas Marshallian demand x = [a/(a+b)]·m/px contains no p_y, so ∂x/∂p_y = 0: gross-unrelated (zero cross effect).", "opts": ["substitutes", "complements", "unrelated, zero cross effect", "can't tell"], "correct": 2}, {"id": 262, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "med", "q": "Gross substitutability is:", "explain": "Gross (uncompensated) cross effects need not be symmetric: ∂x₁/∂p₂ can differ from ∂x₂/∂p₁ because the two income effects differ.", "opts": ["always symmetric", "always negative", "the same as net", "not necessarily symmetric"], "correct": 3}, {"id": 263, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "med", "q": "Net (compensated) cross-substitution effects ∂ h<sub>i</sub>/∂ p<sub>j</sub> are:", "explain": "The Slutsky substitution matrix is symmetric: ∂h_i/∂p_j = ∂h_j/∂p_i, so net (compensated) cross effects are symmetric.", "opts": ["asymmetric", "symmetric", "always negative", "always zero"], "correct": 1}, {"id": 264, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "hard", "q": "A good can be a gross complement yet a net substitute because of:", "explain": "Slutsky: ∂x_i/∂p_j = ∂h_i/∂p_j − x_j·∂x_i/∂m. A positive net term (net substitute) can be flipped negative (gross complement) by a large income effect.", "opts": ["the substitution effect", "measurement error", "the income effect", "non-convexity"], "correct": 2}, {"id": 265, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "med", "q": "If x<sub>1</sub> = 100 - 2p<sub>1</sub> + 3p<sub>2</sub>, then ∂ x<sub>1</sub>/∂ p<sub>2</sub> = +3, so x<sub>1</sub> and x<sub>2</sub> are gross:", "explain": "∂x₁/∂p₂ = +3 is greater than 0, so x₁ and x₂ are gross substitutes.", "opts": ["substitutes", "complements", "unrelated", "inferior"], "correct": 0}, {"id": 266, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "med", "q": "Perfect complements (Leontief) are, in the gross sense:", "explain": "Perfect complements (Leontief) demand x = m/(p₁+p₂) has ∂x/∂p₂ less than 0, so they are gross complements.", "opts": ["substitutes", "unrelated", "independent", "complements"], "correct": 3}, {"id": 267, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "med", "q": "The cross-price elasticity of x<sub>1</sub> with respect to p<sub>2</sub> is:", "explain": "Cross-price elasticity = (∂x₁/∂p₂)·(p₂/x₁): the percent change in x₁ per percent change in p₂.", "opts": ["(∂ x<sub>1</sub>/∂ p<sub>2</sub>)(p<sub>2</sub>/x<sub>1</sub>)", "(∂ x<sub>1</sub>/∂ p<sub>2</sub>)(x<sub>1</sub>/p<sub>2</sub>)", "(∂ x<sub>1</sub>/∂ p<sub>1</sub>)(p<sub>1</sub>/x<sub>1</sub>)", "∂ x<sub>1</sub>/∂ p<sub>2</sub>"], "correct": 0}, {"id": 268, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "med", "q": "Two goods are net substitutes. By Slutsky symmetry, good 2 is:", "explain": "Slutsky symmetry: if good 1 is a net substitute for good 2, then good 2 is a net substitute for good 1 (∂h₁/∂p₂ = ∂h₂/∂p₁, same sign).", "opts": ["a net complement of good 1", "unrelated to good 1", "a net substitute of good 1", "can't tell"], "correct": 2}, {"id": 269, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "med", "q": "If x1 is a gross substitute of x2, is x2 necessarily a gross substitute of x1?", "explain": "Gross relations are not necessarily symmetric, so x₁ being a gross substitute of x₂ does not force x₂ to be a gross substitute of x₁.", "opts": ["yes, always", "no, not necessarily", "only if both normal", "only for Cobb-Douglas"], "correct": 1}, {"id": 270, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "med", "q": "A cross-price elasticity of -1.5 means the goods are:", "explain": "ε_ij = −1.5: the negative sign means complements, and magnitude greater than 1 means strong (cross-elastic).", "opts": ["weak substitutes", "unrelated", "both inferior", "strong complements"], "correct": 3}, {"id": 271, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "med", "q": "Demand is x₁ = 100 − 2p₁ + 4p₂. At p₁ = 10, p₂ = 5 (so x₁ = 100), the cross-price elasticity of x₁ with respect to p₂ equals:", "explain": "∂x₁/∂p₂ = 4 and x₁ = 100 − 20 + 20 = 100, so ε₁₂ = (∂x₁/∂p₂)·(p₂/x₁) = 4·(5/100) = 0.2. Positive → gross substitutes.", "opts": ["0.2", "−0.2", "2", "0.5"], "correct": 0}, {"id": 272, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "med", "q": "For perfect substitutes u = 2x + 3y with prices (px, py) = (1, 2) and income 12, the optimal bundle (x, y) is:", "explain": "Compare marginal utility per dollar: MUx/px = 2/1 = 2 versus MUy/py = 3/2 = 1.5. Since x gives more utility per dollar, spend all income on x: x = 12/1 = 12, y = 0 — a corner solution.", "opts": ["(12, 0)", "(0, 6)", "(6, 3)", "(4, 4)"], "correct": 0}, {"id": 273, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "hard", "q": "For perfect complements u = min(x, 2y) with prices (px, py) = (2, 1) and income 20, the optimal bundle (x, y) is:", "explain": "The optimum lies on x = 2y (nothing is wasted). Budget 2x + y = 20 with x = 2y gives 2·(2y) + y = 5y = 20, so y = 4 and x = 8.", "opts": ["(8, 4)", "(10, 5)", "(4, 8)", "(5, 10)"], "correct": 0}, {"id": 274, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "hard", "q": "For perfect complements u = min(x, y), Marshallian demand is x* = m/(px + py). The sign of ∂x*/∂py is:", "explain": "∂x*/∂py = −m/(px + py)² is less than 0: a rise in py lowers x, so the goods are gross complements — as expected for Leontief preferences.", "opts": ["negative → gross complements", "positive → gross substitutes", "zero → independent", "cannot be signed"], "correct": 0}, {"id": 275, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "med", "q": "A 10% rise in the price of cinema tickets raises streaming subscriptions by 6%. The cross-price elasticity of streaming with respect to the cinema price is:", "explain": "ε = (percent change in streaming)/(percent change in cinema price) = +6/+10 = +0.6. A positive cross-price elasticity means substitutes: viewers substitute streaming for cinema.", "opts": ["+0.6, so they are substitutes", "−0.6, so they are complements", "+1.7, so they are substitutes", "0, so they are unrelated"], "correct": 0}, {"id": 276, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "hard", "q": "Slutsky in cross form: ∂xᵢ/∂pⱼ = ∂hᵢ/∂pⱼ − xⱼ·(∂xᵢ/∂m). If ∂hᵢ/∂pⱼ = 5 (net substitutes), xⱼ = 4 and ∂xᵢ/∂m = 2, then the gross cross effect ∂xᵢ/∂pⱼ is:", "explain": "∂xᵢ/∂pⱼ = 5 − 4·2 = −3, which is less than 0. The good is a NET substitute but a GROSS complement: a strong (normal-good) income effect flips the sign.", "opts": ["−3, a gross complement", "+13, a gross substitute", "+5, unchanged", "−13, a gross complement"], "correct": 0}, {"id": 277, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "med", "q": "The Slutsky substitution matrix is symmetric. If the compensated cross effect ∂h₁/∂p₂ = 7, then ∂h₂/∂p₁ equals:", "explain": "Slutsky symmetry: ∂h_i/∂p_j = ∂h_j/∂p_i, so ∂h₂/∂p₁ = ∂h₁/∂p₂ = 7. Net (compensated) cross effects are always symmetric, even though gross ones need not be.", "opts": ["7", "−7", "1/7", "0"], "correct": 0}, {"id": 278, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "med", "q": "Demand is x₁ = 50 − 3p₁ − 2p₂. At p₁ = 5, p₂ = 10 (so x₁ = 15), the cross-price elasticity ε₁₂ is:", "explain": "∂x₁/∂p₂ = −2 and x₁ = 50 − 15 − 20 = 15, so ε₁₂ = −2·(10/15) = −20/15 = −4/3. The negative sign means complements, and magnitude greater than 1 means cross-elastic.", "opts": ["−4/3 (complements)", "+4/3 (substitutes)", "−2 (complements)", "−1/3 (complements)"], "correct": 0}, {"id": 279, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "hard", "q": "Suppose ∂x₁/∂p₂ is greater than 0 while ∂x₂/∂p₁ is less than 0. This is possible, and it shows that gross substitutability/complementarity is:", "explain": "Uncompensated (gross) cross effects carry different income effects for the two goods, so ∂x₁/∂p₂ and ∂x₂/∂p₁ need not be equal or even share a sign. Only the compensated (net) effects are symmetric.", "opts": ["not necessarily symmetric — it can even differ in sign", "always symmetric", "impossible; the two must match", "always negative"], "correct": 0}, {"id": 280, "topic": "Q3", "topicName": "Gross substitutes & complements", "type": "mc", "difficulty": "med", "q": "For perfect substitutes u = x + y (so MRS = 1), if px = py the consumer's optimal choice is:", "explain": "When the price ratio equals the constant MRS = 1, every point on the budget line yields the same utility, so demand is indeterminate. Off this knife-edge the consumer goes to a corner (all of the cheaper good).", "opts": ["any bundle on the budget line — demand is indeterminate", "only the corner with all x", "only the corner with all y", "the midpoint, split equally"], "correct": 0}, {"id": 281, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "easy", "q": "p<sub>x</sub> decreases, holding the consumer's utility fixed at its original level. The substitution effect on the quantity demanded of x is:", "explain": "px falls with utility held fixed, so x is relatively cheaper and compensated (Hicksian) demand for x rises; the own substitution effect always moves opposite to the price change.", "opts": ["positive, the quantity of x rises", "negative, the quantity of x falls", "exactly zero for every good", "impossible to sign without knowing the income elasticity"], "correct": 0}, {"id": 282, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "easy", "q": "p<sub>x</sub> increases. The own substitution effect on the demand for x is:", "explain": "A price rise makes x relatively dearer, so compensated demand for x falls: the own substitution effect is negative, never ambiguous.", "opts": ["positive", "zero", "negative", "ambiguous, it depends on whether x is normal or inferior"], "correct": 2}, {"id": 283, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "easy", "q": "The substitution effect is defined by adjusting income just enough to hold constant:", "explain": "The substitution effect isolates the pure relative-price change by holding real purchasing power (utility) fixed, not nominal income.", "opts": ["the consumer's nominal income", "the consumer's utility level (real purchasing power)", "the quantity of the other good, y", "the market price of y"], "correct": 1}, {"id": 284, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "med", "q": "Why can the own substitution effect never run in the same direction as the price change?", "explain": "Compensated demand minimizes expenditure for fixed utility; when a good becomes relatively cheaper it is weakly more attractive, so the own SE cannot move with the price.", "opts": ["because all consumers are risk averse", "because nominal income never changes in reality", "because the total effect always dominates the substitution effect", "because compensated demand minimizes expenditure for a fixed utility level, so the relatively cheaper good must become weakly more attractive"], "correct": 3}, {"id": 285, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "med", "q": "For a well-behaved consumer, the sign of the compensated (Hicksian) own-price derivative ∂ x<sup>h</sup>/∂ p<sub>x</sub> is:", "explain": "For well-behaved convex preferences the compensated own-price derivative ∂hx/∂px ≤ 0, equal to zero only at a Leontief kink.", "opts": ["strictly positive", "unrestricted in sign", "non-positive, strictly negative or zero only at a kink", "always exactly equal to -1"], "correct": 2}, {"id": 286, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "easy", "q": "The substitution effect is best described as the change in:", "explain": "The substitution effect is the movement along one indifference curve: the change in Hicksian (compensated) demand holding utility fixed.", "opts": ["Hicksian (compensated) demand, holding utility fixed", "Marshallian (uncompensated) demand only", "nominal income", "the price ratio only"], "correct": 0}, {"id": 287, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "easy", "q": "Which classification of the good, normal, inferior, or Giffen, can flip the SIGN of the OWN substitution effect?", "explain": "The own substitution effect is non-positive regardless of normal, inferior, or Giffen; classification affects only the income effect.", "opts": ["normal goods only", "inferior goods only", "Giffen goods only", "none of them; the own SE sign never depends on this classification"], "correct": 3}, {"id": 288, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "easy", "q": "Bruno has two treat brands, A and B, that make him equally happy. The shop drops the price of A but takes back just enough allowance to keep Bruno exactly as happy as before. Due to the substitution effect alone, Bruno's consumption of A:", "explain": "Compensated to the same happiness, brand A is relatively cheaper, so the pure substitution effect raises A.", "opts": ["falls, because he feels poorer", "rises, because A is now relatively cheaper", "stays exactly the same", "rises or falls depending on Bruno's income"], "correct": 1}, {"id": 289, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "med", "q": "A triathlete holds her fitness (utility) fixed while the rental cost of a bike falls. The substitution effect alone predicts she reallocates training time toward cycling because:", "explain": "Holding fitness (utility) fixed, cheaper cycling is the better bargain, so the substitution effect shifts time toward cycling.", "opts": ["her total training budget increased", "she becomes fitter overall", "cycling became relatively cheaper, and holding fitness fixed she chases the best bargain", "the price of running fell too"], "correct": 2}, {"id": 290, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "med", "q": "If, hypothetically, the own substitution effect for a price fall in x were negative, this would violate:", "explain": "A negative own SE for a price fall would violate the compensated law of demand (expenditure minimization under convex preferences).", "opts": ["the basic logic of expenditure minimization under convex preferences, the compensated law of demand", "Walras' law", "the definition of a normal good", "nothing; it is a common outcome for Giffen goods"], "correct": 0}, {"id": 291, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "med", "q": "For perfect complements (Leontief, L-shaped indifference curves), the own substitution effect for either good is:", "explain": "Leontief curves give no scope to substitute; the compensated bundle stays at the fixed ratio, so the own SE is zero.", "opts": ["always strictly positive", "always strictly negative", "undefined and cannot be computed", "zero, since the compensated bundle cannot substitute away from the fixed kink ratio"], "correct": 3}, {"id": 292, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "easy", "q": "Hicksian (Hicks) compensation adjusts income to keep constant:", "explain": "Hicks compensation holds utility fixed: the consumer stays on the original indifference curve.", "opts": ["the original bundle's affordability at new prices", "nominal income", "the utility level, the consumer stays on the original indifference curve", "the relative price ratio"], "correct": 2}, {"id": 293, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "easy", "q": "Slutsky compensation adjusts income to keep constant:", "explain": "Slutsky compensation holds constant the ability to just afford the ORIGINAL bundle at the new prices.", "opts": ["the ability to just afford the ORIGINAL bundle at the new prices", "the utility level exactly", "the marginal rate of substitution", "the quantity of y only"], "correct": 0}, {"id": 294, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "hard", "q": "For a price FALL, which compensation scheme leaves the consumer with LESS income, i.e. is more austere?", "explain": "For a price fall, reaching exactly the old utility costs no more than keeping the old bundle affordable, so Hicks removes more income and leaves less.", "opts": ["Slutsky, since it only imposes affordability of the old bundle", "they always remove exactly the same amount of income", "neither; both schemes add income when price falls", "Hicks, because holding utility fixed exactly at the old indifference curve is stingier than merely keeping the old bundle affordable"], "correct": 3}, {"id": 295, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "med", "q": "In a diagram with indifference curve IC<sub>0</sub> and old bundle A, the Hicks compensated line is tangent to IC<sub>0</sub>, while the Slutsky compensated line:", "explain": "The Slutsky line uses the new price ratio (parallel to the Hicks line) but is pinned through the old bundle A, so it need not be tangent to IC0.", "opts": ["is also tangent to IC<sub>0</sub>, at the same point as Hicks", "is parallel to the Hicks line (same new price ratio) but passes exactly through the old bundle A, so it need not be tangent to IC<sub>0</sub>", "has a different slope than the Hicks line", "never touches IC<sub>0</sub> at all"], "correct": 1}, {"id": 296, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "easy", "q": "As the size of the price change shrinks toward zero, the Slutsky and Hicks substitution effects:", "explain": "For an infinitesimal price change the Slutsky and Hicks substitution effects coincide (they agree to first order).", "opts": ["diverge further and further apart", "always stay in a fixed ratio of two to one", "converge to the same value; they agree in the first-order (infinitesimal) limit", "both go to positive infinity"], "correct": 2}, {"id": 297, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "med", "q": "Which statement correctly contrasts the two compensation schemes?", "explain": "Slutsky compensation uses only observed quantities and prices; Hicks compensation requires the unobservable utility/indifference map.", "opts": ["Slutsky compensation is directly observable from market data (old quantities and both price vectors), while Hicks compensation requires knowing the unobservable utility function", "only Hicks compensation is used in applied work; Slutsky gives the wrong sign", "Hicks compensation requires nominal income to rise whenever price falls", "Slutsky compensation always coincides exactly with the uncompensated (total) effect"], "correct": 0}, {"id": 298, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "hard", "q": "For a price DECREASE, the Slutsky-compensated bundle reaches, compared to the original indifference curve IC<sub>0</sub>:", "explain": "Under a price fall the old bundle is affordable at Slutsky income, and re-optimizing can only do better, so the Slutsky bundle sits on a weakly higher indifference curve than IC0.", "opts": ["a strictly lower indifference curve, always", "exactly the same indifference curve, always", "an indifference curve that cannot be ranked in general", "a weakly higher indifference curve, because the old bundle is feasible for Hicks's cost-minimization, so Hicks can do at least as well for less"], "correct": 3}, {"id": 299, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "easy", "q": "Despite differing in magnitude, the Slutsky and Hicks own-price substitution effects always agree on:", "explain": "Slutsky and Hicks own-price substitution effects can differ in magnitude but always share the same non-positive sign.", "opts": ["the exact numerical magnitude, for any price change however large", "the sign: both are non-positive, i.e. opposite to the price change", "which good is normal", "the size of the income effect"], "correct": 1}, {"id": 300, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "med", "q": "In the two-good diagram, both the Hicks and the Slutsky compensated budget lines are drawn using:", "explain": "Both compensated budget lines carry the NEW price ratio (parallel to budget1); they differ only in intercept (income).", "opts": ["the OLD price ratio, parallel to budget0", "a slope of zero", "the NEW price ratio: both lines are parallel to budget1; only their intercepts (incomes) differ", "two completely unrelated slopes"], "correct": 2}, {"id": 301, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "med", "q": "An exam trap: p<sub>x</sub> falls and the question asks for the sign of the Hicksian substitution effect on x. A student who instead (incorrectly) computes it via Slutsky compensation gets:", "explain": "For a price fall both methods give a positive own substitution effect; using Slutsky instead of Hicks changes only the magnitude, not the sign.", "opts": ["the same sign, positive, just a slightly different exact magnitude", "a completely different, negative sign", "zero regardless of which method is used", "an undefined result"], "correct": 0}, {"id": 302, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "easy", "q": "The compensation concept that keeps the consumer on exactly the SAME indifference curve is named after:", "explain": "Holding the consumer on the same indifference curve is Hicks (Hicksian) compensation.", "opts": ["Slutsky", "Marshall", "Giffen", "Hicks"], "correct": 3}, {"id": 303, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "easy", "q": "For a NORMAL good, following a price fall, the income effect:", "explain": "For a normal good a price fall raises real income and demand, reinforcing the substitution effect (both raise x).", "opts": ["opposes the substitution effect and dominates it", "reinforces (points in the same direction as) the substitution effect", "opposes the substitution effect but is smaller", "is always exactly zero"], "correct": 1}, {"id": 304, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "hard", "q": "For an INFERIOR but non-Giffen good, following a price fall, the total (Marshallian) effect on quantity demanded is:", "explain": "An inferior non-Giffen good has an income effect that opposes but is smaller than the substitution effect, so a price fall still raises quantity.", "opts": ["negative, because the income effect wins", "exactly zero", "impossible to determine even in principle", "positive: the substitution effect still dominates the smaller, opposing income effect"], "correct": 3}, {"id": 305, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "med", "q": "A Giffen good is best defined as a good for which:", "explain": "A Giffen good is inferior with an income effect so strong it outweighs the always-negative substitution effect, so demand rises with price.", "opts": ["it is inferior with an income effect so strong that it outweighs the substitution effect, making the total demand curve slope upward", "the substitution effect is positive for a price rise", "demand is completely unresponsive to price", "it is a luxury with income elasticity above one"], "correct": 0}, {"id": 306, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "med", "q": "For a Giffen good, when its price falls, the OWN substitution effect is:", "explain": "Even for a Giffen good the own substitution effect is normal (positive for a price fall); only the income effect is anomalous.", "opts": ["negative; that is precisely what makes it Giffen", "zero", "positive, exactly like for every other good; it is the income effect, not the SE, that is unusual", "undefined, because Giffen goods have no indifference curves"], "correct": 2}, {"id": 307, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "med", "q": "Which statement is TRUE about the substitution effect across normal, inferior, and Giffen goods, for a price fall?", "explain": "The substitution effect is positive for a price fall for every good; only the sign and size of the income effect distinguish the classes.", "opts": ["the SE is positive for normal, negative for inferior, negative for Giffen goods", "the SE is always positive, regardless of the normal, inferior, or Giffen classification; only the income effect's sign and size vary", "the SE is undefined for inferior and Giffen goods", "the SE equals the total effect for inferior goods"], "correct": 1}, {"id": 308, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "easy", "q": "Every Giffen good must also be:", "explain": "A Giffen good must be inferior; a strong negative income effect is what overturns the law of demand.", "opts": ["normal", "a perfect substitute", "a luxury", "inferior"], "correct": 3}, {"id": 309, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "hard", "q": "Every Giffen good is inferior, but the converse fails because:", "explain": "Every Giffen good is inferior, but inferiority alone is not enough: Giffen also needs the income effect to outweigh the substitution effect.", "opts": ["not every inferior good is Giffen; Giffen additionally requires the income effect to be strong enough to overturn the substitution effect", "every inferior good is automatically Giffen too", "inferior goods do not exist in practice", "Giffen goods are actually normal goods, just measured incorrectly"], "correct": 0}, {"id": 310, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "easy", "q": "The own substitution effect is unambiguous in sign. Which effect CAN be ambiguous, depending on the good's classification?", "explain": "The own substitution effect is unambiguously signed; the total (Marshallian) effect can be ambiguous because it also contains the income effect.", "opts": ["the own substitution effect itself", "neither effect is ever ambiguous", "the total (Marshallian, uncompensated) effect, because it also embeds the income effect", "both effects are always ambiguous"], "correct": 2}, {"id": 311, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "med", "q": "A CROSS substitution effect (the compensated effect of p<sub>y</sub> on the demand for x) differs from the OWN substitution effect in that:", "explain": "Unlike the own SE (always non-positive), the cross substitution effect can be positive (net substitutes) or negative (net complements).", "opts": ["it must always be positive", "it can be positive (net substitutes) or negative (net complements), unlike the own effect, which is always non-positive with respect to its own price", "it is always exactly equal to the own effect", "it never appears in the Slutsky equation"], "correct": 1}, {"id": 312, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "med", "q": "A key symmetry result for compensated (Hicksian) cross-price effects states that:", "explain": "Slutsky symmetry: the compensated cross-effect of py on x equals that of px on y (∂hx/∂py = ∂hy/∂px).", "opts": ["the cross effect always equals the own effect", "cross effects are symmetric only for Cobb-Douglas utility", "there is no such symmetry result in general", "the cross effect of p<sub>y</sub> on x equals the cross effect of p<sub>x</sub> on y (Slutsky symmetry)"], "correct": 3}, {"id": 313, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "easy", "q": "Mock-exam statement: p<sub>x</sub> decreases, the change in demand for x due to its own substitution effect is ____ . Given everything above, the one answer that holds NO MATTER whether x is normal, inferior, or Giffen is:", "explain": "For a price fall the own substitution effect is positive no matter the good's classification.", "opts": ["positive", "negative", "zero", "ambiguous; you must know the income elasticity first"], "correct": 0}, {"id": 314, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "reveal", "difficulty": "med", "q": "Price of apricots rises and you buy fewer raspberries. Consistent with:", "explain": "Buying fewer raspberries when apricots dearen fits the stated income and cross-price patterns (for instance both goods normal, or raspberries normal and apricots inferior).", "a": "Both (b) and (d): raspberries normal &amp; apricots inferior, OR both normal."}, {"id": 315, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "num", "difficulty": "hard", "q": "Harry: u=x1·x2, last week bought (3, 25). New prices p1=6, p2=2. Minimum cost this week to be as well off as last week? [reach u0=75 cheapest: Hicksian]", "explain": "Old bundle gives u0 = 3·25 = 75; the cheapest cost to reach u0 at the new prices is e = 2√(p1·p2·u0) = 2√(6·2·75) = 60.", "answer": 60, "display": "60"}, {"id": 316, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "reveal", "difficulty": "med", "q": "Price of good x changes. Which is TRUE?", "explain": "The own SE always opposes the price change; if the income effect runs opposite to the SE, the income effect moves with the price, which defines an inferior good.", "a": "If the income effect and own substitution effect work in OPPOSITE directions, x is necessarily inferior."}, {"id": 317, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "reveal", "difficulty": "hard", "q": "Expenditure-minimising consumer reaches u1 at (x1*,y1*) and u0 at (x0*,y0*) with u1 &gt; u0, same prices. Then:", "explain": "Hicksian demand falls as utility rises exactly for an inferior good, so x1* is below x0* if and only if x is inferior.", "a": "x1* &lt; x0* if and only if good x is inferior."}, {"id": 318, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "num", "difficulty": "hard", "q": "Henry: u=x+y (perfect substitutes), px=20, py=30, m=300. py drops to 15. Change in demand for y due to the SUBSTITUTION effect? [was all x; now all y]", "explain": "Initially px is below py so income buys only x: x=15, y=0, u0=15. Holding u0 fixed, the now-cheaper y is bought instead, giving compensated y=15, so the substitution effect on y is +15.", "answer": 15, "display": "15"}, {"id": 319, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "reveal", "difficulty": "med", "q": "Price of oranges rises, price of chocolate constant. The change in demand from the INCOME effect alone is:", "explain": "A price rise for oranges lowers real income; the income effect raises orange demand only if oranges are inferior.", "a": "Positive if and only if orange is an inferior good."}, {"id": 320, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "reveal", "difficulty": "med", "q": "Monotonic, strictly convex prefs; x0* on Hicksian H_x(u0). Both prices rise 50%; new Hicksian bundle at u0:", "explain": "Hicksian demand is homogeneous of degree zero in prices, so scaling all prices with utility fixed leaves the compensated bundle unchanged.", "a": "None of these — a proportional price rise with fixed utility leaves the Hicksian bundle unchanged."}, {"id": 321, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "num", "difficulty": "hard", "q": "Joe: u=x<sup>0.5</sup>+3y, px=1, py=6, m=10. px rises to 2. Change in demand for x from the INCOME effect? (quasilinear in y ⇒ no income effect on x)", "explain": "Utility is quasilinear in y, so Marshallian x depends only on prices, not income; hence the income effect on x is exactly 0.", "answer": 0, "display": "0"}, {"id": 322, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "num", "difficulty": "med", "q": "Rachel: u=min(2x,2y), px=50, py=30, m=400. py rises to 50. Change in demand for muffins (y) due to the INCOME effect? (write the sign)", "explain": "Perfect complements have zero substitution effect, so the whole change is the income effect: y falls from 400/80=5 to 400/100=4, an income effect of −1.", "answer": -1, "display": "−1"}, {"id": 323, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "easy", "q": "A consumer buys 8 units of x when px = 5. px rises to 8. Under Slutsky compensation the extra income needed so the OLD bundle is still just affordable is Δm = x·Δpx. This equals:", "explain": "Slutsky compensation keeps the old bundle affordable: Δm = x·Δpx = 8·(8−5) = 24.", "opts": ["24", "8", "40", "3"], "correct": 0}, {"id": 324, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "med", "q": "A consumer buying 20 units of x sees px FALL from 12 to 9. Slutsky compensation (Δm = x·Δpx) adjusts income by:", "explain": "Δm = x·Δpx = 20·(9−12) = −60: because the old bundle is now cheaper, Slutsky removes 60 of income.", "opts": ["reduces income by 60 (Δm = −60)", "raises income by 60", "reduces income by 27", "leaves income unchanged"], "correct": 0}, {"id": 325, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "med", "q": "Bruno's owner bought 6 bags of treats at 4 CZK each. The price rises to 7 CZK. The Slutsky compensating money that keeps the old 6-bag bundle just affordable is:", "explain": "Δm = x·Δpx = 6·(7−4) = 18.", "opts": ["18", "42", "24", "3"], "correct": 0}, {"id": 326, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "easy", "q": "The total effect of a price rise on x is −12 and the income effect is −3. By the Slutsky decomposition the substitution effect equals:", "explain": "Total = SE + IE, so SE = total − IE = −12 − (−3) = −9.", "opts": ["−9", "−15", "+9", "−4"], "correct": 0}, {"id": 327, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "easy", "q": "After a price rise the substitution effect on x is −6 and the income effect is −2. The total (Marshallian) effect is:", "explain": "Total = SE + IE = −6 + (−2) = −8; for a normal good the income effect reinforces the substitution effect.", "opts": ["−8", "−4", "+4", "−3"], "correct": 0}, {"id": 328, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "med", "q": "A good is inferior (but not Giffen). After its price rises the substitution effect is −6 and the income effect is +2. The total effect is:", "explain": "Total = SE + IE = −6 + 2 = −4: the opposing income effect shrinks but does not reverse the fall.", "opts": ["−4", "−8", "+8", "0"], "correct": 0}, {"id": 329, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "med", "q": "For a Giffen good after a price rise, the substitution effect is −3 and the total (Marshallian) effect is +2. The income effect must be:", "explain": "IE = total − SE = 2 − (−3) = +5: a large positive income effect overturns the negative substitution effect.", "opts": ["+5", "−5", "−1", "+1"], "correct": 0}, {"id": 330, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "med", "q": "u = √(x·y), income m = 120, py = 3, and px rises from 3 to 12. Marshallian demand is x = m/(2·px). The TOTAL effect on x is:", "explain": "x = m/(2px): x goes from 120/6 = 20 to 120/24 = 5, a total effect of −15.", "opts": ["−15", "−10", "−7.5", "−5"], "correct": 0}, {"id": 331, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "hard", "q": "Same setup (u = √(x·y), m = 120, py = 3, px 3→12). Using SLUTSKY compensation (keep the old bundle affordable), the substitution effect on x is:", "explain": "Old x0 = 20; Slutsky income mS = 120 + 20·(12−3) = 300; xS = 300/(2·12) = 12.5, so SE = 12.5 − 20 = −7.5.", "opts": ["−7.5", "−10", "−15", "−5"], "correct": 0}, {"id": 332, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "hard", "q": "Same setup (u = √(x·y), m = 120, py = 3, px 3→12). Using HICKS compensation (hold the old utility), the substitution effect on x is:", "explain": "For this symmetric Cobb-Douglas h_x = u·√(py/px); holding u0 fixed, compensated x falls from 20 to 10, so SE = −10.", "opts": ["−10", "−7.5", "−15", "−5"], "correct": 0}, {"id": 333, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "hard", "q": "Same setup (u = √(x·y), m = 120, py = 3, px 3→12), where total effect = −15 and the SLUTSKY substitution effect = −7.5. The Slutsky income effect on x is:", "explain": "Income effect = total − substitution = −15 − (−7.5) = −7.5.", "opts": ["−7.5", "−5", "−10", "−15"], "correct": 0}, {"id": 334, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "hard", "q": "Same setup (u = √(x·y), m = 120, py = 3, px 3→12), where total effect = −15 and the HICKS substitution effect = −10. The Hicks income effect on x is:", "explain": "Income effect = total − substitution = −15 − (−10) = −5.", "opts": ["−5", "−7.5", "−10", "−15"], "correct": 0}, {"id": 335, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "med", "q": "u = x + y (perfect substitutes), px = 10, py = 8, m = 80. py rises to 12. Initially only y is bought (y = 10). The Hicks substitution effect on y is:", "explain": "At the old prices only y is bought (y = m/py = 10, u0 = 10). At the new prices x is cheaper, so reaching u0 uses only x and compensated y = 0: SE on y = 0 − 10 = −10.", "opts": ["−10", "0", "−8", "+10"], "correct": 0}, {"id": 336, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "med", "q": "Same perfect-substitutes case (u = x + y, px = 10, py = 8→12, m = 80). The TOTAL (Marshallian) effect on x is:", "explain": "After py rises above px the consumer buys only x: x goes from 0 to m/px = 8, a total effect of +8.", "opts": ["+8", "−8", "0", "+10"], "correct": 0}, {"id": 337, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "med", "q": "u = min(x, y) (perfect complements), px = 2, py = 2, m = 40. py rises to 3. The substitution effect on y is:", "explain": "Leontief preferences allow no substitution: the compensated bundle stays on x = y, so the substitution effect is exactly 0.", "opts": ["0", "−2", "−4", "−8"], "correct": 0}, {"id": 338, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "med", "q": "Same perfect-complements case (u = min(x, y), px = 2, py = 2→3, m = 40). Since the substitution effect is zero, the income effect on y equals the total effect, which is:", "explain": "x = y = m/(px+py): y falls from 40/4 = 10 to 40/5 = 8, so the income effect (= total) is −2.", "opts": ["−2", "0", "−4", "+2"], "correct": 0}, {"id": 339, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "med", "q": "u = 8·√x + y (quasilinear in y), and px rises from 1 to 4. Demand is x = 16/px². The substitution effect on x (which equals the total effect here) is:", "explain": "With quasilinear preferences x depends only on px, so the income effect is zero and SE = total: x falls from 16 to 1, i.e. −15.", "opts": ["−15", "0", "−16", "−12"], "correct": 0}, {"id": 340, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "med", "q": "Same quasilinear case (u = 8·√x + y, px 1→4, x = 16/px²). The income effect on x is:", "explain": "x depends only on price, not income, so the income effect on x is exactly 0 (the whole move is substitution).", "opts": ["0", "−15", "+15", "−1"], "correct": 0}, {"id": 341, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "hard", "q": "Sam: u = x^0.75·y^0.25, m = 80, py = 4, px rises from 2 to 12. Marshallian x = 0.75·m/px falls from 30 to 5 (total −25). The HICKS substitution effect on x is closest to:", "explain": "For Cobb-Douglas h_x = x0·[(px0/px1)^0.25 − 1] = 30·[(2/12)^0.25 − 1] ≈ −10.83.", "opts": ["≈ −10.83", "−6.25", "−25", "−18.75"], "correct": 0}, {"id": 342, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "hard", "q": "Same Sam problem (u = x^0.75·y^0.25, m = 80, py = 4, px 2→12, x0 = 30). The SLUTSKY substitution effect on x is:", "explain": "Slutsky income mS = 80 + 30·(12−2) = 380; xS = 0.75·380/12 = 23.75, so SE = 23.75 − 30 = −6.25.", "opts": ["−6.25", "−10.83", "−18.75", "−25"], "correct": 0}, {"id": 343, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "hard", "q": "Same Sam problem (total effect −25, SLUTSKY substitution effect −6.25). The Slutsky income effect on x is:", "explain": "Income effect = total − substitution = −25 − (−6.25) = −18.75.", "opts": ["−18.75", "−6.25", "−10.83", "−14.17"], "correct": 0}, {"id": 344, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "med", "q": "A consumer buys 15 units of x. px rises from 4 to 6 and income is raised by exactly x·Δpx to keep the old bundle affordable (Slutsky). The raise is:", "explain": "Δm = x·Δpx = 15·(6−4) = 30.", "opts": ["30", "15", "2", "45"], "correct": 0}, {"id": 345, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "easy", "q": "After a price rise, the substitution effect on an inferior good x is −4 and the income effect is +1. The total (Marshallian) effect is:", "explain": "Total = SE + IE = −4 + 1 = −3: still negative because the opposing income effect is small.", "opts": ["−3", "−5", "+5", "+3"], "correct": 0}, {"id": 346, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "med", "q": "After a price rise the demand for x actually ROSE: the total effect is +1. If the substitution effect is −2, the income
