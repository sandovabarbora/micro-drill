rect Marshallian demand.", "opts": ["20", "10", "40", "6.67"], "correct": 0}, {"id": 880, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "med", "q": "u = √(x·y) has expenditure function e(p,u) = 2·u·√(px·py), so Shephard gives h_x = ∂e/∂px = u·√(py/px). At u = 12.5, px = 2, py = 8, h_x equals:", "explain": "h_x = u·√(py/px) = 12.5·√(8/2) = 12.5·2 = 25.", "opts": ["25", "12.5", "6.25", "50"], "correct": 0}, {"id": 881, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "med", "q": "u = √(x·y), m = 100, px = 2, py = 8, so v = 12.5. The identity e(p, v(p,m)) = m predicts e = 2·12.5·√(2·8) equals:", "explain": "e = 2·v·√(px·py) = 2·12.5·4 = 100 = m, confirming e(p, v(p,m)) = m.", "opts": ["100", "50", "25", "200"], "correct": 0}, {"id": 882, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "med", "q": "For perfect complements u = min(x, y), the expenditure function is e(p,u) = u·(px + py). The cheapest cost to reach utility u = 10 at px = 2, py = 3 is:", "explain": "e = u·(px + py) = 10·(2 + 3) = 50.", "opts": ["50", "30", "20", "10"], "correct": 0}, {"id": 883, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "med", "q": "For perfect complements u = min(x, y), indirect utility is v(p,m) = m/(px + py). At m = 100, px = 2, py = 3 it equals:", "explain": "v = m/(px + py) = 100/5 = 20.", "opts": ["20", "50", "5", "100"], "correct": 0}, {"id": 884, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "med", "q": "For perfect substitutes u = x + y, the expenditure function is e(p,u) = u·min(px, py). To reach utility u = 10 at px = 4, py = 6 the cost is:", "explain": "The consumer buys only the cheaper good, so e = u·min(px, py) = 10·4 = 40.", "opts": ["40", "60", "100", "10"], "correct": 0}, {"id": 885, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "med", "q": "For perfect substitutes u = x + y, indirect utility is v(p,m) = m/min(px, py). At m = 60, px = 4, py = 6 it equals:", "explain": "v = m/min(px, py) = 60/4 = 15.", "opts": ["15", "10", "24", "6"], "correct": 0}, {"id": 886, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "hard", "q": "With e(p,u) = 2·u·√(px·py), the compensated own-price slope ∂h_x/∂px = ∂²e/∂px² at u = 1, px = 1, py = 1 equals:", "explain": "∂h_x/∂px = −u·√(py)/(2·px^1.5); at u = px = py = 1 this is −0.5, confirming ∂h_x/∂px ≤ 0.", "opts": ["−0.5", "+0.5", "0", "−1"], "correct": 0}, {"id": 887, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "hard", "q": "By the Slutsky equation ∂x₁/∂p₁ = ∂h₁/∂p₁ − x₁·(∂x₁/∂m). If ∂h₁/∂p₁ = −4, x₁ = 6 and ∂x₁/∂m = 0.5, then ∂x₁/∂p₁ equals:", "explain": "∂x₁/∂p₁ = −4 − 6·0.5 = −7: the income term makes the Marshallian slope more negative than the Hicksian for a normal good.", "opts": ["−7", "−1", "−4", "+2"], "correct": 0}, {"id": 888, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "hard", "q": "By Slutsky ∂x₁/∂p₁ = ∂h₁/∂p₁ − x₁·(∂x₁/∂m). A good has ∂h₁/∂p₁ = −2, x₁ = 10 and is strongly inferior with ∂x₁/∂m = −0.5. Then ∂x₁/∂p₁ equals:", "explain": "∂x₁/∂p₁ = −2 − 10·(−0.5) = +3: the strong negative income response makes Marshallian demand slope up, a Giffen good.", "opts": ["+3 (upward-sloping: Giffen)", "−7", "−2", "−12"], "correct": 0}, {"id": 889, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "hard", "q": "v(p,m) is homogeneous of degree zero in (p,m): scaling every price and income by 3 leaves it unchanged. For v = m/(2·√(px·py)), the value at (6, 24, 300) minus the value at (2, 8, 100) is:", "explain": "Homogeneity of degree zero makes v(3p, 3m) = v(p,m), so the difference is exactly 0.", "opts": ["0", "12.5", "37.5", "−12.5"], "correct": 0}, {"id": 890, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "med", "q": "e(p,u) is homogeneous of degree one in prices: doubling every price doubles it. For e = 2·u·√(px·py) at u = 5, going from (px, py) = (2, 8) to (4, 16) multiplies e by:", "explain": "Degree-one homogeneity means e(2p, u) = 2·e(p, u), so the ratio is exactly 2.", "opts": ["2", "4", "1", "√2"], "correct": 0}, {"id": 891, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "hard", "q": "u = x^(1/3)·y^(2/3) has v = m·(1/3)^(1/3)·(2/3)^(2/3)/(px^(1/3)·py^(2/3)). Roy's identity gives x = m/(3·px). At m = 90, px = 1 this equals:", "explain": "Roy's identity returns x = m/(3px) = 90/3 = 30 for this Cobb-Douglas.", "opts": ["30", "10", "60", "45"], "correct": 0}, {"id": 892, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "med", "q": "u = √(x·y), m = 120, py = 3. Marshallian demand for y is y = m/(2·py). Its value is:", "explain": "y = m/(2py) = 120/6 = 20.", "opts": ["20", "40", "10", "60"], "correct": 0}, {"id": 893, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "hard", "q": "u = √(x·y), m = 120, px = py = 3, so x = m/(2·px) = 20. The Marshallian own-price slope ∂x/∂px = −m/(2·px²) equals:", "explain": "∂x/∂px = −m/(2px²) = −120/18 = −20/3 ≈ −6.67.", "opts": ["−20/3 ≈ −6.67", "−10", "−20", "−1/6"], "correct": 0}, {"id": 894, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "hard", "q": "Same setup (u = √(x·y), m = 120, px = py = 3, x = 20). With ∂x/∂m = 1/(2·px), the Slutsky income term x·(∂x/∂m) equals:", "explain": "x·(∂x/∂m) = 20·(1/6) = 10/3 ≈ 3.33.", "opts": ["10/3 ≈ 3.33", "20", "1/6", "6.67"], "correct": 0}, {"id": 895, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "hard", "q": "Same setup, where ∂x/∂px = −20/3 (Marshallian) and the income term is +10/3. By Slutsky the Hicksian slope ∂h_x/∂px = ∂x/∂px + x·(∂x/∂m) equals:", "explain": "∂h_x/∂px = −20/3 + 10/3 = −10/3: the compensated curve is flatter than the Marshallian for this normal good.", "opts": ["−10/3 ≈ −3.33", "−20/3", "−10", "0"], "correct": 0}, {"id": 896, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "med", "q": "u = √(x·y): the cheapest cost to reach utility u = 20 at px = 3, py = 3 is e = 2·u·√(px·py). This equals:", "explain": "e = 2·u·√(px·py) = 2·20·3 = 120.", "opts": ["120", "240", "60", "400"], "correct": 0}, {"id": 897, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "hard", "q": "u = min(x, y), m = 120, px = py = 3, so old utility is 20. If py rises to 5, the compensating variation, e((3,5), 20) − m, equals:", "explain": "CV = u·(px + py_new) − m = 20·(3 + 5) − 120 = 160 − 120 = 40.", "opts": ["40", "30", "20", "160"], "correct": 0}, {"id": 898, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "hard", "q": "Same move (u = min(x, y), m = 120, px = py = 3 → py = 5). The new utility is 15, so the equivalent variation, m − e((3,3), 15), equals:", "explain": "EV = m − u_new·(px + py_old) = 120 − 15·(3 + 3) = 120 − 90 = 30.", "opts": ["30", "40", "20", "90"], "correct": 0}, {"id": 899, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "med", "q": "Quasilinear demand has inverse demand p = 20 − 2x. A consumer buying 6 units (price 8) enjoys consumer surplus ½·(20 − 8)·6, which equals:", "explain": "CS = ½·(choke price − price)·quantity = ½·(20 − 8)·6 = 36.", "opts": ["36", "72", "48", "60"], "correct": 0}, {"id": 900, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "easy", "q": "The two central optimisation problems of consumer duality are:", "explain": "Consumer duality pairs the utility-maximisation problem (UMP) with the expenditure-minimisation problem (EMP).", "opts": ["utility maximisation (UMP) and expenditure minimisation (EMP)", "profit maximisation and cost minimisation", "revenue maximisation and loss minimisation", "only utility maximisation"], "correct": 0}, {"id": 901, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "easy", "q": "In consumer duality, the solution of the UMP is ___ demand and the solution of the EMP is ___ demand.", "explain": "UMP yields Marshallian demand; EMP yields Hicksian demand.", "opts": ["Marshallian; Hicksian", "Hicksian; Marshallian", "Marshallian; Marshallian", "Hicksian; Hicksian"], "correct": 0}, {"id": 902, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "med", "q": "Which chain correctly recovers Marshallian demand from the expenditure side of duality?", "explain": "Evaluating Hicksian demand at the utility the income actually reaches, u = v(p,m), gives Marshallian demand.", "opts": ["take h(p,u) and set u = v(p,m): x(p,m) = h(p, v(p,m))", "x(p,m) = e(p,u)", "x(p,m) = ∂v/∂m", "x(p,m) = h(p,m)"], "correct": 0}, {"id": 903, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "med", "q": "A cafe patron finds her spending plan by minimising the cost of reaching a fixed satisfaction level. Shephard's lemma says the quantity of a drink she buys at that plan equals:", "explain": "Shephard's lemma: the compensated (Hicksian) quantity is the price-derivative of the expenditure function, ∂e/∂p_i.", "opts": ["the price-derivative of her minimised spending, ∂e/∂p_drink", "the price of the drink itself", "her total income", "the second derivative of her utility"], "correct": 0}, {"id": 904, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "med", "q": "Because e(p,u) is concave in prices, its own second derivative ∂²e/∂p_i² is ___, which is exactly the statement that ∂h_i/∂p_i is ___.", "explain": "Concavity of e makes ∂²e/∂p_i² ≤ 0; since h_i = ∂e/∂p_i, this is ∂h_i/∂p_i ≤ 0, the downward-sloping compensated demand.", "opts": ["non-positive; non-positive", "positive; positive", "zero; positive", "non-positive; positive"], "correct": 0}, {"id": 905, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "hard", "q": "Marshallian and Hicksian demand for a good coincide exactly at the price where:", "explain": "The curves cross where the compensating income equals actual income, i.e. u = v(p,m); away from it the income effect separates them.", "opts": ["u = v(p,m), i.e. the consumer has just enough income to reach that utility", "income is zero", "the good is free", "the two goods are perfect substitutes"], "correct": 0}, {"id": 906, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "med", "q": "Roy's identity is convenient because it recovers Marshallian demand from v(p,m) using only:", "explain": "Roy's identity needs just ∂v/∂p_i and ∂v/∂m and their ratio, avoiding a full re-optimisation.", "opts": ["two first derivatives of v and a ratio, with no integration", "a full re-solve of the utility-maximisation problem", "the utility function directly", "the whole expenditure function"], "correct": 0}, {"id": 907, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "med", "q": "For a normal good, the Marshallian own-price response is larger in magnitude than the Hicksian because the income effect ___ the substitution effect.", "explain": "By Slutsky, for a normal good the income term adds to the substitution term, so the Marshallian curve responds more strongly than the Hicksian.", "opts": ["reinforces", "opposes", "exactly cancels", "is undefined relative to"], "correct": 0}, {"id": 908, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "easy", "q": "Reading v(p,m) as the best utility a budget can buy and e(p,u) as the cheapest budget for a target utility, the identity e(p, v(p,m)) = m says:", "explain": "e(p, v(p,m)) = m: the minimum cost of the utility that income m can buy is m itself, the inverse relation between e and v.", "opts": ["the cheapest budget to reach the utility your money m buys is exactly m", "utility always equals income", "prices always equal quantities", "reaching any utility is free"], "correct": 0}, {"id": 909, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "Consumer surplus at a given price is best described as the area:", "explain": "Consumer surplus is the gap between willingness to pay (the inverse-demand curve) and the price actually paid, summed over the units bought — the area under demand and above the price.", "opts": ["above demand and below the price", "under demand and above the price, up to the quantity bought", "under the supply curve", "under demand only, ignoring price"], "correct": 1}, {"id": 910, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "Demand slopes downward mainly because:", "explain": "Diminishing marginal value: each extra unit adds less to willingness to pay, so buyers only take more units at a lower price — this is exactly why the demand curve falls.", "opts": ["each extra unit is worth less to the buyer than the last one", "firms always cut costs", "the government caps prices", "income is fixed"], "correct": 0}, {"id": 911, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "A price change's welfare effect on the consumer is approximated by:", "explain": "The money-metric impact of a price change on the buyer is the change in the area under demand above price, i.e. ΔCS.", "opts": ["the price elasticity", "total revenue lost by firms", "the CHANGE in consumer surplus between the old and new price", "the new price alone"], "correct": 2}, {"id": 912, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "On a standard price-quantity diagram, a price RISE shrinks consumer surplus by the area:", "explain": "The lost surplus is the region trapped between the old and new price lines and to the left of the demand curve — a trapezoid between the two prices bounded on the right by demand.", "opts": ["below both price lines", "between the two prices, bounded on the right by demand", "above the higher price only", "to the right of the quantity bought"], "correct": 1}, {"id": 913, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "Bruno pays a lot (in enthusiasm) for his first treat and barely reacts to his fifth. This is:", "explain": "Falling enthusiasm per extra treat is diminishing marginal value; aggregated across buyers it produces the downward-sloping demand curve.", "opts": ["a constant marginal value", "an increasing marginal value", "diminishing marginal value, the reason demand slopes down", "unrelated to demand"], "correct": 2}, {"id": 914, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "If the price of a good falls and nothing else changes, Marshallian consumer surplus:", "explain": "A lower price enlarges the area under demand and above price, so consumer surplus rises.", "opts": ["falls", "is unaffected", "turns negative", "rises"], "correct": 3}, {"id": 915, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "Ordinary consumer surplus is measured under:", "explain": "Plain consumer surplus is the area under the Marshallian (ordinary, actual) demand curve; CV and EV use the two Hicksian curves.", "opts": ["the Hicksian (compensated) demand curve", "the market supply curve", "the Marshallian (actual) demand curve", "the labor supply curve"], "correct": 2}, {"id": 916, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "Your surplus on a single unit bought at price p is:", "explain": "Surplus on a unit is willingness to pay minus price paid: the height of demand at that unit minus p.", "opts": ["the most you would have paid for it, minus p", "p itself", "always zero once you pay", "the seller's cost"], "correct": 0}, {"id": 917, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "You would have paid twice the price of your monthly bus pass; your surplus on the pass is:", "explain": "WTP = 2p and you pay p, so surplus = 2p − p = p greater than 0 — a positive surplus equal to WTP minus price.", "opts": ["zero", "negative", "undefined without more data", "positive, equal to willingness to pay minus the price actually paid"], "correct": 3}, {"id": 918, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "Plain consumer surplus (no CV, no EV) is best seen as:", "explain": "Marshallian CS is an exact money measure only when there is no income effect (quasilinear case); otherwise it lies between CV and EV as an approximation.", "opts": ["exact whenever income effects are present", "a handy approximation, exact only when there is no income effect", "always equal to total spending", "only defined for two-good economies"], "correct": 1}, {"id": 919, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "The Compensating Variation is money handed over:", "explain": "CV is measured at the NEW prices and asks how much income restores the ORIGINAL utility u₀: CV = e(p¹,u₀) − e(p⁰,u₀).", "opts": ["before the change, at old prices", "after the change, at old prices", "after the change, at NEW prices, to restore the OLD utility", "it is a quantity, never a sum of money"], "correct": 2}, {"id": 920, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "The Equivalent Variation is:", "explain": "EV is valued at the OLD prices and uses the NEW utility u₁: it is the income change at old prices equivalent to actually living through the price change. EV = e(p⁰,u₁) − e(p¹,u₁).", "opts": ["money handed over after the change, at new prices", "money taken or paid before the change, at OLD prices, equivalent to living through the change", "always identical to income", "defined only for Giffen goods"], "correct": 1}, {"id": 921, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "CV's reference (target) utility is:", "explain": "CV holds the consumer to the ORIGINAL utility u₀ and prices the change at new prices.", "opts": ["u<sub>1</sub>, the new utility", "whatever utility maximizes profit", "u<sub>0</sub>, the ORIGINAL utility", "there is no reference utility"], "correct": 2}, {"id": 922, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "EV's reference (target) utility is:", "explain": "EV holds the consumer to the NEW utility u₁ and prices the change at old prices.", "opts": ["u<sub>0</sub>, the original utility", "the average of u<sub>0</sub> and u<sub>1</sub>", "the firm's zero-profit utility", "u<sub>1</sub>, the NEW (post-change) utility"], "correct": 3}, {"id": 923, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "Which formula correctly gives CV?", "explain": "CV = e(p¹,u₀) − e(p⁰,u₀): both terms hold utility at u₀; for a price rise e(p¹,u₀) greater than e(p⁰,u₀) so CV greater than 0.", "opts": ["e(p<sup>0</sup>,u<sub>0</sub>)-e(p<sup>1</sup>,u<sub>0</sub>)", "e(p<sup>1</sup>,u<sub>0</sub>)-e(p<sup>0</sup>,u<sub>0</sub>)", "e(p<sup>0</sup>,u<sub>1</sub>)-e(p<sup>1</sup>,u<sub>1</sub>)", "e(p<sup>1</sup>,u<sub>1</sub>)-e(p<sup>0</sup>,u<sub>0</sub>)"], "correct": 1}, {"id": 924, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "Which formula correctly gives EV?", "explain": "EV = e(p¹,u₁) − e(p⁰,u₁): both terms hold utility at the new level u₁, valued at new vs old prices. For a price rise this is positive, and CV > |ΔCS| > EV.", "opts": ["e(p<sup>1</sup>,u<sub>0</sub>)-e(p<sup>0</sup>,u<sub>0</sub>)", "e(p<sup>0</sup>,u<sub>1</sub>)-e(p<sup>1</sup>,u<sub>1</sub>)", "e(p<sup>1</sup>,u<sub>1</sub>)-e(p<sup>0</sup>,u<sub>1</sub>)", "e(p<sup>0</sup>,u<sub>0</sub>)-e(p<sup>1</sup>,u<sub>0</sub>)"], "correct": 2}, {"id": 925, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "For a price RISE of a good she buys, CV is:", "explain": "A price rise hurts her, so restoring u₀ at the new higher prices requires giving her money: CV greater than 0.", "opts": ["undefined", "always zero", "negative", "positive: money must be handed to her"], "correct": 3}, {"id": 926, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "For a price FALL, CV is:", "explain": "A price fall helps her, so to hold her at the original u₀ money can be taken away: CV is negative.", "opts": ["negative: money could be taken from her and she is no worse off", "always positive", "exactly zero", "infinite"], "correct": 0}, {"id": 927, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "CV equals the area to the left of:", "explain": "CV is the area between the two prices to the left of the Hicksian (compensated) demand evaluated at the ORIGINAL utility u₀.", "opts": ["the Marshallian demand", "the market supply curve", "the Hicksian demand at u<sub>0</sub>", "the Hicksian demand at u<sub>1</sub>"], "correct": 2}, {"id": 928, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "EV equals the area to the left of:", "explain": "EV is the area between the two prices to the left of the Hicksian demand evaluated at the NEW utility u₁.", "opts": ["the Hicksian demand at u<sub>0</sub>", "the budget line", "the Marshallian demand", "the Hicksian demand at u<sub>1</sub>"], "correct": 3}, {"id": 929, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "For a NORMAL good and a price RISE, the correct ordering (all three positive) is:", "explain": "For a price rise of a normal good the magnitudes rank CV greater than |ΔCS| greater than EV; the compensated demand at the higher old-utility target lies farthest out, making CV largest.", "opts": ["change in CS &gt; CV &gt; EV", "EV &gt; CV &gt; change in CS", "CV &gt; change in CS &gt; EV", "they cannot be ranked in general"], "correct": 2}, {"id": 930, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "Why is CV the largest of the three for a price rise?", "explain": "CV must buy back the higher original utility u₀ at the new expensive prices, which costs more than EV, which reaches only the lower new utility u₁ at old cheap prices — so CV greater than |ΔCS| greater than EV.", "opts": ["CV asks for money AFTER the hike, at the new expensive prices, to reach the more demanding OLD utility, which costs more than paying up front at old cheap prices for a lower target", "it is a coincidence with no intuition behind it", "CV compares supply curves, not demand", "EV is always larger by definition, regardless of the direction of the price change"], "correct": 0}, {"id": 931, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "For a price FALL of a normal good, in magnitude:", "explain": "The ordering reverses for a price fall: EV greater than |ΔCS| greater than CV, so EV is the largest in magnitude.", "opts": ["the change in CS is the largest", "EV is the largest", "CV is the largest", "all three vanish"], "correct": 1}, {"id": 932, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "Under QUASILINEAR preferences, for any price change:", "explain": "With quasilinear preferences there is no income effect on the good, so Marshallian and both Hicksian demands coincide and CV = ΔCS = EV exactly.", "opts": ["only CV and CS coincide, not EV", "EV is always exactly zero", "CV and EV are undefined", "CV, EV and the change in CS all coincide exactly"], "correct": 3}, {"id": 933, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "Quasilinear preferences deliver that exact equality because:", "explain": "No income effect means the three demand curves (Marshallian, Hicksian at u₀, Hicksian at u₁) are identical, so the three welfare areas are equal.", "opts": ["the consumer has zero income", "there is no income effect on the good, so Marshallian and both Hicksian demands coincide", "utility cannot be defined for such preferences", "prices are assumed constant"], "correct": 1}, {"id": 934, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "A Laspeyres price index prices:", "explain": "Laspeyres uses BASE-period quantities: it values the fixed old basket at new prices relative to old prices, L = (p¹·q⁰)/(p⁰·q⁰).", "opts": ["the BASE-period (old) basket at the NEW prices", "the current basket at current prices", "the base (old) basket at base prices only", "the current basket at base prices"], "correct": 0}, {"id": 935, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "The Laspeyres index tends to:", "explain": "By fixing the base basket, Laspeyres ignores substitution away from goods that became relatively expensive, so it OVERSTATES the true cost-of-living rise.", "opts": ["always equal the Paasche index", "OVERSTATE the true rise in the cost of living, since it ignores substitution", "understate the true rise in the cost of living", "apply only when income is constant"], "correct": 1}, {"id": 936, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "If EVERY price changes by the same factor k, then:", "explain": "If all prices scale by k, then (p¹·q)/(p⁰·q) = k for any basket, so both Laspeyres and Paasche equal k exactly (no substitution occurs).", "opts": ["only Laspeyres equals k", "only Paasche equals k", "Laspeyres and Paasche both equal k exactly", "both differ substantially from k"], "correct": 2}, {"id": 937, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "Inverse demand is p = 20 − q. At a price of 8, consumer surplus equals:", "explain": "At p = 8 quantity is q = 20 − 8 = 12; the CS triangle has base 12 and height (20 − 8) = 12, so CS = ½·12·12 = 72.", "opts": ["48", "72", "96", "144"], "correct": 1}, {"id": 938, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "Demand is q = 30 − 2p. At a price of 5, consumer surplus equals:", "explain": "Inverse demand is p = 15 − q/2 (choke price 15). At p = 5, q = 20; CS = ½·(15 − 5)·20 = 100.", "opts": ["75", "100", "150", "200"], "correct": 1}, {"id": 939, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "easy", "q": "Claire's inverse demand for a good is p = 15 − q. She faces a price of 5. Her consumer surplus is:", "explain": "At p = 5, q = 15 − 5 = 10; the surplus triangle has base 10 and height (15 − 5) = 10, so CS = ½·10·10 = 50.", "opts": ["25", "50", "75", "100"], "correct": 1}, {"id": 940, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "Tom's inverse demand is p = 20 − 1.5q. At a price of 5 he buys 10 units. His consumer surplus is:", "explain": "Check the quantity: p = 20 − 1.5·10 = 5. The triangle has base q = 10 and height (20 − 5) = 15, so CS = ½·15·10 = 75.", "opts": ["50", "62.5", "75", "112.5"], "correct": 2}, {"id": 941, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "easy", "q": "Inverse demand is p = 8 − q. At a price of 3, consumer surplus equals:", "explain": "At p = 3, q = 5; the triangle has base 5 and height (8 − 3) = 5, so CS = ½·5·5 = 12.5.", "opts": ["10", "12.5", "15", "25"], "correct": 1}, {"id": 942, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "easy", "q": "Inverse demand is p = 12 − 2q. At a price of 4, consumer surplus equals:", "explain": "At p = 4, 2q = 8 so q = 4; height is (12 − 4) = 8, so CS = ½·8·4 = 16.", "opts": ["8", "16", "24", "32"], "correct": 1}, {"id": 943, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "hard", "q": "Demand is q = 100 − 5p. At a price of 10, consumer surplus equals:", "explain": "Choke price is 20 (q = 0 when p = 20). At p = 10, q = 50; CS = ½·(20 − 10)·50 = 250.", "opts": ["125", "250", "500", "1000"], "correct": 1}, {"id": 944, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "Inverse demand is p = 40 − q. At a price of 10, consumer surplus equals:", "explain": "At p = 10, q = 30; the triangle has base 30 and height (40 − 10) = 30, so CS = ½·30·30 = 450.", "opts": ["150", "300", "450", "900"], "correct": 2}, {"id": 945, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "easy", "q": "For any straight-line demand, the consumer-surplus triangle at a given price equals:", "explain": "CS is a right triangle whose base is the quantity bought and whose height is the vertical gap between the choke price and the price paid: CS = ½·base·height.", "opts": ["price × quantity", "½ × quantity bought × (choke price − price)", "quantity ÷ price", "(choke price − price) only"], "correct": 1}, {"id": 946, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "easy", "q": "Demand is q = 60 − 2p. At a price of 10, consumer surplus equals:", "explain": "Inverse demand p = 30 − q/2 (choke 30). At p = 10, q = 40; CS = ½·(30 − 10)·40 = 400.", "opts": ["200", "300", "400", "800"], "correct": 2}, {"id": 947, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "hard", "q": "Demand is q = 24 − 2p. If the price rises from 4 to 7, the loss of consumer surplus is:", "explain": "With inverse demand p = 12 − q/2, CS at price p equals (12 − p)². The loss is (12 − 4)² − (12 − 7)² = 64 − 25 = 39.", "opts": ["25", "39", "64", "103"], "correct": 1}, {"id": 948, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "easy", "q": "The Compensating Variation of a price change is computed at:", "explain": "CV = e(p¹,u₀) − e(p⁰,u₀): it uses the NEW prices and restores the ORIGINAL utility u₀.", "opts": ["the new prices, targeting the original utility u₀", "the old prices, targeting the new utility u₁", "whichever prices are lower", "the average of old and new prices"], "correct": 0}, {"id": 949, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "easy", "q": "The Equivalent Variation of a price change is computed at:", "explain": "EV = e(p⁰,u₁) − e(p¹,u₁): it uses the OLD prices and the NEW utility u₁.", "opts": ["the new prices, targeting the original utility u₀", "the old prices, targeting the new utility u₁", "the new prices, targeting the new utility u₁", "the old prices, targeting the original utility u₀"], "correct": 1}, {"id": 950, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "Bill has quasilinear preferences with demand x = 14 − p. The price of x rises from 2 to 6. His equivalent variation (equal to CV and to ΔCS here) is, in magnitude:", "explain": "Quasilinear ⇒ CV = EV = ΔCS = the area under demand between the prices = 14·(6 − 2) − (6² − 2²)/2 = 56 − 16 = 40.", "opts": ["20", "28", "40", "56"], "correct": 2}, {"id": 951, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "A price rise raises the cost of reaching the original utility from e(p⁰,u₀) = 100 to e(p¹,u₀) = 140. The compensating variation is:", "explain": "CV = e(p¹,u₀) − e(p⁰,u₀) = 140 − 100 = 40 (positive, because a price rise means she must be handed money to restore u₀).", "opts": ["−40", "40", "120", "240"], "correct": 1}, {"id": 952, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "After a price rise, reaching the new utility costs e(p⁰,u₁) = 90 at old prices and e(p¹,u₁) = 130 at new prices. The equivalent variation EV = e(p¹,u₁) − e(p⁰,u₁) equals:", "explain": "EV = 130 − 90 = +40: reaching the new (lower) utility u₁ costs 40 more at the new prices than at the old — the money-metric size of the welfare loss, taken positive so that CV > |ΔCS| > EV.", "opts": ["+40", "−40", "+220", "−220"], "correct": 0}, {"id": 953, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "A consumer has quasilinear preferences with demand x = 10 − p. The price rises from 3 to 5. Then CV, EV and ΔCS are each equal to:", "explain": "No income effect ⇒ all three coincide = area under demand between prices = 10·(5 − 3) − (5² − 3²)/2 = 20 − 8 = 12.", "opts": ["6", "10", "12", "15"], "correct": 2}, {"id": 954, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "A consumer with quasilinear preferences has demand x = 8 − p; the price falls from 4 to 2. The gain measured by CV = EV = ΔCS is:", "explain": "Quasilinear ⇒ the three measures agree; the gain is the area under demand between the prices = 8·(4 − 2) − (4² − 2²)/2 = 16 − 6 = 10.", "opts": ["8", "10", "12", "16"], "correct": 1}, {"id": 955, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "hard", "q": "A cinema raises the ticket price. For this normal good the three welfare measures rank (in magnitude) as:", "explain": "For a price RISE of a normal good the ordering is CV greater than |ΔCS| greater than EV; CV is largest because it buys back the higher original utility at the new expensive prices.", "opts": ["EV greater than |ΔCS| greater than CV", "CV greater than |ΔCS| greater than EV", "|ΔCS| greater than CV greater than EV", "all three are equal"], "correct": 1}, {"id": 956, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "A streaming service cuts its price (a normal good). The three welfare measures rank (in magnitude) as:", "explain": "For a price FALL the ordering reverses: EV greater than |ΔCS| greater than CV, so the equivalent variation is the largest gain measure.", "opts": ["CV greater than |ΔCS| greater than EV", "they cannot be ranked", "EV greater than |ΔCS| greater than CV", "all three are zero"], "correct": 2}, {"id": 957, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "easy", "q": "If a consumer's preferences are quasilinear in the numeraire, then for a price change of the other good:", "explain": "Quasilinear preferences have no income effect on the good, so the Marshallian and both Hicksian demands coincide and CV = EV = ΔCS.", "opts": ["CV and EV differ by the income effect", "CV = EV = ΔCS exactly", "only ΔCS is defined", "the three can be ranked but never equal"], "correct": 1}, {"id": 958, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "Why does the Laspeyres cost-of-living index OVERSTATE the true rise in living costs?", "explain": "Laspeyres keeps the old basket fixed, ignoring that consumers substitute away from goods that became relatively dear; this makes the measured price rise too large.", "opts": ["it uses current quantities", "it holds the base-period basket fixed and so ignores substitution toward relatively cheaper goods", "it double-counts income", "it uses base prices for the numerator"], "correct": 1}, {"id": 959, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "easy", "q": "Why does the Paasche cost-of-living index UNDERSTATE the true rise in living costs?", "explain": "Paasche uses the current (already-substituted) basket, which understates how costly the old preferred consumption would have become — biasing the measured rise downward.", "opts": ["it uses base quantities", "it holds the current basket fixed and so already reflects substitution that has occurred", "it ignores prices", "it equals the Laspeyres index"], "correct": 1}, {"id": 960, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "The base basket is 3 units of X and 4 units of Y. Base prices are (pX, pY) = (2, 5); new prices are (3, 6). The Laspeyres price index is closest to:", "explain": "L = (p¹·q⁰)/(p⁰·q⁰) = (3·3 + 6·4)/(2·3 + 5·4) = 33/26 ≈ 1.27.", "opts": ["1.00", "1.27", "1.30", "1.50"], "correct": 1}, {"id": 961, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "hard", "q": "The current basket is 4 units of X and 3 units of Y. Base prices are (2, 5); new prices are (3, 6). The Paasche price index is closest to:", "explain": "P = (p¹·q¹)/(p⁰·q¹) = (3·4 + 6·3)/(2·4 + 5·3) = 30/23 ≈ 1.30.", "opts": ["1.13", "1.27", "1.30", "1.45"], "correct": 2}, {"id": 962, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "easy", "q": "Every price in the economy rises by exactly 20%. The Laspeyres price index equals:", "explain": "When all prices scale by the same factor k, (p¹·q)/(p⁰·q) = k for any basket, so the index is exactly 1.20.", "opts": ["1.10", "1.20", "1.44", "it depends on the basket"], "correct": 1}, {"id": 963, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "Before a change, food was 80% of the budget and clothing 20%. Food prices rise 5% and clothing 10%. The Laspeyres-type CPI is:", "explain": "Weight the price relatives by base expenditure shares: 0.8·1.05 + 0.2·1.10 = 1.06.", "opts": ["1.05", "1.06", "1.07", "1.15"], "correct": 1}, {"id": 964, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "hard", "q": "Base prices are (pX, pY) = (2, 4). Base quantities are (5, 3); current quantities are (6, 5). The Laspeyres QUANTITY index is closest to:", "explain": "The Laspeyres quantity index uses BASE prices: Lq = (p⁰·q¹)/(p⁰·q⁰) = (2·6 + 4·5)/(2·5 + 4·3) = 32/22 ≈ 1.45.", "opts": ["1.10", "1.33", "1.45", "1.60"], "correct": 2}, {"id": 965, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "Current prices are (pX, pY) = (3, 5). Base quantities are (5, 3); current quantities are (6, 5). The Paasche QUANTITY index is closest to:", "explain": "The Paasche quantity index uses CURRENT prices: Pq = (p¹·q¹)/(p¹·q⁰) = (3·6 + 5·5)/(3·5 + 5·3) = 43/30 ≈ 1.43.", "opts": ["1.20", "1.43", "1.55", "1.70"], "correct": 1}, {"id": 966, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "hard", "q": "A consumer starts with basket (4, 4) at prices (1, 1). Good X's price then rises to 2 and she moves to (2, 6) at prices (2, 1). Her Laspeyres price index is:", "explain": "L = (p¹·q⁰)/(p⁰·q⁰) = (2·4 + 1·4)/(1·4 + 1·4) = 12/8 = 1.50; the matching Paasche index (10/8 = 1.25) is smaller, showing Laspeyres overstates.", "opts": ["1.25", "1.50", "1.75", "2.00"], "correct": 1}, {"id": 967, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "Using the data of the previous item (basket (4,4)→(2,6), prices (1,1)→(2,1)), the Paasche price index is:", "explain": "P = (p¹·q¹)/(p⁰·q¹) = (2·2 + 1·6)/(1·2 + 1·6) = 10/8 = 1.25 — below the Laspeyres 1.50, confirming the true cost change lies between them.", "opts": ["1.10", "1.25", "1.50", "1.75"], "correct": 1}, {"id": 968, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "A Laspeyres quantity index differs from a Paasche quantity index in that it weights the two baskets using:", "explain": "A Laspeyres quantity index values both quantity baskets at BASE prices, Lq = (p⁰·q¹)/(p⁰·q⁰); the Paasche version uses current prices.", "opts": ["current prices", "base-period prices", "the average of the two price vectors", "quantities, not prices"], "correct": 1}, {"id": 969, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "easy", "q": "Your willingness to pay for one concert ticket is 12 and the price is 7. Your consumer surplus on that ticket is:", "explain": "Surplus on a single unit is WTP minus price = 12 − 7 = 5.", "opts": ["5", "7", "12", "19"], "correct": 0}, {"id": 970, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "A buyer's willingness to pay for successive units is 10, 8, 6, 4. At a price of 5 she buys every unit worth at least 5. Her total consumer surplus is:", "explain": "She buys the units worth 10, 8, 6 (each ≥ 5) and skips the 4. Surplus = (10−5)+(8−5)+(6−5) = 5+3+1 = 9.", "opts": ["6", "9", "13", "18"], "correct": 1}, {"id": 971, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "Inverse demand is p = 100 − 4q. At a price of 20, consumer surplus equals:", "explain": "At p = 20, 4q = 80 so q = 20; height is (100 − 20) = 80, so CS = ½·80·20 = 800.", "opts": ["400", "600", "800", "1600"], "correct": 2}, {"id": 972, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "Bruno's owner has inverse demand p = 6 − q for dog treats (value measured in koruna). At a price of 2 per treat, the surplus enjoyed is:", "explain": "At p = 2, q = 4; the triangle has base 4 and height (6 − 2) = 4, so CS = ½·4·4 = 8.", "opts": ["4", "6", "8", "12"], "correct": 2}, {"id": 973, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "easy", "q": "Inverse demand is p = 30 − q. If the good becomes free (price 0), consumer surplus equals:", "explain": "At p = 0, q = 30; the whole triangle under demand has base 30 and height 30, so CS = ½·30·30 = 450.", "opts": ["225", "300", "450", "900"], "correct": 2}, {"id": 974, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "Base prices are (5, 2), base quantities (2, 4), current quantities (3, 3). The Laspeyres quantity index is closest to:", "explain": "Lq = (p⁰·q¹)/(p⁰·q⁰) = (5·3 + 2·3)/(5·2 + 2·4) = 21/18 = 7/6 ≈ 1.17.", "opts": ["1.00", "1.17", "1.33", "1.50"], "correct": 1}, {"id": 975, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "hard", "q": "The true cost-of-living increase for a consumer who substitutes normally lies:", "explain": "Because Laspeyres overstates and Paasche understates, the true (constant-utility) cost-of-living change is bracketed between them: Paasche ≤ true ≤ Laspeyres.", "opts": ["above the Laspeyres index", "below the Paasche index", "between the Paasche (lower) and Laspeyres (upper) bounds", "exactly at the Laspeyres index"], "correct": 2}, {"id": 976, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "hard", "q": "Demand is q = 20 − p. If the price falls from 12 to 8, the gain in consumer surplus is:", "explain": "CS at price p is ½·(20 − p)². The gain is ½·(20 − 8)² − ½·(20 − 12)² = 72 − 32 = 40.", "opts": ["16", "32", "40", "72"], "correct": 2}, {"id": 977, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "hard", "q": "For a price rise of a normal good, the reason CV exceeds |ΔCS| is that:", "explain": "CV is the area to the left of the Hicksian demand at u₀, which for a normal good lies outside the Marshallian curve, so CV greater than |ΔCS| greater than EV.", "opts": ["CV uses the compensated demand at the original (higher) utility, which lies farther out than Marshallian demand", "CV ignores the substitution effect", "Marshallian demand is vertical", "EV is measured at new prices"], "correct": 0}, {"id": 978, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "easy", "q": "A monthly transit pass costs 800 and a commuter would have paid up to 1100 for it. Her consumer surplus from the pass is:", "explain": "Surplus = willingness to pay − price = 1100 − 800 = 300.", "opts": ["300", "800", "1100", "1900"], "correct": 0}, {"id": 979, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "Which statement about consumer surplus and income effects is correct?", "explain": "In general |ΔCS| sits between CV and EV; the three coincide only in the quasilinear (zero income effect) case.", "opts": ["Marshallian CS always equals CV", "Marshallian CS lies between CV and EV, and equals both only when the income effect is zero", "EV always exceeds CV for a price rise", "CS is undefined when demand slopes down"], "correct": 1}, {"id": 980, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "Demand is q = 40 − 2p. At a price of 6, consumer surplus equals:", "explain": "Inverse demand p = 20 − q/2 (choke 20). At p = 6, q = 28; CS = ½·(20 − 6)·28 = ½·14·28 = 196.", "opts": ["98", "196", "280", "392"], "correct": 1}, {"id": 981, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "hard", "q": "If the Paasche price index equals the Laspeyres price index for some change, it must be that:", "explain": "The two indices coincide when the basket does not change between periods — for instance when every price changes by the same factor, so no substitution occurs.", "opts": ["the consumer is irrational", "there was no substitution between the base and current baskets (e.g. all prices moved proportionally)", "income fell to zero", "the goods are perfect complements only by coincidence"], "correct": 1}, {"id": 982, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "med", "q": "A hockey fan's inverse demand for arena visits is p = 18 − 3q. At a price of 6, her consumer surplus is:", "explain": "At p = 6, 3q = 12 so q = 4; height is (18 − 6) = 12, so CS = ½·12·4 = 24.", "opts": ["12", "18", "24", "36"], "correct": 2}, {"id": 983, "topic": "Q13", "topicName": "Welfare & indices", "type": "mc", "difficulty": "easy", "q": "For a price DECREASE, the compensating variation CV is:", "explain": "A price fall benefits the consumer, so holding her at the original u₀ requires taking money away: CV is negative for a price decrease.", "opts": ["positive", "negative (income could be taken from the consumer and leave her at the original utility)", "zero", "equal to the Laspeyres index"], "correct": 1}];
const TOPIC_ORDER=["OPT","Q1","Q2","Q3","Q4","Q5","Q6","Q7","Q8","Q9","Q10","Q11","Q12","Q13"];
const TOPIC_LABEL={OPT:"Optimisation",Q1:"Monotonicity",Q2:"Elasticity",Q3:"Subs & compl",
  Q4:"Subst. effect",Q5:"Convexity",Q6:"Economic bads",Q7:"WARP",Q8:"Endowment",
  Q9:"Labour",Q10:"Risk",Q11:"Time",Q12:"Duality",Q13:"Welfare"};
const DIFFS=[["all","All"],["easy","Easy"],["med","Medium"],["hard","Hard"]];
const TOPIC_NAME={};DATA.forEach(q=>{if(!(q.topic in TOPIC_NAME))TOPIC_NAME[q.topic]=q.topicName;});

const S={topic:"all",diff:"all",shuffle:true,deck:[],pos:0,answered:0,correct:0,wrong:new Set(),curAnswered:false};
const $=s=>document.querySelector(s);
const stage=$("#stage"),bar=$("#bar"),scoreEl=$("#score");

function load(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
S.wrong=new Set(load("ctd_wrong",[]));
(function(){const t=load("ctd_theme",null);if(t)document.documentElement.setAttribute("data-theme",t);})();

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function matchDiff(q){return S.diff==="all"||(q.difficulty||"med")===S.diff;}
function pool(){return DATA.filter(q=>(S.topic==="all"||q.topic===S.topic)&&matchDiff(q)).map(q=>q.id);}

function buildFilters(){
  const nav=$("#filters");nav.innerHTML="";
  const mk=(id,label,n,title,cur)=>{
    const b=document.createElement("button");
    b.className="chip";b.setAttribute("aria-pressed",cur);
    b.innerHTML=label+'<span class="n">'+n+'</span>';
    b.title=title;b.dataset.id=id;return b;
  };
  const allN=DATA.filter(matchDiff).length;
  const ab=mk("all","All",allN,"All topics",S.topic==="all");
  ab.onclick=()=>{S.topic="all";start()};nav.appendChild(ab);
  TOPIC_ORDER.forEach(id=>{
    const n=DATA.filter(q=>q.topic===id&&matchDiff(q)).length;
    if(!n)return;
    const b=mk(id,TOPIC_LABEL[id]||id,n,TOPIC_NAME[id]||id,S.topic===id);
    b.onclick=()=>{S.topic=id;start()};nav.appendChild(b);
  });
  const dnav=$("#difffilters");dnav.innerHTML="";
  const lab=document.createElement("span");lab.className="flabel";lab.textContent="Level";dnav.appendChild(lab);
  DIFFS.forEach(([id,label])=>{
    const n=id==="all"?DATA.filter(q=>S.topic==="all"||q.topic===S.topic).length
                       :DATA.filter(q=>(S.topic==="all"||q.topic===S.topic)&&(q.difficulty||"med")===id).length;
    const b=document.createElement("button");
    b.className="chip sm";b.setAttribute("aria-pressed",S.diff===id);
    b.innerHTML=label+'<span class="n">'+n+'</span>';
    b.onclick=()=>{S.diff=id;start()};dnav.appendChild(b);
  });
}

function start(fromWrong){
  const ids=fromWrong?[...S.wrong]:pool();
  S.deck=S.shuffle?shuffle(ids.slice()):ids.slice();
  S.pos=0;S.answered=0;S.correct=0;S.curAnswered=false;
  buildFilters();
  render();
}

function updateScore(){
  const acc=S.answered?Math.round(100*S.correct/S.answered):0;
  scoreEl.innerHTML='<b>'+S.correct+'</b> / '+S.answered+' &nbsp;·&nbsp; <span class="acc">'+acc+'%</span>';
  $("#wrongN").textContent=S.wrong.size;
  $("#reviewWrong").disabled=S.wrong.size===0;
}
function setBar(){bar.style.width=(S.deck.length?100*S.pos/S.deck.length:0)+"%";}

function render(){
  updateScore();setBar();
  if(S.pos>=S.deck.length){renderDone();return;}
  S.curAnswered=false;
  const q=DATA.find(x=>x.id===S.deck[S.pos]);
  const type=q.type||"mc";
  const tag=(TOPIC_LABEL[q.topic]||q.topic);
  const dc=(q.difficulty||"med");
  const dl=dc==="easy"?"easy":dc==="hard"?"hard":"med";
  let body;
  if(type==="mc"){
    body='<div class="opts">'+q.opts.map((o,i)=>
      '<button class="opt" data-i="'+i+'"><span class="key">'+"ABCD"[i]+'</span>'+
      '<span class="otext">'+o+'</span><span class="mark"></span></button>').join("")+'</div>';
  }else if(type==="num"){
    body='<div class="numrow"><input class="numin" id="numin" type="text" inputmode="text" autocomplete="off" spellcheck="false" placeholder="type your answer, then Check"><button class="next" id="check">Check</button></div>';
  }else{
    body='<div id="revbox"><button class="next wide" id="show">Show answer</button></div>';
  }
  const card=document.createElement("article");card.className="card";
  card.innerHTML=
    '<div class="qmeta"><span class="qmeta-l"><span class="topic-tag">'+tag+'</span>'+
    '<span class="diffbadge '+dl+'">'+dl+'</span></span>'+
    '<span class="qindex">'+(S.pos+1)+' / '+S.deck.length+'</span></div>'+
    '<p class="stem">'+q.q+'</p>'+body+
    '<div class="explain" id="explain"></div>'+
    '<div class="feedback" id="feedback"></div>';
  stage.innerHTML="";stage.appendChild(card);
  if(type==="mc"){
    card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i,q));
  }else if(type==="num"){
    const inp=$("#numin");inp.focus();
    $("#check").onclick=()=>checkNum(q,inp);
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();e.stopPropagation();checkNum(q,inp);}});
  }else{
    $("#show").onclick=()=>reveal(q);
  }
}

function showExplain(q){
  if(!q.explain)return;
  const ex=$("#explain");ex.classList.add("show");
  ex.innerHTML='<span class="why">Why</span><span class="etext">'+q.explain+'</span>';
}
function showVerdict(ok,text){
  const fb=$("#feedback");fb.classList.add("show");
  fb.innerHTML='<span class="verdict '+(ok?"ok":"no")+'">'+text+'</span>'+
    '<button class="next" id="next">'+(S.pos+1>=S.deck.length?"See results":"Next →")+'</button>';
  $("#next").onclick=next;$("#next").focus();
  updateScore();
}

function answer(i,q){
  if(S.curAnswered)return;
  S.curAnswered=true;S.answered++;
  const opts=[...stage.querySelectorAll(".opt")];
  const right=q.correct, ok=i===right;
  if(ok){S.correct++;S.wrong.delete(q.id);}else S.wrong.add(q.id);
  save("ctd_wrong",[...S.wrong]);
  opts.forEach((b,j)=>{
    b.disabled=true;
    if(j===right){b.classList.add("correct");b.querySelector(".mark").textContent="✓";}
    else if(j===i){b.classList.add("wrong");b.querySelector(".mark").textContent="✗";}
    else b.classList.add("dim");
  });
  showExplain(q);
  showVerdict(ok, ok?"Correct":("Not quite · answer is "+"ABCD"[right]));
}

function checkNum(q,inp){
  if(S.curAnswered)return;
  const raw=(inp.value||"").trim().replace(",",".").replace(/−/g,"-").replace(/\s/g,"");
  if(raw===""){inp.focus();return;}
  const val=parseFloat(raw);
  S.curAnswered=true;S.answered++;
  const ok=isFinite(val)&&Math.abs(val-q.answer)<=(q.tol||1e-6);
  if(ok){S.correct++;S.wrong.delete(q.id);}else S.wrong.add(q.id);
  save("ctd_wrong",[...S.wrong]);
  inp.disabled=true;inp.classList.add(ok?"good":"bad");
  showExplain(q);
  showVerdict(ok, ok?"Correct":("Not quite · answer is "+q.display));
}

function reveal(q){
  if(S.curAnswered)return;
  $("#revbox").innerHTML='<div class="ansline"><span class="anslabel">Answer</span><span>'+q.a+'</span></div>';
  showExplain(q);
  const fb=$("#feedback");fb.classList.add("show");
  fb.innerHTML='<span class="selfq">Did you get it?</span>'+
    '<span class="gradebtns"><button class="grade miss" id="miss">Missed <span class="kb">M</span></button>'+
    '<button class="grade got" id="got">Got it <span class="kb">G</span></button></span>';
  $("#got").onclick=()=>grade(q,true);$("#miss").onclick=()=>grade(q,false);$("#got").focus();
}

function grade(q,ok){
  if(S.curAnswered)return;
  S.curAnswered=true;S.answered++;
  if(ok){S.correct++;S.wrong.delete(q.id);}else S.wrong.add(q.id);
  save("ctd_wrong",[...S.wrong]);
  showVerdict(ok, ok?"Marked correct":"Marked for review");
}

function next(){S.pos++;render();}

function renderDone(){
  setBar();
  const acc=S.answered?Math.round(100*S.correct/S.answered):0;
  const card=document.createElement("article");card.className="card";
  const msg=acc>=90?"Exam-ready on this set.":acc>=70?"Solid. Drill the misses and you are there.":"Good rep. Run the wrong ones again.";
  const label=S.topic==="all"?"":(TOPIC_LABEL[S.topic]||S.topic);
  card.innerHTML='<div class="done"><div class="big">'+acc+'%</div>'+
    '<p><b style="color:var(--ink)">'+S.correct+'</b> of '+S.answered+' correct'+
    (label?" · "+label:"")+(S.diff==="all"?"":" · "+S.diff)+'</p>'+
    '<p>'+msg+'</p><div class="row">'+
    '<button class="btn" id="again">Restart set</button>'+
    (S.wrong.size?'<button class="btn" id="drill" aria-pressed="true">Drill wrong ('+S.wrong.size+')</button>':'')+
    '</div></div>';
  stage.innerHTML="";stage.appendChild(card);
  $("#again").onclick=()=>start(false);
  const d=$("#drill");if(d)d.onclick=()=>{S.topic="all";S.diff="all";buildFilters();start(true);};
}

$("#shuffle").onclick=function(){S.shuffle=!S.shuffle;this.setAttribute("aria-pressed",S.shuffle);start(false);};
$("#restart").onclick=()=>start(false);
$("#reviewWrong").onclick=()=>{if(S.wrong.size){S.topic="all";S.diff="all";buildFilters();start(true);}};
$("#theme").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const mql=matchMedia("(prefers-color-scheme:dark)").matches;
  const nowDark=cur?cur==="dark":mql;
  const nx=nowDark?"light":"dark";
  document.documentElement.setAttribute("data-theme",nx);save("ctd_theme",nx);
};

document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.target&&e.target.id==="numin")return;
  const q=DATA.find(x=>x.id===S.deck[S.pos]);
  const type=q?(q.type||"mc"):"mc";
  const k=e.key.toLowerCase();
  if(!S.curAnswered){
    if(type==="mc"){
      let i=-1;
      if("abcd".includes(k))i="abcd".indexOf(k);
      else if("1234".includes(k))i=+k-1;
      if(i>=0){const b=stage.querySelector('.opt[data-i="'+i+'"]');if(b){e.preventDefault();b.click();}}
    }else if(type==="reveal"){
      if(!$("#got")){if(e.key==="Enter"||e.key===" "){e.preventDefault();const s=$("#show");if(s)s.click();}}
      else if(k==="g"){e.preventDefault();$("#got").click();}
      else if(k==="m"){e.preventDefault();$("#miss").click();}
    }
  }else if(e.key==="Enter"||e.key===" "||e.key==="ArrowRight"){
    const n=$("#next")||$("#again");if(n){e.preventDefault();n.click();}
  }
});

buildFilters();start(false);
</script>
</body>
</html>
