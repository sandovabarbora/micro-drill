plain": "After-tax wage = w(1 minus t): 20·0.6 = 12 at t=0.4, and 20·0.75 = 15 at t=0.25.", "opts": ["12 to 15", "8 to 5", "12 to 16", "20 to 15"], "correct": 0}, {"id": 682, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "med", "q": "A student has a scholarship of 100/week (non-labour income) and can tutor at 15/h after tax. If she tutors 12 hours, her weekly consumption is:", "explain": "Consumption = m₀ plus after-tax wage·hours = 100 plus 15·12 = 100 plus 180 = 280.", "opts": ["280", "180", "100", "195"], "correct": 0}, {"id": 683, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "med", "q": "A wage rise raises the price of leisure. Decomposed, its substitution effect on HOURS is ___ and (with leisure normal) its income effect on HOURS is ___:", "explain": "Substitution: dearer leisure means less leisure and more hours (positive). Income (leisure normal): richer means more leisure and fewer hours (negative). They conflict, so net hours are ambiguous.", "opts": ["positive; negative", "negative; positive", "positive; positive", "negative; negative"], "correct": 0}, {"id": 684, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "easy", "q": "The time constraint splits the endowment T into:", "explain": "All available time is either leisure or work: T = R + L.", "opts": ["leisure R and labour L, with T = R + L", "consumption and savings", "wage and tax", "only labour L"], "correct": 0}, {"id": 685, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "easy", "q": "In the labour-leisure model, the opportunity cost (price) of one hour of leisure is:", "explain": "Taking an hour of leisure means giving up the wage from working it, so the wage is the price of leisure.", "opts": ["the wage that hour would have earned", "the non-labour income m₀", "the time endowment T", "zero"], "correct": 0}, {"id": 686, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "med", "q": "Compared with a wage change, a change in non-labour income m₀ (wage fixed) is:", "explain": "m₀ shifts the budget in parallel without changing the wage, so leisure's relative price is unchanged: only an income effect operates.", "opts": ["a pure income effect (no change in the price of leisure)", "a pure substitution effect", "ambiguous, with both effects", "impossible to sign"], "correct": 0}, {"id": 687, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "hard", "q": "Preferences u = C + 8·ln(R) (quasilinear in consumption), time endowment T=24, after-tax wage w=2. Optimal leisure R is:", "explain": "MRS = (8/R)/1 = 8/R; setting it equal to the wage 2 gives R = 8/2 = 4 (quasilinear preferences make leisure depend only on the wage).", "opts": ["4", "8", "12", "2"], "correct": 0}, {"id": 688, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "hard", "q": "Same quasilinear worker (u = C + 8·ln R, T=24). When the after-tax wage rises from 2 to 4, optimal hours worked change from:", "explain": "R = 8/w falls from 4 to 2 as the wage rises, so hours L = 24 minus R rise from 20 to 22; with no income effect on leisure only the substitution effect operates (always more hours).", "opts": ["20 to 22 (hours rise; quasilinear leisure has no income effect)", "20 to 18", "stay at 20", "22 to 20"], "correct": 0}, {"id": 689, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "easy", "q": "For a gamble with outcomes x<sub>i</sub> and probabilities p<sub>i</sub>, the expected value EV equals:", "explain": "Expected value is the probability-weighted sum of outcomes, EV = Σ pᵢxᵢ. Option B states exactly this; u(Σ pᵢxᵢ) is u(EV) and Σ pᵢu(xᵢ) is expected utility.", "opts": ["the utility of the average outcome, u(Σ p<sub>i</sub> x<sub>i</sub>)", "Σ p<sub>i</sub> x<sub>i</sub>", "Σ p<sub>i</sub> u(x<sub>i</sub>)", "the largest possible x<sub>i</sub>"], "correct": 1}, {"id": 690, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "easy", "q": "Expected utility EU of the same gamble equals:", "explain": "Expected utility weights the utility of each outcome by its probability, EU = Σ pᵢu(xᵢ). Σ pᵢxᵢ is EV and u(EV) is the utility of the mean.", "opts": ["Σ p<sub>i</sub> u(x<sub>i</sub>)", "Σ p<sub>i</sub> x<sub>i</sub>", "u(EV)", "the utility of the smallest x<sub>i</sub>"], "correct": 0}, {"id": 691, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "easy", "q": "The certainty equivalent CE of a gamble is defined by:", "explain": "The certainty equivalent is the sure amount whose utility equals the gamble's expected utility: u(CE) = EU.", "opts": ["CE=EV", "u(CE)=EV", "u(CE)=EU", "CE=EU"], "correct": 2}, {"id": 692, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "easy", "q": "In plain words, the certainty equivalent is:", "explain": "By definition CE is the guaranteed sum giving the same utility as the gamble, so the agent is indifferent between them.", "opts": ["the sure amount of money that gives exactly as much utility as the gamble", "the worst outcome the gamble can produce", "the average of the two probabilities", "the best outcome the gamble can produce"], "correct": 0}, {"id": 693, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "easy", "q": "The risk premium RP of a gamble is defined as:", "explain": "Risk premium RP = EV − CE, the expected wealth the agent forgoes to shed risk.", "opts": ["CE-EV", "EU-CE", "EV+CE", "EV-CE"], "correct": 3}, {"id": 694, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "easy", "q": "The risk premium is best described as:", "explain": "RP is the expected money sacrificed to avoid the gamble's risk, RP = EV − CE.", "opts": ["the amount of expected money a person is willing to sacrifice to avoid facing the gamble's risk", "the total payoff of the gamble", "the probability of the worst outcome", "the variance of the utility function"], "correct": 0}, {"id": 695, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "A cautious person is offered a coin flip paying 0 or 200 with equal probability, or a sure payment of 100 (exactly the gamble's EV), and takes the sure 100. This choice is consistent with:", "explain": "Choosing the sure 100 over a fair gamble with the same EV reveals a concave utility, i.e. risk aversion.", "opts": ["risk neutrality only", "risk aversion", "risk loving", "a mistake, since 100 is not the best option"], "correct": 1}, {"id": 696, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "An adrenaline-seeking gambler faces the same coin flip (0 or 200, equal probability) and says he values it more than a sure 100. For him:", "explain": "Valuing the fair gamble above its EV of 100 means the certainty equivalent exceeds 100, the signature of risk loving.", "opts": ["EV is below 100", "CE is exactly 100", "CE is above 100", "CE is below 100"], "correct": 2}, {"id": 697, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "A gamble has EV=58 and CE=49. Its risk premium equals:", "explain": "RP = EV − CE = 58 − 49 = 9.", "opts": ["-9", "107", "58", "9"], "correct": 3}, {"id": 698, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "If the risk premium of a gamble is exactly zero, then:", "explain": "RP = EV − CE, so RP = 0 is equivalent to CE = EV (the risk-neutral / no-risk case).", "opts": ["the gamble is unfair", "CE=EV", "the gamble has only one outcome", "EU=0"], "correct": 1}, {"id": 699, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "A two-outcome gamble has EU=7 and utility function u(x)=√(x). The certainty equivalent is:", "explain": "u(CE) = EU with u = √x gives √CE = 7, so CE = 49.", "opts": ["14", "3.5", "49", "7"], "correct": 2}, {"id": 700, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "easy", "q": "A risk-averse person's utility-of-wealth function is:", "explain": "Risk aversion is equivalent to a concave utility-of-wealth function (diminishing marginal utility).", "opts": ["concave", "convex", "linear", "undefined"], "correct": 0}, {"id": 701, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "easy", "q": "A risk-loving person's utility function is:", "explain": "A risk-loving agent has a convex utility of wealth (increasing marginal utility).", "opts": ["concave", "linear", "convex", "constant"], "correct": 2}, {"id": 702, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "easy", "q": "A risk-neutral person's utility function is:", "explain": "Risk neutrality corresponds to a linear utility of wealth; only expected value matters.", "opts": ["convex", "linear", "concave", "discontinuous"], "correct": 1}, {"id": 703, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "easy", "q": "For a risk-averse (concave) decision maker, CE compared to EV satisfies:", "explain": "Concavity gives EU less than u(EV) (Jensen), hence CE less than EV for a risk-averse agent.", "opts": ["CE&lt;EV", "CE&gt;EV", "CE=EV", "no general relation"], "correct": 0}, {"id": 704, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "easy", "q": "For a risk-loving (convex) decision maker:", "explain": "Convexity gives EU greater than u(EV), hence CE greater than EV for a risk-loving agent.", "opts": ["CE=EV", "CE&lt;EV", "CE&gt;EV", "CE=0"], "correct": 2}, {"id": 705, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "easy", "q": "For a risk-neutral (linear) decision maker:", "explain": "Linear utility gives EU = u(EV), so CE = EV and the risk premium is zero.", "opts": ["CE&gt;EV", "CE=EV", "CE&lt;EV", "CE is undefined"], "correct": 1}, {"id": 706, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "easy", "q": "The sign of the risk premium for a risk-averse person is:", "explain": "Risk aversion ⇒ CE less than EV ⇒ RP = EV − CE greater than 0 (positive).", "opts": ["negative", "undefined", "zero", "positive"], "correct": 3}, {"id": 707, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "easy", "q": "The sign of the risk premium for a risk-loving person is:", "explain": "Risk loving ⇒ CE greater than EV ⇒ RP = EV − CE less than 0 (negative).", "opts": ["negative", "positive", "zero", "always equal to EV"], "correct": 0}, {"id": 708, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "Consistent with the exam's Q10, the risk premium of a lottery is negative for a person who is risk:", "explain": "A negative risk premium means CE greater than EV, which characterises a risk-loving agent.", "opts": ["averse", "indifferent", "neutral", "loving"], "correct": 3}, {"id": 709, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "A risk-averse person is indifferent between her certainty equivalent CE and the gamble itself, by definition. It follows that she will strictly prefer a sure payment M over the gamble whenever:", "explain": "She is indifferent between CE and the gamble; since utility is increasing, any sure M above CE is strictly preferred to the gamble.", "opts": ["M is below CE", "M equals EU", "M is above CE", "never, she always prefers the gamble"], "correct": 2}, {"id": 710, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "hard", "q": "A risk-loving person faces a fair coin flip between 2 and 8 (equal probabilities), utility u(x)=x<sup>2</sup>. Then EV=5 and CE≈5.83, so her risk premium is approximately:", "explain": "EU = 0.5·2² + 0.5·8² = 34, CE = √34 ≈ 5.83, so RP = EV − CE = 5 − 5.83 ≈ −0.83 (negative, risk loving).", "opts": ["5", "34", "0.83", "-0.83"], "correct": 3}, {"id": 711, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "easy", "q": "Jensen's inequality for a concave utility function states:", "explain": "Jensen's inequality for a concave u: EU = E[u(x)] less than u(E[x]) = u(EV).", "opts": ["EU&lt;u(EV)", "EU=u(EV)", "EU&gt;u(EV)", "EU and u(EV) are unrelated"], "correct": 0}, {"id": 712, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "easy", "q": "Jensen's inequality for a convex utility function states:", "explain": "For a convex u, Jensen reverses: EU greater than u(EV).", "opts": ["EU=u(EV)", "EU&lt;u(EV)", "EU is undefined", "EU&gt;u(EV)"], "correct": 3}, {"id": 713, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "easy", "q": "For a linear utility function, Jensen's inequality collapses to:", "explain": "For a linear u, Jensen holds with equality: EU = u(EV).", "opts": ["EU&gt;u(EV)", "EU=u(EV), an equality", "EU&lt;u(EV)", "no relation can be established"], "correct": 1}, {"id": 714, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "Facing an actuarially fair insurance premium, a risk-averse person will:", "explain": "At an actuarially fair premium a risk-averse agent buys full insurance, equalising wealth across states (optimum on the 45° certainty line).", "opts": ["buy insurance only against the good state", "remain indifferent to any level of coverage", "buy full insurance, equalizing wealth across states", "buy no insurance at all"], "correct": 2}, {"id": 715, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "easy", "q": "“Actuarially fair” premium means the company charges a premium equal to:", "explain": "An actuarially fair premium equals the expected value of the loss covered, so the insurer's expected profit is zero.", "opts": ["the expected value of the loss it covers", "the maximum possible loss", "zero", "twice the expected loss"], "correct": 0}, {"id": 716, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "A risk-averse person fully insures at a fair premium because full insurance:", "explain": "Fair full insurance removes all risk at zero expected cost, which a concave (risk-averse) utility strictly values.", "opts": ["is required by law", "removes all uncertainty at no cost in expected terms, which a concave utility values", "maximizes the variance of wealth", "increases expected wealth above the fair value"], "correct": 1}, {"id": 717, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "A risk-averse investor is offered an actuarially fair gamble, one whose expected gain is exactly zero. She should:", "explain": "A risk-averse agent attaches a positive risk premium even to a fair gamble (EV = 0), so its certainty equivalent is negative and she declines.", "opts": ["accept it, since a fair gamble has EV=0 by construction", "accept it only if EU is positive", "decline it, since even a fair gamble carries a positive risk premium for her", "be unable to decide without more information"], "correct": 2}, {"id": 718, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "Two friends flip a coin: win 50 or lose 50, equal probability, so EV=0. For a strictly risk-averse friend, the certainty equivalent of this bet is:", "explain": "Strict risk aversion gives CE less than EV = 0, so the certainty equivalent is strictly negative.", "opts": ["strictly greater than 0", "exactly 50", "exactly 0", "strictly less than 0"], "correct": 3}, {"id": 719, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "The other, strictly risk-loving friend faces the identical coin flip (EV=0). Her certainty equivalent is:", "explain": "Strict risk loving gives CE greater than EV = 0, so the certainty equivalent is strictly positive.", "opts": ["strictly negative", "exactly 0", "strictly positive", "undefined, since EV is zero"], "correct": 2}, {"id": 720, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "Both types share utility u(x)=√(x) and face a coin flip between wealth 16 and 100 (equal probabilities), giving EV=58, EU=7, CE=49. The risk premium equals:", "explain": "EV = 58, EU = 0.5·4 + 0.5·10 = 7, CE = 7² = 49, so RP = 58 − 49 = 9.", "opts": ["49", "-9", "107", "9"], "correct": 3}, {"id": 721, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "easy", "q": "A lottery pays 300 with probability 0.2 and 50 with probability 0.8. Its expected value EV is:", "explain": "EV = 0.2·300 + 0.8·50 = 60 + 40 = 100 (probability-weighted, not the plain average 175).", "opts": ["100", "250", "175", "300"], "correct": 0}, {"id": 722, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "easy", "q": "A coin flip pays 400 on heads and 100 on tails, each with probability 0.5. The expected value is:", "explain": "EV = 0.5·400 + 0.5·100 = 250.", "opts": ["250", "500", "150", "200"], "correct": 0}, {"id": 723, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "A gamble pays 0 with probability 0.5, 100 with probability 0.3, and 200 with probability 0.2. Its expected value is:", "explain": "EV = 0.5·0 + 0.3·100 + 0.2·200 = 0 + 30 + 40 = 70.", "opts": ["70", "100", "150", "60"], "correct": 0}, {"id": 724, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "Bruno the dog plays a treat game: with probability 1/3 he wins 6 biscuits, otherwise 3 biscuits. His expected number of biscuits is:", "explain": "EV = (1/3)·6 + (2/3)·3 = 2 + 2 = 4.", "opts": ["4", "4.5", "5", "3"], "correct": 0}, {"id": 725, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "An investor with u(w) = √w faces equal chances of wealth 100 or 400. Her expected utility EU is:", "explain": "EU = 0.5·√100 + 0.5·√400 = 0.5·10 + 0.5·20 = 15 (below u(EV) = √250 ≈ 15.81, so she is risk averse).", "opts": ["15", "√250", "250", "17.5"], "correct": 0}, {"id": 726, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "With u(w) = √w and equal chances of wealth 100 or 400 (so EU = 15), the certainty equivalent CE is:", "explain": "u(CE) = EU: √CE = 15, so CE = 225 (below EV = 250).", "opts": ["225", "250", "15", "200"], "correct": 0}, {"id": 727, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "hard", "q": "With u(w) = √w and equal chances of wealth 100 or 400, the risk premium RP is:", "explain": "EV = 250, CE = 15² = 225, so RP = EV − CE = 250 − 225 = 25.", "opts": ["25", "15", "0", "-25"], "correct": 0}, {"id": 728, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "A person with u(w) = √w faces equal chances of wealth 100 or 900. Expected utility EU equals:", "explain": "EU = 0.5·√100 + 0.5·√900 = 0.5·10 + 0.5·30 = 20.", "opts": ["20", "√500", "30", "25"], "correct": 0}, {"id": 729, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "With u(w) = √w and equal chances of wealth 100 or 900 (EU = 20), the certainty equivalent is:", "explain": "√CE = 20, so CE = 400 (below EV = 500).", "opts": ["400", "500", "20", "450"], "correct": 0}, {"id": 730, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "hard", "q": "With u(w) = √w and equal chances of wealth 100 or 900, the risk premium is:", "explain": "EV = 500, CE = 400, so RP = 500 − 400 = 100.", "opts": ["100", "0", "-100", "50"], "correct": 0}, {"id": 731, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "A decision maker with u(w) = √w faces equal chances of wealth 25 or 225. The certainty equivalent is:", "explain": "EU = 0.5·5 + 0.5·15 = 10, so CE = 10² = 100 (below EV = 125).", "opts": ["100", "125", "10", "112.5"], "correct": 0}, {"id": 732, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "hard", "q": "With u(w) = √w and equal chances of wealth 25 or 225, the risk premium equals:", "explain": "EV = 125, CE = 100, so RP = 125 − 100 = 25.", "opts": ["25", "0", "-25", "12.5"], "correct": 0}, {"id": 733, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "With u(w) = √w and equal chances of wealth 16 or 64, expected utility is:", "explain": "EU = 0.5·√16 + 0.5·√64 = 0.5·4 + 0.5·8 = 6.", "opts": ["6", "√40", "8", "5"], "correct": 0}, {"id": 734, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "hard", "q": "With u(w) = √w and equal chances of wealth 16 or 64, the risk premium equals:", "explain": "EV = 40, CE = 6² = 36, so RP = 40 − 36 = 4.", "opts": ["4", "0", "-4", "2"], "correct": 0}, {"id": 735, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "hard", "q": "A person with u(w) = √w gets wealth 100 with probability 0.25 and 400 with probability 0.75. Expected utility is:", "explain": "EU = 0.25·10 + 0.75·20 = 2.5 + 15 = 17.5.", "opts": ["17.5", "15", "20", "18.75"], "correct": 0}, {"id": 736, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "hard", "q": "With u(w) = √w, wealth 100 with probability 0.25 and 400 with probability 0.75 (EU = 17.5), the certainty equivalent is:", "explain": "√CE = 17.5, so CE = 17.5² = 306.25 (below EV = 325).", "opts": ["306.25", "325", "17.5", "300"], "correct": 0}, {"id": 737, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "hard", "q": "A risk-loving agent with u(w) = w² faces equal chances of wealth 10 or 20. The certainty equivalent (to two decimals) is about:", "explain": "EU = 0.5·100 + 0.5·400 = 250, so CE = √250 ≈ 15.81, which exceeds EV = 15 (risk loving).", "opts": ["15.81", "15", "250", "14.14"], "correct": 0}, {"id": 738, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "hard", "q": "For the same risk-loving agent u(w) = w² with equal chances of 10 or 20 (EV = 15, CE ≈ 15.81), the risk premium is approximately:", "explain": "RP = EV − CE = 15 − 15.81 ≈ −0.81; a risk-loving agent has a negative risk premium.", "opts": ["-0.81", "0.81", "0", "-15"], "correct": 0}, {"id": 739, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "A risk-neutral agent with u(w) = 2w faces equal chances of wealth 100 or 300. Her risk premium is:", "explain": "Linear utility gives CE = EV = 200, so RP = 0.", "opts": ["0", "100", "-100", "200"], "correct": 0}, {"id": 740, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "With u(w) = √w and equal chances of wealth 100 or 400, compare EU = 15 with u(EV) = √250 ≈ 15.81. Which holds?", "explain": "Jensen's inequality for a concave u gives EU less than u(EV): 15 less than 15.81.", "opts": ["EU is less than u(EV)", "EU equals u(EV)", "EU is greater than u(EV)", "EU is unrelated to u(EV)"], "correct": 0}, {"id": 741, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "A homeowner has wealth 100. With probability 0.5 a loss of 84 occurs, leaving 16. Utility is u(w) = √w. The actuarially fair premium for full insurance is:", "explain": "A fair premium equals the expected loss: 0.5·84 = 42.", "opts": ["42", "84", "58", "51"], "correct": 0}, {"id": 742, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "A homeowner has wealth 100. With probability 0.5 a loss of 84 occurs, leaving 16. Utility is u(w) = √w. The expected utility of remaining uninsured is:", "explain": "EU = 0.5·√16 + 0.5·√100 = 0.5·4 + 0.5·10 = 7.", "opts": ["7", "√58", "10", "8.5"], "correct": 0}, {"id": 743, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "A homeowner has wealth 100. With probability 0.5 a loss of 84 occurs, leaving 16. Utility is u(w) = √w. The certainty equivalent of the uninsured position is:", "explain": "√CE = EU = 7, so CE = 49.", "opts": ["49", "58", "42", "51"], "correct": 0}, {"id": 744, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "hard", "q": "A homeowner has wealth 100. With probability 0.5 a loss of 84 occurs, leaving 16. Utility is u(w) = √w. The most she would pay for full insurance (her maximum willingness to pay) is:", "explain": "Max WTP = starting wealth − CE = 100 − 49 = 51 (she buys as long as √(100 − premium) ≥ 7).", "opts": ["51", "42", "49", "9"], "correct": 0}, {"id": 745, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "hard", "q": "A homeowner has wealth 100. With probability 0.5 a loss of 84 occurs, leaving 16. Utility is u(w) = √w. The risk premium (EV minus CE) equals:", "explain": "EV = 0.5·16 + 0.5·100 = 58, CE = 49, so RP = 58 − 49 = 9.", "opts": ["9", "51", "42", "-9"], "correct": 0}, {"id": 746, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "hard", "q": "A homeowner has wealth 100. With probability 0.5 a loss of 84 occurs, leaving 16. Utility is u(w) = √w. If she buys full insurance at the actuarially fair premium, her certain wealth in every state becomes:", "explain": "Certain wealth = starting wealth − fair premium = 100 − 42 = 58, which equals EV (full insurance equalises wealth across states).", "opts": ["58", "49", "100", "16"], "correct": 0}, {"id": 747, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "Willy Wonka's chocolate factory is worth 100,000,000. With probability 0.01 a fire causes a loss of 64,000,000 (leaving 36,000,000). His utility of wealth is u(w) = √w. His expected wealth EV is:", "explain": "EV = 0.99·100,000,000 + 0.01·36,000,000 = 99,000,000 + 360,000 = 99,360,000.", "opts": ["99,360,000", "100,000,000", "99,201,600", "36,000,000"], "correct": 0}, {"id": 748, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "Willy Wonka's chocolate factory is worth 100,000,000. With probability 0.01 a fire causes a loss of 64,000,000 (leaving 36,000,000). His utility of wealth is u(w) = √w. His expected utility EU is:", "explain": "EU = 0.99·√100,000,000 + 0.01·√36,000,000 = 0.99·10000 + 0.01·6000 = 9900 + 60 = 9960.", "opts": ["9960", "10000", "9974", "6000"], "correct": 0}, {"id": 749, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "hard", "q": "Willy Wonka's chocolate factory is worth 100,000,000. With probability 0.01 a fire causes a loss of 64,000,000 (leaving 36,000,000). His utility of wealth is u(w) = √w. His certainty equivalent CE is:", "explain": "u(CE) = EU: √CE = 9960, so CE = 9960² = 99,201,600.", "opts": ["99,201,600", "99,360,000", "100,000,000", "9960"], "correct": 0}, {"id": 750, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "hard", "q": "Willy Wonka's chocolate factory is worth 100,000,000. With probability 0.01 a fire causes a loss of 64,000,000 (leaving 36,000,000). His utility of wealth is u(w) = √w. His risk premium RP is:", "explain": "RP = EV − CE = 99,360,000 − 99,201,600 = 158,400.", "opts": ["158,400", "640,000", "798,400", "99,201,600"], "correct": 0}, {"id": 751, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "Willy Wonka's chocolate factory is worth 100,000,000. With probability 0.01 a fire causes a loss of 64,000,000 (leaving 36,000,000). His utility of wealth is u(w) = √w. The actuarially fair premium for full fire insurance is:", "explain": "Fair premium = expected loss = 0.01·64,000,000 = 640,000.", "opts": ["640,000", "158,400", "798,400", "64,000,000"], "correct": 0}, {"id": 752, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "hard", "q": "Willy Wonka's chocolate factory is worth 100,000,000. With probability 0.01 a fire causes a loss of 64,000,000 (leaving 36,000,000). His utility of wealth is u(w) = √w. The most he would pay for full insurance (maximum willingness to pay) is:", "explain": "Max WTP = 100,000,000 − CE = 100,000,000 − 99,201,600 = 798,400.", "opts": ["798,400", "640,000", "158,400", "100,000,000"], "correct": 0}, {"id": 753, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "hard", "q": "Willy Wonka's chocolate factory is worth 100,000,000. With probability 0.01 a fire causes a loss of 64,000,000 (leaving 36,000,000). His utility of wealth is u(w) = √w. Buying full insurance at the fair premium leaves his certain wealth at:", "explain": "Certain wealth = 100,000,000 − 640,000 = 99,360,000, equal to EV.", "opts": ["99,360,000", "99,201,600", "100,000,000", "640,000"], "correct": 0}, {"id": 754, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "easy", "q": "Actuarially fair full insurance is attractive to a risk-averse agent mainly because it:", "explain": "At a fair premium expected wealth is unchanged, but risk is removed; a concave utility values the smoothing across states.", "opts": ["equalizes wealth across all states of the world at no expected cost", "raises expected wealth above its uninsured level", "increases the variance of wealth", "is cheaper than the expected loss"], "correct": 0}, {"id": 755, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "If an insurer charges more than the actuarially fair premium (a loaded premium), a risk-averse agent will typically:", "explain": "Full insurance is optimal only at a fair premium; a positive loading makes the last units of coverage not worth their price, so the agent under-insures.", "opts": ["buy less than full insurance", "buy full insurance regardless", "buy no insurance and always self-insure", "over-insure beyond the loss"], "correct": 0}, {"id": 756, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "Two gambles have the same expected value, but gamble B is a mean-preserving spread of gamble A (B is riskier). A risk-averse person will:", "explain": "A concave utility dislikes a mean-preserving increase in spread, so the risk-averse agent prefers the less risky gamble A.", "opts": ["prefer gamble A, the less risky one", "prefer gamble B, the riskier one", "be indifferent because the EVs are equal", "prefer whichever has the higher maximum payoff"], "correct": 0}, {"id": 757, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "For a strictly risk-averse agent, the certainty equivalent of a nondegenerate gamble satisfies:", "explain": "Strict concavity gives EU less than u(EV), hence CE strictly below EV (positive risk premium).", "opts": ["CE is strictly below EV", "CE equals EV", "CE is strictly above EV", "CE equals the best outcome"], "correct": 0}, {"id": 758, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "Holding the expected value fixed, increasing the spread (riskiness) of a gamble faced by a risk-averse agent will:", "explain": "For a concave utility more spread lowers the certainty equivalent while EV is fixed, so RP = EV − CE grows.", "opts": ["increase the risk premium", "decrease the risk premium", "leave the risk premium at zero", "make the risk premium negative"], "correct": 0}, {"id": 759, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "easy", "q": "The certainty equivalent of receiving a sure amount of 80 (no risk at all) is:", "explain": "With no risk the gamble is degenerate: CE equals the sure amount 80 for any risk attitude, and RP = 0.", "opts": ["80", "0", "40", "depends on risk attitude"], "correct": 0}, {"id": 760, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "An agent must choose between gamble A (certainty equivalent 120) and gamble B (certainty equivalent 110). A utility-maximizer will:", "explain": "Ranking gambles by certainty equivalent is equivalent to ranking by expected utility, so the higher CE (gamble A) is preferred.", "opts": ["choose gamble A", "choose gamble B", "be indifferent", "need the variances to decide"], "correct": 0}, {"id": 761, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "med", "q": "With u(w) = √w, gamble A gives equal chances of 64 or 144, while option B pays a sure 90. Which is preferred?", "explain": "Gamble A: EU = 0.5·8 + 0.5·12 = 10, so CE = 100, which exceeds the sure 90; gamble A is preferred.", "opts": ["gamble A, its certainty equivalent is 100", "option B, the sure 90", "indifferent, both give utility 10", "cannot tell without more probabilities"], "correct": 0}, {"id": 762, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "easy", "q": "A person whose utility of wealth is u(w) = ln(w) is:", "explain": "ln(w) is a concave function, so the agent is risk averse.", "opts": ["risk-averse, because ln is concave", "risk-loving, because ln is convex", "risk-neutral, because ln is linear", "impossible to classify"], "correct": 0}, {"id": 763, "topic": "Q10", "topicName": "Risk & uncertainty", "type": "mc", "difficulty": "hard", "q": "In the homeowner example (wealth 100, loss 84 with probability 0.5, u(w) = √w), the maximum willingness to pay for full insurance (51) exceeds the actuarially fair premium (42) by exactly:", "explain": "Max WTP − fair premium = 51 − 42 = 9 = the risk premium; a risk-averse agent pays the fair premium plus RP to shed the risk.", "opts": ["the risk premium, 9", "the expected loss, 42", "zero", "the full loss, 84"], "correct": 0}, {"id": 764, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "easy", "q": "The present-value form of the intertemporal budget line is:", "explain": "The intertemporal budget in present-value form is c₁ + c₂/(1+r) = m₁ + m₂/(1+r).", "opts": ["c<sub>1</sub>(1+r) - c<sub>2</sub> = m<sub>1</sub>(1+r) - m<sub>2</sub>", "c<sub>1</sub> - c<sub>2</sub>/(1+r) = m<sub>1</sub> - m<sub>2</sub>/(1+r)", "c<sub>1</sub> + c<sub>2</sub>/(1+r) = m<sub>1</sub> + m<sub>2</sub>/(1+r)", "c<sub>1</sub>/(1+r) + c<sub>2</sub> = m<sub>1</sub>/(1+r) + m<sub>2</sub>"], "correct": 2}, {"id": 765, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "easy", "q": "The intertemporal budget line always passes through:", "explain": "The consumer can always afford exactly her endowment, so the budget line passes through (m₁,m₂).", "opts": ["the endowment point (m<sub>1</sub>,m<sub>2</sub>)", "the origin (0,0)", "the point of tangency with the indifference curve", "the midpoint of the PV and FV intercepts"], "correct": 0}, {"id": 766, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "easy", "q": "With c<sub>1</sub> on the horizontal axis and c<sub>2</sub> on the vertical axis, the slope of the budget line is:", "explain": "Rearranging gives c₂ = (m₁ + m₂/(1+r) − c₁)(1+r); with c₁ horizontal and c₂ vertical the slope is −(1+r).", "opts": ["-1/(1+r)", "-r", "1+r", "-(1+r)"], "correct": 3}, {"id": 767, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "easy", "q": "The relative price of one extra unit of future consumption, measured in present consumption given up, equals:", "explain": "One extra unit of future consumption costs 1/(1+r) units of present consumption given up.", "opts": ["1+r", "1/(1+r)", "r", "1-r"], "correct": 1}, {"id": 768, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "med", "q": "If r rises, the relative price of future consumption:", "explain": "The price of future consumption is 1/(1+r); as r rises it falls.", "opts": ["rises", "stays the same", "falls", "becomes negative"], "correct": 2}, {"id": 769, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "easy", "q": "The present value of the endowment, PV, equals:", "explain": "Present value of the endowment is m₁ + m₂/(1+r).", "opts": ["m<sub>1</sub> + m<sub>2</sub>/(1+r)", "m<sub>1</sub>(1+r) + m<sub>2</sub>", "m<sub>1</sub> - m<sub>2</sub>/(1+r)", "(m<sub>1</sub>+m<sub>2</sub>)/(1+r)"], "correct": 0}, {"id": 770, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "easy", "q": "The future value of the endowment, FV, equals:", "explain": "Future value of the endowment is m₁(1+r) + m₂.", "opts": ["m<sub>1</sub> + m<sub>2</sub>/(1+r)", "m<sub>1</sub>(1+r) + m<sub>2</sub>", "m<sub>1</sub>(1+r) + m<sub>2</sub>(1+r)", "m<sub>1</sub>+m<sub>2</sub>"], "correct": 1}, {"id": 771, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "easy", "q": "On a graph with c<sub>1</sub> horizontal and c<sub>2</sub> vertical, PV is the intercept on the:", "explain": "Setting c₂ = 0 gives c₁ = PV, so PV is the horizontal (c₁) intercept.", "opts": ["c<sub>2</sub> axis", "neither axis, it is the endowment", "the origin", "c<sub>1</sub> axis"], "correct": 3}, {"id": 772, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "easy", "q": "With m<sub>1</sub>=60, m<sub>2</sub>=60 and r=0.5, the present value PV equals:", "explain": "PV = 60 + 60/1.5 = 60 + 40 = 100.", "opts": ["100", "90", "120", "150"], "correct": 0}, {"id": 773, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "easy", "q": "With the same numbers (m<sub>1</sub>=60, m<sub>2</sub>=60, r=0.5), the future value FV equals:", "explain": "FV = 60·1.5 + 60 = 90 + 60 = 150.", "opts": ["100", "120", "150", "180"], "correct": 2}, {"id": 774, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "easy", "q": "A consumer who chooses c<sub>1</sub>&lt;m<sub>1</sub> is called a:", "explain": "Consuming less than income today (c₁ less than m₁) means saving; the agent is a saver/lender.", "opts": ["borrower", "saver (lender)", "speculator", "endowment-constrained agent"], "correct": 1}, {"id": 775, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "med", "q": "In the language of the buying-and-selling (endowment) model, a saver is a net:", "explain": "A saver gives up present consumption to obtain future consumption, i.e. is a net seller of present consumption.", "opts": ["buyer of future consumption only", "buyer of present consumption", "buyer of both goods", "seller of present consumption"], "correct": 3}, {"id": 776, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "easy", "q": "A borrower is defined by:", "explain": "A borrower consumes more than current income today: c₁ greater than m₁.", "opts": ["c<sub>1</sub> &gt; m<sub>1</sub>", "c<sub>1</sub> &lt; m<sub>1</sub>", "c<sub>2</sub> &gt; m<sub>2</sub>", "c<sub>1</sub> = m<sub>1</sub>"], "correct": 0}, {"id": 777, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "med", "q": "On the same budget line, a borrower's future consumption compared with her endowment satisfies:", "explain": "Extra present consumption financed by borrowing must be repaid, so a borrower has c₂ less than m₂.", "opts": ["c<sub>2</sub> &gt; m<sub>2</sub>", "c<sub>2</sub> = m<sub>2</sub>", "c<sub>2</sub> &lt; m<sub>2</sub>", "c<sub>2</sub> is unrelated to m<sub>2</sub>"], "correct": 2}, {"id": 778, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "med", "q": "When the interest rate r rises, a saver's future consumption c<sub>2</sub>:", "explain": "For a saver a higher r makes saving more rewarding and (income effect) makes her richer, so c₂ rises unambiguously.", "opts": ["rises", "falls", "is unaffected", "becomes negative"], "correct": 0}, {"id": 779, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "hard", "q": "When r rises, a saver's present consumption c<sub>1</sub>:", "explain": "The substitution effect lowers c₁ (future is cheaper) while the income effect raises it (the lender is richer); the net effect on c₁ is ambiguous.", "opts": ["definitely rises", "definitely falls", "stays exactly the same", "is ambiguous (substitution and income effects oppose)"], "correct": 3}, {"id": 780, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "med", "q": "The substitution effect of a rise in r on a saver's c<sub>1</sub> pushes c<sub>1</sub>:", "explain": "The substitution effect of a higher r makes future consumption relatively cheaper, pushing c₁ down.", "opts": ["up, because saving becomes more rewarding", "down, because future consumption is now relatively cheaper", "up, because present consumption is cheaper", "in no particular direction"], "correct": 1}, {"id": 781, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "med", "q": "The income effect of a rise in r on a saver's c<sub>1</sub> pushes c<sub>1</sub>:", "explain": "A higher return makes a lender richer; with c₁ a normal good the income effect pushes c₁ up.", "opts": ["up, because a lender is richer when the return to lending rises", "down, because she is poorer", "up, because prices did not change", "down, because future consumption is now a luxury"], "correct": 0}, {"id": 782, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "med", "q": "When r rises, a saver is:", "explain": "A saver sells present consumption; a higher r is a better price for what she sells, so she is better off.", "opts": ["worse off, she pays more for loans", "unaffected, since she does not borrow", "better off, she sells present consumption at a better rate", "worse off, because c<sub>1</sub> might fall"], "correct": 2}, {"id": 783, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "med", "q": "When r rises, a borrower is:", "explain": "A borrower buys present consumption; a higher r raises its price, so he is worse off.", "opts": ["better off, loans are cheaper", "worse off, she repays at a higher rate", "unaffected, since she only cares about c<sub>1</sub>", "better off if and only if she is impatient"], "correct": 1}, {"id": 784, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "easy", "q": "The net present value (NPV) of a project is calculated as:", "explain": "NPV = discounted sum of future payoffs minus the initial cost.", "opts": ["the sum of future payoffs without discounting", "the sum of discounted future payoffs minus the initial cost", "the initial cost minus the sum of discounted payoffs", "the initial cost multiplied by (1+r)"], "correct": 1}, {"id": 785, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "easy", "q": "A project is worth undertaking when:", "explain": "Undertake a project when its NPV is positive.", "opts": ["NPV&lt;0", "NPV=cost", "the interest rate is zero", "NPV&gt;0"], "correct": 3}, {"id": 786, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "easy", "q": "A payoff of 121 received two years from now, discounted at r=10 % per year, has a present value of:", "explain": "PV = 121/1.1² = 121/1.21 = 100.", "opts": ["100", "121", "110", "90"], "correct": 0}, {"id": 787, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "med", "q": "A project costs 200 today and pays 231 one year from now; at r=10 %, its NPV is closest to:", "explain": "NPV = −200 + 231/1.1 = −200 + 210 = 10.", "opts": ["31", "-10", "10", "0"], "correct": 2}, {"id": 788, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "med", "q": "If the nominal interest rate is 8 % and inflation is 3 %, the approximate real interest rate is:", "explain": "The approximation is real ≈ nominal − inflation = 8% − 3% = 5%.", "opts": ["11 %", "3 %", "8 %", "5 %"], "correct": 3}, {"id": 789, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "easy", "q": "The exact Fisher relationship between real and nominal rates is:", "explain": "The exact Fisher relation is 1 + real = (1 + nominal)/(1 + inflation), i.e. 1+r = (1+real)(1+π).", "opts": ["r<sub>real</sub> = r<sub>nominal</sub>× inflation", "1+r<sub>real</sub> = (1+r<sub>nominal</sub>)/(1+inflation)", "1+r<sub>nominal</sub> = (1+r<sub>real</sub>)/(1+inflation)", "r<sub>real</sub> = r<sub>nominal</sub> + inflation"], "correct": 1}, {"id": 790, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "easy", "q": "If prices and your nominal income both rise at exactly the same rate, your real purchasing power:", "explain": "If nominal income and prices rise at the same rate, real purchasing power is unchanged.", "opts": ["rises", "falls", "stays the same", "doubles"], "correct": 2}, {"id": 791, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "easy", "q": "An amount of 100 saved today at r=0.5 for one period grows to a future value of:", "explain": "FV = 100·(1 + 0.5) = 150.", "opts": ["150", "100", "110", "130"], "correct": 0}, {"id": 792, "topic": "Q11", "topicName": "Intertemporal choice", "type": "num", "difficulty": "med", "q": "Perry: project pays 150 in year 2 and 150 in year 3, costs 200 now (year 1). r=10%. Net Present Value? [−200+150/1.1+150/1.1²]", "explain": "NPV = −200 + 150/1.1 + 150/1.1² ≈ −200 + 136.36 + 123.97 ≈ 60.", "answer": 60, "display": "60"}, {"id": 793, "topic": "Q11", "topicName": "Intertemporal choice", "type": "num", "difficulty": "hard", "q": "Melissa: m1=400, m2=550, u=c1<sup>0.6</sup>c2<sup>0.4</sup>, r=10%. Consumption in period 2? [Cobb-Douglas share of future value]", "explain": "Cobb-Douglas: future value of the endowment = 400·1.1 + 550 = 990; the c₂ expenditure share is 0.4, so c₂ = 0.4·990 = 396.", "answer": 396, "display": "396"}, {"id": 794, "topic": "Q11", "topicName": "Intertemporal choice", "type": "num", "difficulty": "med", "q": "Laurie: 7000 now and 8000 next period. Future value of her endowment at r=5%? [7000·1.05+8000]", "explain": "FV = 7000·1.05 + 8000 = 7350 + 8000 = 15350.", "answer": 15350, "display": "15350"}, {"id": 795, "topic": "Q11", "topicName": "Intertemporal choice", "type": "reveal", "difficulty": "med", "q": "Two consumers, same incomes (m1,m2), same rate r, well-behaved prefs; one borrows, one lends. In their optima:", "explain": "At interior optima both consumers set |MRS| = 1 + r, the common price ratio, so their marginal rates of substitution coincide.", "a": "The absolute value of MRS is the same for both (both equal 1+r at an interior optimum)."}, {"id": 796, "topic": "Q11", "topicName": "Intertemporal choice", "type": "num", "difficulty": "hard", "q": "Peter: m1=400, m2=440, u=c1c2. Borrowing rate 10%, saving rate 5%. His borrowing/saving (value of c1−m1)? [kink: he stays put]", "explain": "At the endowment |MRS| = m₂/m₁ = 440/400 = 1.1. The saving rate gives 1.05 and the borrowing rate 1.10; since 1.05 ≤ 1.1 ≤ 1.10 he neither borrows nor lends, so c₁ − m₁ = 0.", "answer": 0, "display": "0"}, {"id": 797, "topic": "Q11", "topicName": "Intertemporal choice", "type": "reveal", "difficulty": "med", "q": "Lilly is a borrower; the interest rate falls. Then:", "explain": "A borrower whose rate falls can still afford her old bundle; present consumption is now cheaper (both effects raise c₁), so c₁ rises for sure while c₂ is ambiguous.", "a": "She can still afford her old (c1,c2) and consumes more in period 1 for sure; period 2 may go either way."}, {"id": 798, "topic": "Q11", "topicName": "Intertemporal choice", "type": "reveal", "difficulty": "hard", "q": "Diana: was a borrower (c01&gt;m1, c02&lt;m2); r rises and she becomes a saver (c11&lt;m1, c12&gt;m2). Then:", "explain": "Switching from borrower to saver as r rises means her old bundle is no longer affordable and neither bundle is revealed preferred to the other, so the welfare change is indeterminate without her preferences.", "a": "We cannot say whether she is better or worse off without knowing her utility function."}, {"id": 799, "topic": "Q11", "topicName": "Intertemporal choice", "type": "num", "difficulty": "hard", "q": "Lucy: income m each period, r=10%, inflation 5%, 30% tax on interest income (deductible if borrowing). Slope of the budget line for c1&lt;m (saving/lending)? [after-tax real terms]", "explain": "With c1 less than m the consumer saves, so interest income is taxed at 30%: the after-tax nominal rate is 0.10·(1−0.30)=0.07 and the real slope is (1.07)/(1.05) ≈ 1.02. (Here the borrowing rate is the same after deductibility, so there is no kink.)", "answer": 1.02, "display": "1.02"}, {"id": 800, "topic": "Q11", "topicName": "Intertemporal choice", "type": "num", "difficulty": "med", "q": "Nominal interest rate 37.5%, real interest rate 10%. By how many % did the price level rise? [(1.375/1.10)−1]", "explain": "Exact Fisher: 1 + π = 1.375/1.10 = 1.25, so prices rose 25%.", "answer": 25, "display": "25"}, {"id": 801, "topic": "Q11", "topicName": "Intertemporal choice", "type": "reveal", "difficulty": "med", "q": "Consumption is a normal good, borrow/lend at r. Which is correct?", "explain": "If the future value of the endowment rises and both goods are normal, consumption rises in both periods.", "a": "If the FUTURE value of the endowment rises, the consumer raises consumption in BOTH periods."}, {"id": 802, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "easy", "q": "A payment of 220 arrives one year from now. At an interest rate r = 10%, its present value is:", "explain": "PV = 220/1.1 = 200.", "opts": ["200", "220", "242", "198"], "correct": 0}, {"id": 803, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "med", "q": "A payment of 133.10 arrives three years from now. At r = 10% (so 1.1³ = 1.331), its present value is:", "explain": "PV = 133.10/1.1³ = 133.10/1.331 = 100.", "opts": ["100", "133.10", "121", "110"], "correct": 0}, {"id": 804, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "easy", "q": "1000 is saved today at r = 5% for one period. Its future value is:", "explain": "FV = 1000·1.05 = 1050.", "opts": ["1050", "1005", "950", "1100"], "correct": 0}, {"id": 805, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "easy", "q": "500 is invested today at r = 20% for one period. Its future value is:", "explain": "FV = 500·1.2 = 600.", "opts": ["600", "520", "540", "700"], "correct": 0}, {"id": 806, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "med", "q": "A project pays 100 at the end of year 1 and 100 at the end of year 2. At r = 10%, its present value (to two decimals) is about:", "explain": "PV = 100/1.1 + 100/1.1² = 90.91 + 82.64 = 173.55.", "opts": ["173.55", "190.00", "200.00", "181.82"], "correct": 0}, {"id": 807, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "med", "q": "200 is deposited today and left for two periods at r = 10% per period. Its future value is:", "explain": "FV = 200·1.1² = 200·1.21 = 242.", "opts": ["242", "240", "220", "262"], "correct": 0}, {"id": 808, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "hard", "q": "A project costs 1000 today and pays 600 at the end of year 1 and 600 at the end of year 2. At r = 20%, its NPV (to two decimals) is:", "explain": "NPV = −1000 + 600/1.2 + 600/1.44 = −1000 + 500 + 416.67 = −83.33, so reject.", "opts": ["-83.33", "200.00", "83.33", "-100.00"], "correct": 0}, {"id": 809, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "med", "q": "A project costs 500 and pays 550 one year later. At r = 10%, its net present value is:", "explain": "NPV = −500 + 550/1.1 = −500 + 500 = 0; the investor is just indifferent.", "opts": ["0", "50", "-50", "5"], "correct": 0}, {"id": 810, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "hard", "q": "A project costs 800 today and pays 1000 at the end of year 2 (nothing in year 1). At r = 25% (1.25² = 1.5625), its NPV is:", "explain": "NPV = −800 + 1000/1.5625 = −800 + 640 = −160, so reject.", "opts": ["-160", "200", "160", "-40"], "correct": 0}, {"id": 811, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "hard", "q": "A project costs 100 and pays 60 at the end of year 1 and 60 at the end of year 2. At r = 20%, its NPV (to two decimals) is:", "explain": "NPV = −100 + 60/1.2 + 60/1.44 = −100 + 50 + 41.67 = −8.33.", "opts": ["-8.33", "20.00", "8.33", "-10.00"], "correct": 0}, {"id": 812, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "med", "q": "Four mutually exclusive projects have net present values of −20, 0, 15, and −5. A value-maximizing firm should choose the one with NPV equal to:", "explain": "Choose the project with the highest positive NPV, here 15.", "opts": ["15", "0", "-5", "-20"], "correct": 0}, {"id": 813, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "hard", "q": "A project costs 1000 and pays 660 at the end of year 1 and 484 at the end of year 2. At r = 10%, its NPV is:", "explain": "NPV = −1000 + 660/1.1 + 484/1.21 = −1000 + 600 + 400 = 0.", "opts": ["0", "144", "-144", "44"], "correct": 0}, {"id": 814, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "med", "q": "The nominal interest rate is 21% and inflation is 10%. Using the exact Fisher relation, the real interest rate is:", "explain": "Exact Fisher: 1 + real = 1.21/1.10 = 1.10, so real = 10% (the additive approximation 21 − 10 = 11% is wrong here).", "opts": ["10%", "11%", "9.5%", "31%"], "correct": 0}, {"id": 815, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "hard", "q": "The nominal interest rate is 10% and inflation is 5%. The exact real interest rate (to two decimals) is:", "explain": "Exact Fisher: 1 + real = 1.10/1.05 = 1.047619, so real ≈ 4.76% (not the approximate 5%).", "opts": ["4.76%", "5.00%", "5.50%", "15.00%"], "correct": 0}, {"id": 816, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "med", "q": "The real interest rate is 5% and inflation is 4%. By the exact Fisher relation, the nominal interest rate is:", "explain": "1 + nominal = (1.05)(1.04) = 1.092, so nominal = 9.2% (above the approximate 9%).", "opts": ["9.2%", "9.0%", "1.0%", "20.0%"], "correct": 0}, {"id": 817, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "med", "q": "Inflation is 25% and the nominal interest rate is 37.5%. The exact real interest rate is:", "explain": "1 + real = 1.375/1.25 = 1.10, so real = 10%.", "opts": ["10%", "12.5%", "62.5%", "15%"], "correct": 0}, {"id": 818, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "med", "q": "The real interest rate is 10% and inflation is 10%. The exact nominal interest rate is:", "explain": "1 + nominal = (1.1)(1.1) = 1.21, so nominal = 21% (the approximation 10 + 10 = 20% understates it).", "opts": ["21%", "20%", "10%", "1%"], "correct": 0}, {"id": 819, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "med", "q": "The nominal interest rate equals the inflation rate, both 8%. The exact real interest rate is:", "explain": "1 + real = 1.08/1.08 = 1, so real = 0%.", "opts": ["0%", "8%", "16%", "-8%"], "correct": 0}, {"id": 820, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "hard", "q": "A consumer has m₁ = 300, m₂ = 300 and faces r = 20%, with utility u(c₁,c₂) = c₁^0.5·c₂^0.5. Her optimal second-period consumption c₂ is:", "explain": "PV = 300 + 300/1.2 = 550; the c₂ share is 0.5, so c₂ = 0.5·PV·(1+r) = 0.5·550·1.2 = 330.", "opts": ["330", "275", "300", "360"], "correct": 0}, {"id": 821, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "hard", "q": "With m₁ = 300, m₂ = 300, r = 20% and u(c₁,c₂) = c₁^0.5·c₂^0.5, optimal first-period consumption c₁ is:", "explain": "PV = 300 + 300/1.2 = 550; the c₁ share is 0.5, so c₁ = 0.5·550 = 275.", "opts": ["275", "330", "300", "250"], "correct": 0}, {"id": 822, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "hard", "q": "A consumer with m₁ = 200, m₂ = 440, r = 10% and u(c₁,c₂) = c₁^0.5·c₂^0.5 chooses first-period consumption c₁ equal to:", "explain": "PV = 200 + 440/1.1 = 600; c₁ = 0.5·600 = 300.", "opts": ["300", "330", "250", "200"], "correct": 0}, {"id": 823, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "hard", "q": "A consumer has m₁ = 1000, m₂ = 0, r = 25% and utility u(c₁,c₂) = c₁^0.7·c₂^0.3. Optimal first-period consumption c₁ is:", "explain": "PV = 1000; with Cobb-Douglas the c₁ share is 0.7, so c₁ = 0.7·1000 = 700.", "opts": ["700", "300", "1000", "875"], "correct": 0}, {"id": 824, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "med", "q": "A saver (lender) faces a fall in the interest rate. She is:", "explain": "A saver sells present consumption; a lower r is a worse price for what she sells, so she is worse off when r falls.", "opts": ["worse off, because she lends at a lower return", "better off, because borrowing is cheaper", "unaffected, since she does not borrow", "better off, because future consumption is dearer"], "correct": 0}, {"id": 825, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "med", "q": "A borrower faces a fall in the interest rate. He is:", "explain": "A borrower buys present consumption; a lower r lowers its price, so he is better off when r falls.", "opts": ["better off, because repaying his loan is cheaper", "worse off, because saving earns less", "unaffected, since he does not save", "worse off, because present consumption is dearer"], "correct": 0}, {"id": 826, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "med", "q": "A consumer who is a borrower sees the interest rate rise and remains a borrower. Compared with before, he is:", "explain": "A borrower buys present consumption; a higher r raises its price, so a borrower who stays a borrower is worse off.", "opts": ["worse off", "better off", "exactly as well off", "unable to afford his endowment"], "correct": 0}, {"id": 827, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "hard", "q": "A consumer optimally chooses to consume exactly her endowment (c₁ = m₁, c₂ = m₂). If the interest rate changes, she is:", "explain": "The endowment point lies on the budget line at every r, so it stays affordable; she can do no worse and may find a newly affordable preferred bundle, hence weakly better off.", "opts": ["at least as well off as before, since the endowment stays affordable", "strictly worse off in every case", "strictly better off in every case", "forced to become a borrower"], "correct": 0}, {"id": 828, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "med", "q": "When the interest rate r rises, the present value of a fixed future endowment m₂:", "explain": "PV of the future endowment is m₂/(1+r), which decreases as r rises.", "opts": ["falls", "rises", "is unchanged", "becomes negative"], "correct": 0}, {"id": 829, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "easy", "q": "Your nominal income and all prices both rise by exactly 10%. Your real purchasing power:", "explain": "Real purchasing power is nominal income divided by the price level; if both rise 10% the ratio is unchanged.", "opts": ["is unchanged", "rises by 10%", "falls by 10%", "doubles"], "correct": 0}, {"id": 830, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "med", "q": "Nominal income doubles (rises 100%) while all prices triple (rise 200%). Real purchasing power:", "explain": "Real income scales by 2/3 (≈ 0.667), which is below 1, so purchasing power falls.", "opts": ["falls", "rises", "is unchanged", "doubles"], "correct": 0}, {"id": 831, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "hard", "q": "Nominal income rises 5% and prices rise 2%. The exact change in real income (to two decimals) is about:", "explain": "Real factor = 1.05/1.02 = 1.0294, so real income rises about 2.94% (not the approximate 3%).", "opts": ["+2.94%", "+3.00%", "+7.00%", "-2.94%"], "correct": 0}, {"id": 832, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "med", "q": "A consumer's endowment is m₁ = 100 now and m₂ = 210 next period, with r = 5%. The present value of the endowment is:", "explain": "PV = 100 + 210/1.05 = 100 + 200 = 300.", "opts": ["300", "310", "315", "410"], "correct": 0}, {"id": 833, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "med", "q": "With endowment m₁ = 100, m₂ = 210 and r = 5%, the future value of the endowment is:", "explain": "FV = 100·1.05 + 210 = 105 + 210 = 315.", "opts": ["315", "300", "310", "320"], "correct": 0}, {"id": 834, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "easy", "q": "On a graph with c₁ horizontal and c₂ vertical, the intercept of the budget line on the c₂ axis equals:", "explain": "Setting c₁ = 0 gives c₂ = m₁(1+r) + m₂, the future value of the endowment.", "opts": ["the future value of the endowment, m₁(1+r) + m₂", "the present value of the endowment", "the endowment point", "zero"], "correct": 0}, {"id": 835, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "easy", "q": "With c₁ horizontal and c₂ vertical and r = 25%, the magnitude of the slope of the intertemporal budget line is:", "explain": "The slope is −(1+r) = −1.25, so its magnitude is 1.25.", "opts": ["1.25", "0.25", "0.80", "1.00"], "correct": 0}, {"id": 836, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "med", "q": "Holding the endowment (m₁,m₂) fixed with m₂ greater than 0, an increase in r causes the present value of the endowment to:", "explain": "PV = m₁ + m₂/(1+r); raising r shrinks the discounted future term, so PV falls.", "opts": ["fall", "rise", "stay the same", "become negative"], "correct": 0}, {"id": 837, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "med", "q": "In the two-period model, the price of one unit of present consumption c₁ measured in units of future consumption c₂ given up is:", "explain": "Giving up one unit of c₁ today and saving it yields (1+r) units of c₂, so the relative price of present consumption is 1+r.", "opts": ["1+r", "1/(1+r)", "r", "1"], "correct": 0}, {"id": 838, "topic": "Q11", "topicName": "Intertemporal choice", "type": "mc", "difficulty": "med", "q": "A student earns nothing this year and 11000 next year, and can borrow at r = 10%. The most she can consume this year by borrowing against next year's income is:", "explain": "Maximum c₁ is the present value of the endowment: 0 + 11000/1.1 = 10000.", "opts": ["10000", "11000", "12100", "9900"], "correct": 0}, {"id": 839, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "easy", "q": "The problem `max u(x) s.t. p· x=m' is:", "explain": "Maximising utility subject to a budget (UMP) yields Marshallian (Walrasian) demand.", "opts": ["utility maximisation, giving Marshallian demand", "expenditure minimisation, giving Hicksian demand", "utility maximisation, giving Hicksian demand", "expenditure minimisation, giving Marshallian demand"], "correct": 0}, {"id": 840, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "easy", "q": "The problem `min p· x s.t. u(x)=u<sub>0</sub>' is expenditure minimisation; it defines:", "explain": "Minimising cost to reach a fixed utility (EMP) yields Hicksian (compensated) demand.", "opts": ["Marshallian demand, holding income fixed", "Hicksian demand, holding utility fixed", "Marshallian demand, holding utility fixed", "Hicksian demand, holding income fixed"], "correct": 1}, {"id": 841, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "easy", "q": "What does the Marshallian (Walrasian) demand x(p,m) hold fixed as price varies?", "explain": "Marshallian demand holds money income m (and other prices) fixed.", "opts": ["the utility level", "the quantity of the other good", "money income m", "the marginal utility of income"], "correct": 2}, {"id": 842, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "easy", "q": "What does the Hicksian (compensated) demand h(p,u) hold fixed as price varies?", "explain": "Hicksian demand holds the utility level u fixed.", "opts": ["money income m", "the bundle itself", "the price of the other good only", "the utility level u"], "correct": 3}, {"id": 843, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "med", "q": "A fall in p<sub>1</sub> traced along the Marshallian demand curve shows:", "explain": "The Marshallian curve embeds both effects, so it traces the total (substitution plus income) effect.", "opts": ["the substitution effect only", "the total effect: substitution plus income", "the income effect only", "nothing, since income is not held fixed"], "correct": 1}, {"id": 844, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "med", "q": "A fall in p<sub>1</sub> traced along the Hicksian demand curve shows:", "explain": "The Hicksian curve holds utility fixed, so it isolates the pure substitution effect.", "opts": ["the pure substitution effect, with the consumer compensated to stay on the same indifference curve", "the total effect", "the pure income effect", "the change in income needed to restore the old bundle"], "correct": 0}, {"id": 845, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "med", "q": "Which demand curve can, in the rare Giffen case, slope upward in its own price?", "explain": "Only Marshallian demand can slope up (the Giffen case); Hicksian demand always slopes down.", "opts": ["Hicksian", "neither; both always slope down", "both, equally often", "Marshallian"], "correct": 3}, {"id": 846, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "easy", "q": "Which demand curve is guaranteed to slope downward in its own price, for any good, with no exceptions?", "explain": "Hicksian demand obeys the compensated law of demand and slopes down for every good.", "opts": ["Marshallian", "Marshallian, but only for an inferior good", "Hicksian", "neither"], "correct": 2}, {"id": 847, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "easy", "q": "Plugging the Marshallian demand x(p,m) back into u(x) gives:", "explain": "Substituting Marshallian demand into utility yields the indirect utility function v(p,m).", "opts": ["the indirect utility function v(p,m)", "the Hicksian demand h(p,u)", "the expenditure function e(p,u)", "the Slutsky equation"], "correct": 0}, {"id": 848, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "easy", "q": "The minimised value of p· x in the expenditure-minimisation problem defines:", "explain": "The minimised cost in the EMP is the expenditure function e(p,u).", "opts": ["the indirect utility function v(p,m)", "the Marshallian demand x(p,m)", "consumer surplus", "the expenditure function e(p,u)"], "correct": 3}, {"id": 849, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "easy", "q": "Roy's identity recovers which function from the indirect utility function v(p,m)?", "explain": "Roy's identity recovers Marshallian demand from v(p,m).", "opts": ["Hicksian demand", "the expenditure function", "the Slutsky term", "Marshallian demand"], "correct": 3}, {"id": 850, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "easy", "q": "Roy's identity states that x<sub>i</sub>(p,m) equals:", "explain": "Roy's identity: x_i = −(∂v/∂p_i)/(∂v/∂m).", "opts": ["-(∂ v/∂ p<sub>i</sub>)/(∂ v/∂ m)", "(∂ v/∂ p<sub>i</sub>)/(∂ v/∂ m), with no minus sign", "∂ e/∂ p<sub>i</sub>", "the ratio of two Hicksian demands"], "correct": 0}, {"id": 851, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "easy", "q": "Shephard's lemma recovers which function from the expenditure function e(p,u)?", "explain": "Shephard's lemma recovers Hicksian demand from e(p,u).", "opts": ["Marshallian demand", "Hicksian demand", "indirect utility", "money income"], "correct": 1}, {"id": 852, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "easy", "q": "Shephard's lemma states that h<sub>i</sub>(p,u) equals:", "explain": "Shephard's lemma: h_i = ∂e/∂p_i.", "opts": ["-(∂ v/∂ p<sub>i</sub>)/(∂ v/∂ m)", "∂ e/∂ u", "∂ e/∂ p<sub>i</sub>", "p<sub>i</sub>· x<sub>i</sub>"], "correct": 2}, {"id": 853, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "med", "q": "Roy's identity carries a minus sign because:", "explain": "v decreases in price and increases in income, so the raw ratio is negative; the minus sign makes demand positive.", "opts": ["v falls when a price rises but rises when income rises, so the bare ratio would be negative", "e(p,u) is concave", "it is a pure convention with no economic meaning", "Hicksian demand is always negative"], "correct": 0}, {"id": 854, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "easy", "q": "Compared with Roy's identity, Shephard's lemma is simpler to apply because it needs:", "explain": "Shephard's lemma needs a single price-derivative of e, with no ratio and no minus sign.", "opts": ["two derivatives of e and a ratio, just like Roy", "integrating the demand function first", "knowledge of money income m", "just one derivative of e, with no ratio and no minus sign"], "correct": 3}, {"id": 855, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "easy", "q": "The identity e(p,v(p,m))= ____ \\ says that reaching the utility your income m already buys costs exactly:", "explain": "e(p, v(p,m)) = m: reaching the utility your income m already buys costs exactly m.", "opts": ["the expenditure function itself", "m", "v(p,m)", "zero"], "correct": 1}, {"id": 856, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "easy", "q": "The identity v(p,e(p,u))= ____ \\ says that maximising utility with just enough income to reach u gets you back to:", "explain": "v(p, e(p,u)) = u: maximising utility with just enough income to reach u returns u.", "opts": ["u", "m", "e(p,u)", "x(p,m)"], "correct": 0}, {"id": 857, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "med", "q": "Which identity turns Hicksian demand into Marshallian demand?", "explain": "x(p,m) = h(p, v(p,m)) evaluates Hicksian demand at u = v(p,m) to give Marshallian demand.", "opts": ["h(p,u)=x(p,e(p,u))", "v(p,m)=e(p,u)", "x(p,m)=h(p,m)", "x(p,m)=h(p,v(p,m))"], "correct": 3}, {"id": 858, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "med", "q": "Which identity turns Marshallian demand into Hicksian demand?", "explain": "h(p,u) = x(p, e(p,u)) evaluates Marshallian demand at m = e(p,u) to give Hicksian demand.", "opts": ["x(p,m)=h(p,v(p,m))", "h(p,u)=x(p,u)", "h(p,u)=x(p,e(p,u))", "v(p,e(p,u))=u"], "correct": 2}, {"id": 859, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "med", "q": "The Slutsky equation writes the total price effect ∂ x<sub>i</sub>/∂ p<sub>j</sub> as:", "explain": "Slutsky: ∂x_i/∂p_j = ∂h_i/∂p_j − x_j·(∂x_i/∂m), the substitution term minus an income term.", "opts": ["the substitution effect minus x<sub>j</sub> times the income-derivative of Marshallian demand", "the income effect minus the substitution effect", "the substitution effect plus the income effect, always with the same sign", "just the substitution effect, since income is irrelevant"], "correct": 0}, {"id": 860, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "med", "q": "In the Slutsky equation, the term -x<sub>j</sub>·(∂ x<sub>i</sub>/∂ m) is called:", "explain": "The term −x_j·(∂x_i/∂m) is the income term of the Slutsky equation.", "opts": ["the substitution term", "the pure price effect", "the expenditure function", "the income term"], "correct": 3}, {"id": 861, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "easy", "q": "The expenditure function e(p,u), as a function of prices p, is:", "explain": "The expenditure function is concave in prices.", "opts": ["convex", "concave", "quasiconvex only", "decreasing"], "correct": 1}, {"id": 862, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "med", "q": "The indirect utility function v(p,m), as a function of prices p, is:", "explain": "The indirect utility function is quasiconvex in prices.", "opts": ["increasing", "concave", "quasiconvex", "homogeneous of degree one"], "correct": 2}, {"id": 863, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "easy", "q": "e(p,u) is increasing in u and homogeneous of which degree in prices p?", "explain": "e(p,u) is increasing in u and homogeneous of degree one in prices.", "opts": ["degree zero", "degree two", "it is not homogeneous", "degree one"], "correct": 3}, {"id": 864, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "easy", "q": "v(p,m) is homogeneous of which degree in (p,m) jointly?", "explain": "Scaling all prices and income together leaves choices unchanged, so v is homogeneous of degree zero in (p,m).", "opts": ["degree zero", "degree one", "degree minus one", "it is not homogeneous"], "correct": 0}, {"id": 865, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "med", "q": "A Giffen good requires:", "explain": "A Giffen good is inferior with an income effect strong enough to reverse the always-negative substitution effect.", "opts": ["a positive substitution effect strong enough to reverse the law of demand", "the good to be normal, with a small income effect", "the good to be inferior, with an income effect strong enough to reverse the always-negative substitution effect", "a quasiconvex expenditure function"], "correct": 2}, {"id": 866, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "easy", "q": "As functions of income and prices, v(p,m) is:", "explain": "Indirect utility rises with income and falls with prices.", "opts": ["increasing in m, increasing in prices", "increasing in m, decreasing in prices", "decreasing in m, decreasing in prices", "decreasing in m, increasing in prices"], "correct": 1}, {"id": 867, "topic": "Q12", "topicName": "Duality", "type": "reveal", "difficulty": "med", "q": "Which is TRUE about duality?", "explain": "Evaluating Hicksian demand at u = v(p,m) returns Walrasian (Marshallian) demand: x(p,m) = h(p, v(p,m)).", "a": "Inserting v(p,m) into the Hicksian demand (in place of u) gives the Walrasian demand."}, {"id": 868, "topic": "Q12", "topicName": "Duality", "type": "num", "difficulty": "med", "q": "Laurie has 3 useless CDs (no player). U=x+f(y)z<sup>2</sup>, z=3, f(y)=0 if y&lt;1 else 6. Most she will pay for a CD player? [f jumps 0→6: gain=6·3²=54]", "explain": "Owning the player makes f jump from 0 to 6; with z = 3 CDs the utility gain is 6·z² = 6·9 = 54, her maximum willingness to pay.", "answer": 54, "display": "54"}, {"id": 869, "topic": "Q12", "topicName": "Duality", "type": "reveal", "difficulty": "hard", "q": "Which statement about Equivalent Variation (EV) after a tax increase is true?", "explain": "EV of a tax increase is measured at old prices but the post-change (new) utility, i.e. the amount payable beforehand to avoid the tax.", "a": "EV is the amount the consumer would pay BEFORE the tax to avoid the increase (uses the new, post-change utility as reference)."}, {"id": 870, "topic": "Q12", "topicName": "Duality", "type": "num", "difficulty": "med", "q": "Claire: quasilinear, inverse demand p=24−4x, currently buys 5 units. Consumer surplus? [½·base·height, choke price 24, but at x=5 p=4 … area of triangle above price to demand]", "explain": "With inverse demand p = 24 − 4x, at x = 5 the price is 4; consumer surplus is the triangle ½·(24 − 4)·5 = 50.", "answer": 50, "display": "50"}, {"id": 871, "topic": "Q12", "topicName": "Duality", "type": "num", "difficulty": "hard", "q": "Tom: U=3x+2y, budget 300, px=10, buys only x. A club lets him buy y at 5 instead of (implied) more. Max he'd pay to join? [gain from the discount]", "explain": "Originally only x is bought (u = 90). At the club price py = 5 he switches to y; paying fee F, 2·(300 − F)/5 = 90 gives F = 75.", "answer": 75, "display": "75"}, {"id": 872, "topic": "Q12", "topicName": "Duality", "type": "reveal", "difficulty": "hard", "q": "Well-behaved prefs, price of x doubles. Which is FALSE?", "explain": "By concavity of e(p,u) in price, doubling px raises the cost of the old utility, but by less than double (the consumer substitutes away), so the doubling claim is false.", "a": "'To be as well off as before, he must always pay at least twice as much.' [he must pay more, but not necessarily double.]"}, {"id": 873, "topic": "Q12", "topicName": "Duality", "type": "num", "difficulty": "hard", "q": "u=10x−x²+y, m=100, px=4, py=1. Utility gain from getting access to the market for x? [optimal x where 10−2x=4 ⇒ x=3, net gain]", "explain": "Optimal x solves 10 − 2x = 4, giving x = 3; the surplus from access is the integral of (10 − 2x − 4) from 0 to 3, equal to 9.", "answer": 9, "display": "9"}, {"id": 874, "topic": "Q12", "topicName": "Duality", "type": "reveal", "difficulty": "hard", "q": "Consumer surplus computed under the WALRASIAN demand, where richer people buy LESS of x (inferior). If price rises, the calculated CS loss is:", "explain": "For an inferior good the Walrasian demand lies above the compensated (Hicksian) one after a price rise, so the Walrasian consumer-surplus loss overstates the true welfare loss.", "a": "Greater than the real loss to consumers."}, {"id": 875, "topic": "Q12", "topicName": "Duality", "type": "reveal", "difficulty": "hard", "q": "Walrasian demand for x is steeper than the Hicksian (price vertical). Then:", "explain": "A Walrasian curve steeper than the Hicksian signals an inferior good whose income effect opposes the substitution effect, so several of the listed statements hold.", "a": "More of these are correct — x is inferior and the income effect opposes the substitution effect."}, {"id": 876, "topic": "Q12", "topicName": "Duality", "type": "num", "difficulty": "hard", "q": "Bill: U=min(x,y), income 200, px=py=4. Moving raises py to 6 (px=4), no raise. Max wage cut under which he still won't move? [EV of the move]", "explain": "The move raises py to 6, cutting utility from 25 to 20; the equivalent variation, 200 − e((4,4),20) = 200 − 20·8 = 40, is the maximum pay cut he would accept.", "answer": 40, "display": "40"}, {"id": 877, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "med", "q": "u = √(x·y), m = 100, px = 2, py = 8. Indirect utility is v = m/(2·√(px·py)). Its value is:", "explain": "v = 100/(2·√(2·8)) = 100/(2·4) = 12.5.", "opts": ["12.5", "25", "6.25", "50"], "correct": 0}, {"id": 878, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "med", "q": "u = √(x·y): Marshallian demand is x(p,m) = m/(2·px). At m = 100, px = 2 this equals:", "explain": "x = m/(2px) = 100/4 = 25.", "opts": ["25", "12.5", "50", "20"], "correct": 0}, {"id": 879, "topic": "Q12", "topicName": "Duality", "type": "mc", "difficulty": "hard", "q": "For v = m/(2·√(px·py)), apply Roy's identity x = −(∂v/∂px)/(∂v/∂m) and evaluate at m = 120, px = 3, py = 3. The result is:", "explain": "Roy's identity returns x = m/(2px); at m = 120, px = 3 this is 20, matching the di
