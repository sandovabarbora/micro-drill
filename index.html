 effect is:", "explain": "IE = total − SE = 1 − (−2) = +3; a positive income effect large enough to make x Giffen.", "opts": ["+3", "−3", "−1", "+1"], "correct": 0}, {"id": 347, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "med", "q": "For good x a price rise gives substitution effect −5 and income effect −5 (normal), total −10. If instead the good were inferior with income effect +5, the total effect would become:", "explain": "Total = SE + IE = −5 + 5 = 0: the opposing income effect exactly cancels the substitution effect.", "opts": ["0", "−10", "−5", "+5"], "correct": 0}, {"id": 348, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "hard", "q": "For x to be Giffen after a price rise with a substitution effect of −4, and the total effect turning out to be +2, the income effect must be:", "explain": "IE = total − SE = 2 − (−4) = +6: the income effect must more than offset the substitution effect.", "opts": ["+6", "−6", "+2", "−2"], "correct": 0}, {"id": 349, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "hard", "q": "u = x^(1/3)·y^(2/3), m = 90, py = 2, and px rises from 1 to 3. Marshallian x = m/(3·px). The TOTAL effect on x is:", "explain": "x = m/(3px): x falls from 90/3 = 30 to 90/9 = 10, a total effect of −20.", "opts": ["−20", "−10", "−30", "−15"], "correct": 0}, {"id": 350, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "easy", "q": "The Slutsky equation decomposes the total effect of a price change into:", "explain": "Total effect = substitution effect + income effect; this is the content of the Slutsky decomposition.", "opts": ["the substitution effect plus the income effect", "the substitution effect minus the income effect", "the income effect only", "the substitution effect times the income effect"], "correct": 0}, {"id": 351, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "easy", "q": "A cinema raises its ticket price. Holding your utility fixed (Hicks compensation), the substitution effect alone makes you watch:", "explain": "Cinema is now relatively dearer; with utility fixed the substitution effect shifts you away from cinema toward the cheaper alternative.", "opts": ["fewer cinema films and relatively more streaming", "more cinema films", "exactly the same mix as before", "more of both cinema and streaming"], "correct": 0}, {"id": 352, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "med", "q": "Which (substitution effect, income effect) pair is possible for a NORMAL good whose price has just risen?", "explain": "For a price rise the substitution effect is negative; for a normal good the income effect is also negative, so both are negative.", "opts": ["(−6, −2)", "(−6, +2)", "(+6, −2)", "(+2, −6)"], "correct": 0}, {"id": 353, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "easy", "q": "For a price rise, the substitution effect and income effect point in the SAME direction (both reduce demand) exactly when the good is:", "explain": "For a normal good the income effect reinforces the (negative) substitution effect; inferior and Giffen goods have an opposing income effect.", "opts": ["normal", "inferior", "Giffen", "a perfect complement"], "correct": 0}, {"id": 354, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "easy", "q": "The income effect points OPPOSITE to the substitution effect precisely when the good is:", "explain": "Inferior goods (Giffen is a special inferior case) have an income effect that opposes the substitution effect; normal goods reinforce it.", "opts": ["inferior (Giffen included)", "normal", "a luxury", "a perfect substitute"], "correct": 0}, {"id": 355, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "hard", "q": "For a price RISE of a Giffen good, fill in: the substitution effect is ___ and the income effect is ___, with the income effect winning.", "explain": "The own substitution effect is always negative for a price rise; a Giffen good's positive (inferior) income effect outweighs it, so demand rises.", "opts": ["negative; positive", "positive; negative", "negative; negative", "positive; positive"], "correct": 0}, {"id": 356, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "hard", "q": "Bruno's cheap kibble is inferior (but not Giffen) and its price falls. The substitution effect raises his kibble; the income effect ___, and since kibble is inferior but not Giffen he ends up eating ___ kibble.", "explain": "A price fall raises real income and, for an inferior good, lowers kibble (opposing income effect); but the substitution effect dominates, so net kibble rises.", "opts": ["lowers it; more", "raises it; less", "lowers it; less", "raises it; more"], "correct": 0}, {"id": 357, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "easy", "q": "Compensated (Hicksian) demand is what you get when, at every price, income is adjusted to keep constant:", "explain": "Hicksian (compensated) demand holds utility fixed while prices vary; that is the defining feature of the substitution effect.", "opts": ["the utility level", "the bundle itself", "nominal income", "the price ratio"], "correct": 0}, {"id": 358, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "med", "q": "A uniform 30% rise in ALL prices, with utility held fixed, changes the Hicksian (compensated) bundle by:", "explain": "Hicksian demand is homogeneous of degree zero in prices: scaling all prices with utility fixed leaves the cost-minimizing bundle unchanged.", "opts": ["nothing; Hicksian demand is homogeneous of degree zero in prices", "raising every quantity by 30%", "lowering every quantity by 30%", "an amount that cannot be signed"], "correct": 0}, {"id": 359, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "hard", "q": "Two students compute the substitution effect of the same price fall, one via Slutsky and one via Hicks. They are guaranteed to agree on the ___ but generally not on the exact ___.", "explain": "Slutsky and Hicks substitution effects always share the same sign (opposite the price change) but generally differ in magnitude for a finite price change.", "opts": ["sign; magnitude", "magnitude; sign", "income effect; sign", "nothing; everything"], "correct": 0}, {"id": 360, "topic": "Q4", "topicName": "Substitution effect (Slutsky/Hicks)", "type": "mc", "difficulty": "med", "q": "A hockey rink cuts its hourly fee. Holding an athlete's fitness (utility) fixed, the substitution effect shifts training time toward hockey because it is now relatively cheaper. This shift is:", "explain": "The own substitution effect never opposes a price fall, so with utility fixed the cheaper activity (hockey) weakly gains time.", "opts": ["always toward hockey (the own substitution effect is non-negative for a price fall)", "ambiguous in direction", "always away from hockey", "zero unless the two activities are perfect substitutes"], "correct": 0}, {"id": 361, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "easy", "q": "Convex preferences mean the consumer values:", "explain": "Convex preferences mean the consumer values balance at least as much as extremes (averages ≽ extremes).", "opts": ["extremes most", "balance at least as much as extremes", "only good 1", "corners"], "correct": 1}, {"id": 362, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "easy", "q": "“Averages at least as good as extremes” defines:", "explain": "'Averages at least as good as extremes' is the definition of convex preferences.", "opts": ["convexity", "monotonicity", "transitivity", "completeness"], "correct": 0}, {"id": 363, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "easy", "q": "The MRS measures:", "explain": "The MRS is the amount of good 2 the consumer gives up for one more unit of good 1 at constant utility — the (absolute) slope of the indifference curve.", "opts": ["the price ratio", "total utility", "how much x₂ you give up for one more x₁", "income"], "correct": 2}, {"id": 364, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "easy", "q": "Diminishing MRS: as x₁ rises you give up ____ x₂ per extra x₁:", "explain": "Diminishing MRS: as x₁ rises the consumer gives up less and less x₂ per extra x₁.", "opts": ["more and more", "less and less", "the same", "all of it"], "correct": 1}, {"id": 365, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "med", "q": "A diminishing MRS from left to right is a consequence of strict:", "explain": "A diminishing MRS (from left to right) is a consequence of strict convexity.", "opts": ["monotonicity", "convexity", "concavity", "continuity"], "correct": 1}, {"id": 366, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "med", "q": "A and B equally good, preferences strictly convex; the midpoint M is:", "explain": "Strict convexity: if A and B are equally good and distinct, the midpoint M is strictly preferred to both.", "opts": ["strictly better than both", "worse than both", "equally good", "undefined"], "correct": 0}, {"id": 367, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "easy", "q": "Convexity is about the ____ of indifference curves:", "explain": "Convexity is a statement about the curvature (bowing) of indifference curves.", "opts": ["direction", "height", "curvature", "length"], "correct": 2}, {"id": 368, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "easy", "q": "Convex indifference curves bow:", "explain": "Convex indifference curves bow toward the origin.", "opts": ["away from the origin", "toward the origin", "into straight lines only", "upward"], "correct": 1}, {"id": 369, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "med", "q": "With very little x₁ and lots of x₂, your MRS (willingness to give up x₂ for x₁) is:", "explain": "With very little x₁ and lots of x₂, x₁ is scarce and valuable, so the consumer will give up a lot of x₂ for it — a large MRS.", "opts": ["small", "zero", "large", "negative"], "correct": 2}, {"id": 370, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "med", "q": "Moving down-right along a convex curve, the slope gets:", "explain": "Moving down-right along a convex curve, diminishing MRS makes the slope flatter.", "opts": ["steeper", "flatter", "vertical", "unchanged"], "correct": 1}, {"id": 371, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "med", "q": "Perfect substitutes (straight-line ICs) are:", "explain": "Perfect substitutes have straight-line indifference curves: weakly convex with a constant MRS (not strictly convex).", "opts": ["strictly convex", "weakly convex, constant MRS", "concave", "non-convex"], "correct": 1}, {"id": 372, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "med", "q": "Perfect complements (L-shaped ICs) are:", "explain": "Perfect complements (L-shaped curves) are weakly convex — the upper-contour set is convex but its boundary has straight arms, so they are not strictly convex.", "opts": ["strictly convex", "concave", "weakly convex", "non-convex"], "correct": 2}, {"id": 373, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "med", "q": "Cobb-Douglas preferences u=xᵃ yᵇ are:", "explain": "Cobb-Douglas u=xᵃyᵇ (a,b greater than 0) is strictly convex: indifference curves bow strictly toward the origin with a strictly diminishing MRS.", "opts": ["strictly convex", "weakly convex only", "concave", "linear"], "correct": 0}, {"id": 374, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "easy", "q": "Which guarantees a STRICTLY diminishing MRS:", "explain": "Only strict convexity guarantees a strictly diminishing MRS; weak convexity allows a constant MRS.", "opts": ["weak convexity", "monotonicity", "strict convexity", "continuity"], "correct": 2}, {"id": 375, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "med", "q": "The exam says “strict” convexity for a diminishing MRS because weak convexity allows the MRS to be:", "explain": "The exam says 'strict' because weak convexity permits a constant MRS (perfect substitutes), which is not strictly diminishing.", "opts": ["increasing", "constant", "negative", "undefined"], "correct": 1}, {"id": 376, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "easy", "q": "The MRS of perfect substitutes is:", "explain": "The MRS of perfect substitutes is constant (straight-line indifference curves).", "opts": ["diminishing", "increasing", "constant", "always 1"], "correct": 2}, {"id": 377, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "easy", "q": "Straight-line indifference curves represent:", "explain": "Straight-line indifference curves represent perfect substitutes.", "opts": ["perfect complements", "perfect substitutes", "Cobb-Douglas", "concave prefs"], "correct": 1}, {"id": 378, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "easy", "q": "Preferences where extremes beat averages are:", "explain": "When extremes are preferred to averages, preferences are concave (non-convex).", "opts": ["strictly convex", "weakly convex", "concave (non-convex)", "monotonic"], "correct": 2}, {"id": 379, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "med", "q": "At the kink of an L-shaped curve, the MRS is:", "explain": "At the kink of an L-shaped (perfect-complement) curve the slope, and hence the MRS, is undefined.", "opts": ["zero", "one", "undefined", "infinite"], "correct": 2}, {"id": 380, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "hard", "q": "Which is convex but NOT strictly convex:", "explain": "Perfect substitutes are convex but NOT strictly convex (straight ICs, constant MRS); Cobb-Douglas forms — including √(xy) and x⁰·⁵y⁰·⁵ — are strictly convex.", "opts": ["Cobb-Douglas", "perfect substitutes", "u=√(xy)", "u=x⁰·⁵y⁰·⁵"], "correct": 1}, {"id": 381, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "easy", "q": "Under convex preferences the set “at least as good as A” is:", "explain": "Convex preferences ⇔ the upper-contour set {at least as good as A} is a convex set.", "opts": ["a convex set", "empty", "a single point", "non-convex"], "correct": 0}, {"id": 382, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "easy", "q": "A non-convex preference shows up as an upper-contour set with:", "explain": "A non-convex preference shows up as an upper-contour set with a dent (an inward notch).", "opts": ["no dents", "a dent", "straight edges", "no boundary"], "correct": 1}, {"id": 383, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "easy", "q": "“More is better” (the direction of improvement) is:", "explain": "'More is better' — the direction of improvement — is monotonicity, not convexity.", "opts": ["convexity", "monotonicity", "concavity", "transitivity"], "correct": 1}, {"id": 384, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "easy", "q": "Convexity is best described as being about:", "explain": "Convexity concerns the curvature of indifference curves (how they bow), not direction, prices or the number of goods.", "opts": ["the direction utility increases", "the curvature of the curves", "the number of goods", "prices"], "correct": 1}, {"id": 385, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "med", "q": "Monotonic preferences:", "explain": "Monotonicity only fixes the direction of improvement; curvature is separate, so monotonic preferences may be convex or concave.", "opts": ["must be convex", "must be concave", "can be convex or concave", "have no MRS"], "correct": 2}, {"id": 386, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "med", "q": "If the chord between two indifferent bundles lies on a HIGHER curve, preferences are:", "explain": "If the chord (average) between two indifferent bundles lies on a higher indifference curve, the average is preferred — convex preferences.", "opts": ["concave", "convex", "linear", "non-monotonic"], "correct": 1}, {"id": 387, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "easy", "q": "Concave (non-convex) preferences make the consumer prefer:", "explain": "Concave (non-convex) preferences make the consumer prefer corners/extremes over averages.", "opts": ["balance", "the average", "corners / extremes", "more x₂ only"], "correct": 2}, {"id": 388, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "med", "q": "Convex preferences correspond to a utility function that is:", "explain": "Convex preferences correspond to a quasiconcave utility function (convex upper-contour sets).", "opts": ["convex", "concave only", "quasiconcave", "linear"], "correct": 2}, {"id": 389, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "hard", "q": "Squaring a quasiconcave utility (a positive monotonic transform) leaves it:", "explain": "Squaring is a strictly increasing transform (for u ≥ 0); quasiconcavity is ordinal, so it is preserved. Verified: (xy)² has the same MRS y/x as xy, hence the same convex indifference map.", "opts": ["quasiconcave", "convex", "linear", "concave"], "correct": 0}, {"id": 390, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "med", "q": "Strictly convex indifference curves:", "explain": "Strictly convex indifference curves have no flat (straight) segments — every mixture of two indifferent bundles is strictly better.", "opts": ["cross each other", "are straight", "never have flat segments", "bow outward"], "correct": 2}, {"id": 391, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "med", "q": "For u=xy, MRS = MUx/MUy =:", "explain": "For u=xy, MUx=y and MUy=x, so MRS = MUx/MUy = y/x.", "opts": ["x/y", "y/x", "xy", "1"], "correct": 1}, {"id": 392, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "med", "q": "For u=xy at (x,y)=(2,8), the MRS (=y/x) is:", "explain": "For u=xy, MRS = y/x; at (2,8) that is 8/2 = 4.", "opts": ["4", "0.25", "16", "1"], "correct": 0}, {"id": 393, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "med", "q": "For u=xy at (x,y)=(8,2), the MRS is:", "explain": "For u=xy, MRS = y/x; at (8,2) that is 2/8 = 0.25.", "opts": ["4", "1", "0.25", "16"], "correct": 2}, {"id": 394, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "med", "q": "Comparing those two, as x rises from 2 to 8 the MRS:", "explain": "MRS = y/x falls from 4 at (2,8) to 0.25 at (8,2): as x rises along the curve the MRS diminishes (convexity).", "opts": ["rises", "falls", "stays constant", "flips sign"], "correct": 1}, {"id": 395, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "med", "q": "For perfect substitutes u=2x+y, the MRS is:", "explain": "For u=2x+y, MRS = MUx/MUy = 2/1 = 2, constant everywhere (perfect substitutes).", "opts": ["2 everywhere", "y/x", "diminishing", "0.5"], "correct": 0}, {"id": 396, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "easy", "q": "A constant MRS tells you the goods are:", "explain": "A constant MRS (straight-line curves) means the goods are perfect substitutes.", "opts": ["perfect complements", "Cobb-Douglas", "perfect substitutes", "concave"], "correct": 2}, {"id": 397, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "easy", "q": "At an interior optimum with convex preferences, MRS equals:", "explain": "At an interior optimum the indifference curve is tangent to the budget line, so MRS = px/py.", "opts": ["1", "the price ratio px/py", "income", "zero"], "correct": 1}, {"id": 398, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "med", "q": "With strictly convex preferences and a straight budget line, the optimum is:", "explain": "Strict convexity ensures the highest reachable indifference curve meets the budget line at exactly one point, so the optimum is unique (a tangency for smooth interior solutions, possibly a corner).", "opts": ["always a corner", "the worst point", "a unique best bundle", "never unique"], "correct": 2}, {"id": 399, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "med", "q": "With concave (non-convex) preferences, the tangency point is:", "explain": "With concave (non-convex) preferences the tangency is the worst point; utility is maximised at a corner.", "opts": ["the best", "the worst; the optimum is a corner", "unique", "undefined"], "correct": 1}, {"id": 400, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "med", "q": "For u=x⁰·⁵y⁰·⁵ at (6,4), |MRS| = y/x =:", "explain": "For u=x⁰·⁵y⁰·⁵, |MRS| = y/x; at (6,4) that is 4/6 = 2/3. (The trap 1.5 is x/y.)", "opts": ["1.5", "1", "0", "2/3"], "correct": 3}, {"id": 401, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "easy", "q": "A utility function is quasiconcave if, for every level k, the set of bundles with u ≥ k is:", "explain": "Quasiconcavity means every upper-contour set {x: u(x) ≥ k} is convex — exactly the condition that preferences are convex (averages at least as good as extremes).", "opts": ["a convex set", "an empty set", "a single point", "a non-convex set"], "correct": 0}, {"id": 402, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "med", "q": "For u = x + y, bundles A = (4,0) and B = (0,4) are indifferent (u = 4). The average (2,2) gives utility:", "explain": "u(2,2) = 4 = u(A) = u(B): the midpoint is exactly as good as the extremes, not strictly better. This is why perfect substitutes are weakly convex but fail strict convexity.", "opts": ["4 — equally good, so preferences are weakly (not strictly) convex", "8 — strictly better", "2 — strictly worse", "0"], "correct": 0}, {"id": 403, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "hard", "q": "With u = x² + y², bundles A = (4,0) and B = (0,4) are indifferent (u = 16). The average (2,2) gives u = 8, so the consumer:", "explain": "u(2,2) = 8 is less than 16: averaging makes this consumer worse off, so extremes beat averages. Preferences are concave (non-convex) and the optimum lies at a corner, not an interior tangency.", "opts": ["prefers the extremes A or B — the optimum is a corner", "prefers the average", "is indifferent between them", "has convex preferences"], "correct": 0}, {"id": 404, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "med", "q": "Strict convexity of preferences guarantees that the utility-maximising bundle on a budget line is:", "explain": "Strictly convex (strictly quasiconcave) preferences make upper-contour sets strictly convex, so the highest attainable indifference curve touches the budget line at exactly one point — the optimum is unique.", "opts": ["unique", "always a corner", "never interior", "non-existent"], "correct": 0}, {"id": 405, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "med", "q": "If a consumer's preferences are concave (averages worse than extremes), the optimal choice is typically:", "explain": "Concave preferences make the tangency a minimum; utility is maximised by going to an extreme, so the optimum is a corner where the consumer spends everything on one good.", "opts": ["a corner solution (all of one good)", "an interior tangency", "undefined", "always a unique interior point"], "correct": 0}, {"id": 406, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "hard", "q": "For u = √(xy), compare the MRS (= y/x) at (1,4) and (4,1), both on the curve u = 2. Moving from (1,4) to (4,1) the MRS goes from:", "explain": "√(xy) has MRS = y/x. At (1,4) it is 4; at (4,1) it is 1/4. As x rises along the indifference curve (√(xy)=2 at both points) the MRS falls from 4 to 1/4 — diminishing MRS, confirming strict convexity.", "opts": ["4 to 1/4 — it diminishes", "1/4 to 4 — it rises", "4 to 4 — constant", "2 to 2 — constant"], "correct": 0}, {"id": 407, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "hard", "q": "Is u = x² + y² quasiconcave (does it represent convex preferences)?", "explain": "The set {(x,y): x²+y² ≥ k} is the region OUTSIDE a circle — a non-convex set — so u is not quasiconcave and preferences are non-convex (extremes beat averages). Being a convex function does not make a utility quasiconcave.", "opts": ["No — its upper-contour sets are the outside of circles, which are non-convex", "Yes — it is a sum of convex functions", "Yes — it is a Cobb-Douglas form", "Yes — its MRS is diminishing"], "correct": 0}, {"id": 408, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "med", "q": "Convexity is what makes the tangency condition MRS = px/py identify a utility MAXIMUM rather than a minimum, because:", "explain": "With convex (bowed-in) indifference curves, at the tangency the whole indifference curve lies on or above the budget line, so no affordable bundle is better — the tangency is a maximum. Without convexity the same tangency could be a minimum.", "opts": ["the indifference curve bows toward the origin, staying on or above its tangent line", "the budget line is straight", "prices are positive", "utility is ordinal"], "correct": 0}, {"id": 409, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "hard", "q": "A strictly increasing transform of a concave utility function is always:", "explain": "Concavity is cardinal and can be destroyed by a monotone transform, but quasiconcavity (convex upper-contour sets) is ordinal and survives any strictly increasing transform. Since a concave function is quasiconcave, its increasing transforms stay quasiconcave.", "opts": ["quasiconcave, though possibly no longer concave", "concave", "convex", "linear"], "correct": 0}, {"id": 410, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "hard", "q": "Why do perfect substitutes u = x + y FAIL strict convexity?", "explain": "Strict convexity requires the mix of two distinct indifferent bundles to be STRICTLY preferred. On a straight-line indifference curve the mix stays on the same line (equally good), so only weak convexity holds: u(4,0)=u(0,4)=4 and u(2,2)=4, not greater.", "opts": ["their ICs are straight lines, so a mix of two indifferent bundles is only equally good, not strictly better", "their curves bow outward", "their MRS is diminishing", "their upper-contour sets are non-convex"], "correct": 0}, {"id": 411, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "med", "q": "Diminishing marginal rate of substitution is equivalent to indifference curves that are:", "explain": "A falling MRS as x rises means the curve flattens moving right — i.e. it bows toward the origin (convex to the origin). Diminishing MRS and convex-to-origin indifference curves are the same property.", "opts": ["convex to the origin", "concave to the origin", "straight lines", "upward sloping"], "correct": 0}, {"id": 412, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "easy", "q": "“Averages are STRICTLY preferred to extremes” is the definition of:", "explain": "Strict convexity: for distinct indifferent bundles A and B, every strict mixture λA+(1−λ)B is strictly preferred to A and B. Weak convexity only requires 'at least as good'.", "opts": ["strict convexity", "weak convexity", "concavity", "monotonicity"], "correct": 0}, {"id": 413, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "hard", "q": "For u = min(x,y), bundles A = (2,4) and B = (2,6) both give u = 2. Their average (2,5) gives u = ___, showing min is convex but NOT strictly convex:", "explain": "min(2,5) = 2 = u(A) = u(B): along the vertical arm of the L, averaging gives no strict gain, so perfect complements are weakly but not strictly convex (the upper-contour set is convex but its boundary has straight segments).", "opts": ["2 — equally good, no strict improvement", "3 — strictly better", "5 — strictly better", "0"], "correct": 0}, {"id": 414, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "med", "q": "A constant MRS (indifference curves are straight lines) tells you preferences are:", "explain": "Straight indifference lines (perfect substitutes) have a constant MRS; the average of two indifferent bundles is only equally good, so preferences are convex in the weak sense but fail strict convexity.", "opts": ["weakly convex but not strictly convex", "strictly convex", "concave", "non-convex"], "correct": 0}, {"id": 415, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "hard", "q": "For u = x^(1/3) y^(2/3), the MRS = MUx/MUy simplifies to:", "explain": "MUx = (1/3)x^(−2/3)y^(2/3) and MUy = (2/3)x^(1/3)y^(−1/3); the ratio is (1/3)/(2/3)·(y/x) = y/(2x). It falls as x rises along a curve, so the MRS diminishes (strictly convex).", "opts": ["y/(2x)", "2y/x", "y/x", "x/(2y)"], "correct": 0}, {"id": 416, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "hard", "q": "With perfect substitutes (weakly convex, straight ICs) and MRS ≠ px/py, the optimum is:", "explain": "Weak convexity does not force an interior solution. If the constant MRS differs from the price ratio, the consumer specialises in whichever good gives more utility per dollar — a corner. Only if MRS = px/py is the whole budget line optimal.", "opts": ["a corner — all income on the good with more utility per dollar", "an interior tangency", "the midpoint of the budget line", "non-existent"], "correct": 0}, {"id": 417, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "med", "q": "You are told u is quasiconcave. What does this imply about the consumer's preferences?", "explain": "Quasiconcave utility ⇔ convex upper-contour sets ⇔ convex preferences (averages at least as good as extremes). It does not by itself imply complements or non-satiation.", "opts": ["they are convex — averages are at least as good as extremes", "they are concave — extremes beat averages", "the goods are perfect complements", "the consumer is non-satiated"], "correct": 0}, {"id": 418, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "hard", "q": "u = xy is quasiconcave. Its strictly increasing transform v = (xy)³ is:", "explain": "v = g(u) with g(t)=t³ strictly increasing (for u ≥ 0), so v represents the same preferences; the MRS of (xy)³ is y/x, identical to u=xy, so the indifference map — and hence quasiconcavity — is unchanged.", "opts": ["still quasiconcave — same indifference curves (MRS = y/x)", "concave", "non-convex", "linear"], "correct": 0}, {"id": 419, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "hard", "q": "Which utility function represents preferences that are NOT convex?", "explain": "u = x²+y² has non-convex upper-contour sets (outside of circles) → concave preferences, extremes preferred. The other three are convex: √(xy) strictly, min(x,y) and x+y weakly. Check: average of (4,0),(0,4) gives 16 but midpoint (2,2) gives only 8.", "opts": ["u = x² + y²", "u = √(xy)", "u = min(x,y)", "u = x + y"], "correct": 0}, {"id": 420, "topic": "Q5", "topicName": "Convexity", "type": "mc", "difficulty": "med", "q": "Bruno the dog is equally happy with (4 treats, 0 belly-rubs) or (0 treats, 4 belly-rubs). If he STRICTLY prefers (2,2) to both, his preferences are:", "explain": "Strictly preferring the average (2,2) to two equally-liked extremes is exactly the definition of strict convexity (a taste for balance/variety).", "opts": ["strictly convex — he likes a balanced mix", "concave — he likes extremes", "perfect substitutes", "non-monotonic"], "correct": 0}, {"id": 421, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "easy", "q": "y is an economic bad, x is a good (x horizontal, y vertical). The indifference curves are:", "explain": "With one good (x) and one bad (y), MUx greater than 0 but MUy less than 0, so holding utility constant x and y must rise together: the indifference curve slopes upward.", "opts": ["downward sloping", "horizontal", "upward sloping", "vertical lines"], "correct": 2}, {"id": 422, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "easy", "q": "Holding utility constant, if the consumer gets more of the bad y, staying equally content requires:", "explain": "More of the bad y lowers utility; to stay on the same indifference curve the consumer must be compensated with more of the good x.", "opts": ["more of the good x", "less of the good x", "the same x", "less of everything"], "correct": 0}, {"id": 423, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "easy", "q": "With one good x and one bad y, moving in the direction “more good, less bad” (down-right) makes utility:", "explain": "Moving down-right means more good x and less bad y — both raise utility, so utility rises.", "opts": ["fall", "stay the same", "become undefined", "rise"], "correct": 3}, {"id": 424, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "easy", "q": "On the same upward-sloping map, the curve further to the lower-right (more x for the same y) represents:", "explain": "For a bad on the vertical axis, at the same y more x is better, so the curve lying further to the lower-right is the higher-utility one.", "opts": ["lower utility", "higher utility", "the same utility", "an infeasible bundle"], "correct": 1}, {"id": 425, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "easy", "q": "If y is a bad, then MU<sub>y</sub>=∂ U/∂ y is:", "explain": "A bad is defined by negative marginal utility: MUy = ∂U/∂y is less than 0.", "opts": ["negative", "positive", "zero", "undefined"], "correct": 0}, {"id": 426, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "med", "q": "A commuter's utility depends on income x (a good) and commute time y (a bad). To keep utility unchanged, an increase in commute time must be met with:", "explain": "Commute time y is a bad (MU less than 0); to hold utility fixed when it rises, income x (a good) must rise — a pay rise.", "opts": ["a pay cut", "shorter working hours only", "no change in pay", "a pay rise"], "correct": 3}, {"id": 427, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "easy", "q": "Bruno gets treats (x, a good) and baths (y, a bad). One more bath, to keep Bruno equally content, requires:", "explain": "Baths are a bad for Bruno, so one more bath must be offset by more treats (the good) to keep him equally content.", "opts": ["fewer treats", "more treats", "the same treats", "no treats at all"], "correct": 1}, {"id": 428, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "easy", "q": "In the treats-and-baths diagram (treats horizontal, baths vertical), Bruno's indifference curves slope:", "explain": "Treats good and baths bad give an upward-sloping (positive-slope) indifference curve, like any good/bad pair.", "opts": ["down", "horizontally", "up", "vertically"], "correct": 2}, {"id": 429, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "easy", "q": "For an ordinary good x<sub>2</sub> (not a bad), more x<sub>2</sub> holding x<sub>1</sub> fixed makes utility:", "explain": "An ordinary good has positive marginal utility, so more of it (holding the other fixed) raises utility.", "opts": ["fall", "stay the same", "depend on the price", "rise"], "correct": 3}, {"id": 430, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "easy", "q": "On the mock exam Q6 diagram (y an economic bad, vertical; x horizontal), the curves are upward sloping, and moving right (more x, same y) makes utility:", "explain": "With the bad y on the vertical axis and the good x horizontal, curves slope upward and moving right (more x) increases utility.", "opts": ["increase", "decrease", "stay the same", "become negative"], "correct": 0}, {"id": 431, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "easy", "q": "Two ordinary goods x and y: the indifference curves slope:", "explain": "Two ordinary goods give the standard downward-sloping (negatively sloped) indifference curves.", "opts": ["upward", "downward", "vertically", "horizontally"], "correct": 1}, {"id": 432, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "easy", "q": "With two ordinary goods, the direction of increasing utility points:", "explain": "With two goods, utility rises as you move away from the origin (up and to the right — more of both).", "opts": ["toward the origin", "down-right", "away from the origin, up-right", "straight up"], "correct": 2}, {"id": 433, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "easy", "q": "x is a good and y is a bad (x horizontal, y vertical). The direction of increasing utility points:", "explain": "x good and y bad: utility rises with more x and less y, i.e. toward the lower-right (down-right).", "opts": ["down-right", "up-right", "up-left", "toward the origin"], "correct": 0}, {"id": 434, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "easy", "q": "Two economic bads x and y (say, noise and pollution). The indifference curves slope:", "explain": "Two bads (noise, pollution) have MUx and MUy both less than 0, and the indifference curves slope downward.", "opts": ["upward", "vertically", "horizontally", "downward"], "correct": 3}, {"id": 435, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "easy", "q": "With two bads, better bundles lie:", "explain": "With two bads, less of both is better, so preferred bundles lie down and to the left, toward the origin.", "opts": ["down and to the left, toward the origin", "up and to the right", "up and to the left only", "anywhere on the same curve"], "correct": 0}, {"id": 436, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "med", "q": "A student cares about study hours x (a bad, it is tiring) and grade y (a good), x horizontal, y vertical. The indifference curves slope:", "explain": "Study hours x is a bad (MUx less than 0), grade y a good (MUy greater than 0); slope dy/dx = −MUx/MUy is positive — upward sloping.", "opts": ["downward", "upward", "vertically", "horizontally"], "correct": 1}, {"id": 437, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "med", "q": "In the same setup (study hours x, a bad, horizontal; grade y, a good, vertical), the better bundles lie:", "explain": "Better means less study (less x) and a higher grade (more y): up and to the left.", "opts": ["down and to the right", "down and to the left", "up and to the right", "up and to the left (less study, higher grade)"], "correct": 3}, {"id": 438, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "med", "q": "Which case has indifference curves sloping downward AND improvement toward the origin:", "explain": "Downward-sloping curves with improvement toward the origin is the two-bads case.", "opts": ["two goods", "one good, one bad", "two bads", "none of these"], "correct": 2}, {"id": 439, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "med", "q": "Which case has indifference curves sloping downward AND improvement away from the origin:", "explain": "Downward-sloping curves with improvement away from the origin is the standard two-goods case.", "opts": ["two bads", "two goods", "one good, one bad", "this is impossible"], "correct": 1}, {"id": 440, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "med", "q": "A firm faces pollution fines x and cleanup delays y, both of which are bads. This is the case:", "explain": "Fines and delays are both bads → two-bads case: curves slope downward and welfare improves toward the origin.", "opts": ["two goods, better away from the origin", "one good, one bad, curves slope up", "two goods, curves slope up", "two bads, better toward the origin"], "correct": 3}, {"id": 441, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "med", "q": "With x a good and y a bad, MU<sub>x</sub>&gt;0 and MU<sub>y</sub>&lt;0. The slope of the indifference curve, dy/dx=-MU<sub>x</sub>/MU<sub>y</sub>, is:", "explain": "Slope dy/dx = −MUx/MUy = −(positive)/(negative) = positive, so the indifference curve slopes upward.", "opts": ["positive", "negative", "zero", "undefined"], "correct": 0}, {"id": 442, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "med", "q": "If MU<sub>x</sub> and MU<sub>y</sub> have the same sign (both goods, or both bads), the slope -MU<sub>x</sub>/MU<sub>y</sub> is:", "explain": "If MUx and MUy share a sign (both goods or both bads), −MUx/MUy is negative: the curve slopes downward.", "opts": ["positive", "undefined", "negative", "zero"], "correct": 2}, {"id": 443, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "med", "q": "If exactly one of MU<sub>x</sub>,MU<sub>y</sub> is negative (one good, one bad), the ratio MU<sub>x</sub>/MU<sub>y</sub> is:", "explain": "If exactly one marginal utility is negative, MUx/MUy is negative (a positive divided by a negative, or vice versa).", "opts": ["positive", "zero", "undefined", "negative"], "correct": 3}, {"id": 444, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "med", "q": "When y is a bad, a negative value of MU<sub>x</sub>/MU<sub>y</sub> signals that the indifference curve, with x horizontal and y vertical, is:", "explain": "A negative MUx/MUy makes the slope −MUx/MUy positive, so with y a bad the curve slopes upward.", "opts": ["downward sloping", "upward sloping", "horizontal", "a vertical line"], "correct": 1}, {"id": 445, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "med", "q": "The relabelling trick for a bad y defines a new variable z equal to:", "explain": "Relabel the bad as its absence: z = M − y (for M large enough), which turns the bad into a good.", "opts": ["y itself", "x+y", "MU<sub>y</sub>", "the absence of the bad, e.g.\\ z=M-y for a large enough M"], "correct": 3}, {"id": 446, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "med", "q": "After relabelling y (a bad) as z= absence of y (a good), the indifference curve in (x,z) becomes:", "explain": "In (x, z) with z = M − y a good, the map reverts to the standard downward-sloping shape.", "opts": ["downward sloping, the standard shape", "unchanged, exactly the same curve", "vertical", "still upward sloping"], "correct": 0}, {"id": 447, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "med", "q": "Example: cleanliness z=10-dirt y, where dirt is a bad. After relabelling, a higher z means:", "explain": "z = 10 − dirt: a higher z means less dirt, and since dirt is a bad, less dirt raises utility.", "opts": ["more dirt, and utility rises", "more dirt, and utility falls", "less dirt, and utility rises", "no change in dirt"], "correct": 2}, {"id": 448, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "easy", "q": "Scenario: a factory's management utility depends on output x and noise complaints y; more complaints cost management its bonus. Here y is:", "explain": "Noise complaints reduce the manager's bonus (utility), so y has negative marginal utility — a bad.", "opts": ["a good", "a bad", "irrelevant to utility", "the numeraire"], "correct": 1}, {"id": 449, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "easy", "q": "Scenario: a runner's happiness depends on race medals x (a good) and recovery days needed y (unwelcome, a bad). With x horizontal and y vertical, the indifference curves are:", "explain": "Medals good and recovery days a bad give upward-sloping indifference curves.", "opts": ["downward sloping", "horizontal", "vertical", "upward sloping"], "correct": 3}, {"id": 450, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "easy", "q": "In the runner scenario, moving down-right (more medals, fewer recovery days) makes the runner:", "explain": "More medals and fewer recovery days both help, so moving down-right makes the runner happier.", "opts": ["happier", "less happy", "equally happy always", "unable to compare"], "correct": 0}, {"id": 451, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "med", "q": "A consumer has u(x, y) = x − y², where x is a good. Evaluated at any y greater than 0, the marginal utility MUy = ∂u/∂y is:", "explain": "MUy = ∂u/∂y = −2y is less than 0 for y greater than 0. Negative marginal utility is exactly the definition of an economic bad.", "opts": ["negative, so y is a bad", "positive, so y is a good", "zero", "undefined"], "correct": 0}, {"id": 452, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "med", "q": "For u(x, y) = 2√x − y (x a good, y a bad), the indifference-curve slope dy/dx = −MUx/MUy at x = 4 is:", "explain": "MUx = 1/√x and MUy = −1, so dy/dx = −MUx/MUy = −(1/√x)/(−1) = 1/√x. At x = 4 this is 1/2, greater than 0 — the curve slopes upward because y is a bad.", "opts": ["+1/2 (upward sloping)", "−1/2 (downward sloping)", "−2 (downward sloping)", "0 (flat)"], "correct": 0}, {"id": 453, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "med", "q": "For u(x, y) = 3x − 2y (x a good, y a bad), the marginal rate of substitution MRS = MUx/MUy is:", "explain": "MUx = 3 and MUy = −2, so MRS = MUx/MUy = 3/(−2) = −3/2. A negative MRS is the signature of a good paired with a bad; the curve's slope −MRS = 3/2 is positive (upward).", "opts": ["−3/2 (negative)", "+3/2 (positive)", "+2/3", "−2/3"], "correct": 0}, {"id": 454, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "hard", "q": "Pollution y is a bad in u(x, y) = x − y. Define clean air z = M − y (M a large constant). The marginal utility of z, MUz = ∂u/∂z, is:", "explain": "Substituting y = M − z gives u = x − (M − z) = x + z − M, so MUz = ∂u/∂z = +1, greater than 0. Relabelling the bad as its absence turns it into an ordinary good with positive marginal utility.", "opts": ["+1, so z is a good", "−1, so z is a bad", "0", "M"], "correct": 0}, {"id": 455, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "hard", "q": "A worker enjoys consumption x (a good) and dislikes noise y (a bad): u = x − y². Each extra unit of noise accepted raises pay by 10 units of x, so along the job offer x = 10y. The utility-maximising noise level y is:", "explain": "Substitute x = 10y: U(y) = 10y − y². Setting dU/dy = 10 − 2y = 0 gives y = 5 (with x = 50). This is an interior optimum trading the good off against the bad.", "opts": ["5", "10", "0", "20"], "correct": 0}, {"id": 456, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "hard", "q": "Both x and y are bads: u(x, y) = −x² − y². The indifference-curve slope dy/dx = −MUx/MUy at the point (1, 1) is:", "explain": "MUx = −2x and MUy = −2y, so dy/dx = −MUx/MUy = −(−2x)/(−2y) = −x/y = −1 at (1, 1). With two bads the curves slope downward and utility rises toward the origin (fewer of both).", "opts": ["−1 (downward sloping)", "+1 (upward sloping)", "0", "undefined"], "correct": 0}, {"id": 457, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "easy", "q": "An economic bad is best defined as a commodity whose:", "explain": "A bad is a good with negative marginal utility: consuming more reduces utility. Do not confuse it with an inferior good, which is defined by negative income elasticity.", "opts": ["marginal utility is negative — more of it lowers utility", "price is negative", "income elasticity is negative", "marginal utility is zero"], "correct": 0}, {"id": 458, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "easy", "q": "For a good, more is preferred to less. For a bad, the consumer prefers:", "explain": "Because marginal utility is negative, less of a bad is preferred to more; the direction of improvement points toward smaller quantities of the bad.", "opts": ["less to more", "more to less", "an unchanged amount", "exactly zero always"], "correct": 0}, {"id": 459, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "easy", "q": "'Hours worked' is unpleasant (a bad). Redefining the axis as leisure = 24 − hours worked makes leisure:", "explain": "Turning a bad into its absence (leisure = time not worked) flips the sign of marginal utility, so leisure is a good. This is the standard relabelling trick.", "opts": ["a good, with positive marginal utility", "still a bad", "irrelevant to utility", "a numeraire"], "correct": 0}, {"id": 460, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "med", "q": "Pollution is a bad, plotted on the vertical axis against a good x. If we instead plot 'clean air' = (maximum − pollution) on that axis, the indifference curves change from:", "explain": "With pollution (a bad) the curves slope upward; relabelling the axis as clean air (a good) restores the standard downward-sloping shape. Preferences are unchanged — only the description is.", "opts": ["upward sloping to downward sloping (standard)", "downward to upward", "upward to horizontal", "unchanged"], "correct": 0}, {"id": 461, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "med", "q": "With one good x and one bad y, the indifference curves slope upward. Can any of them slope downward?", "explain": "The slope −MUx/MUy with MUx greater than 0 and MUy less than 0 is positive everywhere, so the curves slope upward throughout — none can slope downward.", "opts": ["No — while one is a good and the other a bad, the slope −MUx/MUy is positive", "Yes, if x is expensive", "Yes, near the origin", "Only if preferences are non-convex"], "correct": 0}, {"id": 462, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "med", "q": "A consumer's utility is u = x − y with x a good and y a bad. If y can be chosen freely (it has no offsetting benefit), the optimum sets y at:", "explain": "Since MUy = −1 is less than 0, utility always rises as y falls, so the consumer drives the bad down to the lowest amount available — a corner solution. MUy is never 0 here, so there is no interior optimum.", "opts": ["its lowest feasible level (a corner, e.g. y = 0)", "its highest feasible level", "the level where x = y", "an interior point where MUy = 0"], "correct": 0}, {"id": 463, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "med", "q": "With x a good and y a bad, the magnitude of the MRS (extra x needed to hold utility constant per extra unit of y) measures:", "explain": "Along an indifference curve, more of the bad y must be offset by more of the good x; the required extra x per unit of y is the compensation, i.e. |MRS|. The upward slope reflects exactly this trade-off.", "opts": ["the compensation in the good needed to tolerate one more unit of the bad", "the price of the bad", "the income effect of the bad", "the consumer's total utility"], "correct": 0}, {"id": 464, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "easy", "q": "The marginal willingness to pay for one more unit of an economic bad is:", "explain": "Because the bad lowers utility, the consumer would accept more of it only in exchange for compensation, so marginal willingness to pay is negative.", "opts": ["negative — the consumer must be paid to accept it", "positive and large", "always zero", "equal to the good's price"], "correct": 0}, {"id": 465, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "med", "q": "Bruno the dog's utility rises with treats (a good) and falls with nail-clipping sessions (a bad). Plotting treats horizontally and clippings vertically, a move straight up (more clippings, same treats) takes Bruno to:", "explain": "More of the bad (clippings) with no extra treats lowers utility, so Bruno drops to a lower indifference curve. Higher curves lie down and to the right (more treats, fewer clippings).", "opts": ["a lower indifference curve", "a higher indifference curve", "the same curve", "an undefined point"], "correct": 0}, {"id": 466, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "med", "q": "x is a good and y is a bad (x horizontal, y vertical). Relative to a given upward-sloping indifference curve, the strictly preferred bundles lie:", "explain": "Utility increases with more x and less y, i.e. toward the lower-right, so the better-than set sits below and to the right of any indifference curve.", "opts": ["below and to the right (more x, less y)", "above and to the left", "above and to the right", "below and to the left"], "correct": 0}, {"id": 467, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "easy", "q": "A commodity y switches from being a good to being a bad (its marginal utility changes from positive to negative). The indifference-curve slope −MUx/MUy changes from:", "explain": "With y a good, MUy greater than 0 makes −MUx/MUy negative (downward). Once y becomes a bad, MUy less than 0 makes the slope positive (upward).", "opts": ["negative to positive (downward to upward)", "positive to negative", "zero to positive", "it does not change"], "correct": 0}, {"id": 468, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "med", "q": "For two bads (say traffic noise and air pollution), which statement is correct?", "explain": "Both marginal utilities are negative, so −MUx/MUy is negative (downward-sloping), and less of either bad is better — utility rises toward the origin.", "opts": ["Curves slope downward and utility rises toward the origin", "Curves slope upward and utility rises away from the origin", "Curves slope downward and utility rises away from the origin", "Curves are vertical"], "correct": 0}, {"id": 469, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "hard", "q": "Which statement correctly distinguishes an economic bad from an inferior good?", "explain": "A bad is defined by MU less than 0 (more is worse). An inferior good still has MU greater than 0 (more is better) but is bought less as income rises (η less than 0). The two concepts are unrelated.", "opts": ["A bad has negative marginal utility; an inferior good has negative income elasticity but positive marginal utility", "They are the same thing", "A bad has negative income elasticity; an inferior good has negative marginal utility", "Both have negative marginal utility"], "correct": 0}, {"id": 470, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "med", "q": "A footballer values goals x (a good) and dislikes yellow cards y (a bad). With goals horizontal and cards vertical, his indifference curves slope upward. A bundle with one extra goal and one fewer card is:", "explain": "More of the good and less of the bad both raise utility, so the new bundle is strictly preferred — it lies to the lower-right, on a higher indifference curve.", "opts": ["strictly preferred", "strictly worse", "indifferent", "not comparable"], "correct": 0}, {"id": 471, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "med", "q": "Relabelling a bad y as its absence z = M − y (a good) changes:", "explain": "The trick is a change of variable: the same bundles keep the same ranking. What changes is the picture — curves that sloped upward in (x, y) slope downward in (x, z).", "opts": ["only the description/axis, not the underlying preferences", "the consumer's actual ranking of bundles", "the sign of MUx for the good", "nothing at all, including the curve's slope in the diagram"], "correct": 0}, {"id": 472, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "easy", "q": "A patient values health x (a good) and endures side-effects y (a bad) from a drug. On axes with x horizontal and y vertical, the indifference curves are:", "explain": "One good and one bad give slope −MUx/MUy = −(positive)/(negative), which is greater than 0, so the curves slope upward.", "opts": ["upward sloping", "downward sloping", "horizontal", "vertical"], "correct": 0}, {"id": 473, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "med", "q": "Among bundles on an upward-sloping indifference map (x a good, y a bad), the consumer most prefers the one that is:", "explain": "Utility increases with more x and less y, so the best reachable bundle lies as far to the lower-right as feasibility allows.", "opts": ["farthest to the lower-right (most x, least y)", "farthest up-right", "closest to the origin", "farthest up-left"], "correct": 0}, {"id": 474, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "hard", "q": "A consumer trades a good x against a bad y along an upward-sloping offer line (accepting more y buys more x). An interior optimum occurs where:", "explain": "As with ordinary tangency, the optimum sets the indifference-curve slope equal to the offer line's slope. Because y is a bad, both slopes are positive, and the tangency gives an interior trade-off between the good and the bad.", "opts": ["the indifference curve is tangent to the offer line (slopes equal)", "y is as small as possible", "x equals y", "the offer line hits the vertical axis"], "correct": 0}, {"id": 475, "topic": "Q6", "topicName": "Economic bads", "type": "mc", "difficulty": "easy", "q": "Which combination gives UPWARD-sloping indifference curves?", "explain": "Upward slope requires −MUx/MUy greater than 0, i.e. MUx and MUy have opposite signs — exactly one good and one bad. Two goods or two bads give downward-sloping curves.", "opts": ["exactly one of the two commodities is a bad", "both are goods", "both are bads", "neither — indifference curves never slope up"], "correct": 0}, {"id": 476, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "A preference relation is called “rational” in consumer theory when it is:", "explain": "Rational preferences are defined by two axioms: completeness (any two bundles can be ranked) and transitivity (the rankings chain consistently).", "opts": ["complete and transitive", "monotonic and convex", "continuous and convex", "reflexive and continuous"], "correct": 0}, {"id": 477, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "Completeness of preferences means that for any two bundles A and B:", "explain": "Completeness means no pair is incomparable: for any A and B the consumer can say A is at least as good as B, or B at least as good as A (or both).", "opts": ["A must equal B", "the consumer can rank them: A at least as good as B, or B at least as good as A (or both)", "A must be affordable whenever B is", "A is always strictly better than B"], "correct": 1}, {"id": 478, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "Transitivity means that if A is at least as good as B, and B is at least as good as C, then:", "explain": "Transitivity: if A is at least as good as B and B at least as good as C, then A is at least as good as C — rankings pass along the chain.", "opts": ["C must be strictly better than A", "A and C cannot be compared", "A is at least as good as C", "B is worse than both A and C"], "correct": 2}, {"id": 479, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "If preferences are rational (complete and transitive), the choices they generate:", "explain": "Choices generated by maximizing rational (complete, transitive) preferences can never contradict themselves, so they must satisfy WARP.", "opts": ["must violate WARP", "may or may not satisfy WARP depending on prices", "satisfy WARP only when there are exactly two goods", "must satisfy WARP"], "correct": 3}, {"id": 480, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "Why does transitivity rule out a cyclical choice pattern such as “A over B, B over C, C over A” when every pair is ranked?", "explain": "Transitivity forces one consistent ordering, so a cycle like A over B over C over A is impossible — no bundle can be ranked worse than itself.", "opts": ["transitivity forces a consistent ranking, so no bundle can end up worse than itself", "transitivity does not restrict cycles at all", "transitivity only restricts price ratios", "transitivity requires convex indifference curves"], "correct": 0}, {"id": 481, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "Rational preferences guarantee that observed choices are:", "explain": "Rational preferences yield a single consistent ranking, so observed choices show no pairwise reversals.", "opts": ["random across repeated trials", "internally consistent, with no pairwise reversals", "always at a corner solution", "independent of what is affordable"], "correct": 1}, {"id": 482, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "Which pair of properties, together, is the textbook definition of “rational preferences” used in this course?", "explain": "The textbook definition of rational preferences in this course is exactly completeness plus transitivity.", "opts": ["convexity and monotonicity", "transitivity and convexity", "completeness and transitivity", "completeness and continuity"], "correct": 2}, {"id": 483, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "A consumer strictly prefers A to B, B to C, and also strictly prefers C to A (every pair is ranked). These preferences are:", "explain": "Strict cycle A over B, B over C, C over A ranks every pair (so it is complete) but breaks the chaining requirement, so it is complete but not transitive.", "opts": ["rational", "transitive but not complete", "convex", "complete but not transitive"], "correct": 3}, {"id": 484, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "Suppose a data set of choices satisfies WARP. Can we conclude the underlying preferences are rational in the strongest (SARP) sense, guaranteed free of any longer inconsistent cycle?", "explain": "WARP only forbids two-way (pairwise) contradictions; a data set can pass WARP yet still contain a longer inconsistent cycle that only SARP rules out.", "opts": ["not necessarily; WARP only rules out two-way (pairwise) contradictions, not longer cycles", "yes, always, regardless of how many observations there are", "no, WARP actually implies the preferences are non-convex", "yes, but only if the consumer has intransitive preferences"], "correct": 0}, {"id": 485, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "The logical relationship “rational preferences imply WARP” means that:", "explain": "Rational preferences imply WARP: completeness and transitivity force WARP-consistent choices, but WARP alone does not prove full rationality (the converse is not automatic).", "opts": ["WARP alone is sufficient to prove preferences are fully rational", "completeness and transitivity together force the choices to satisfy WARP, though the converse is not automatic", "WARP and rationality are unrelated conditions", "WARP implies transitivity but not completeness"], "correct": 1}, {"id": 486, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "A classmate claims: “rational preferences can sometimes generate choices that fail WARP, in edge cases like indifference.” This claim is:", "explain": "The claim is incorrect: rational preferences must always generate WARP-consistent choices, with no exception, even under indifference.", "opts": ["correct, whenever indifference occurs", "correct, but only with more than two goods", "incorrect; rational preferences must generate WARP-consistent choices, with no exception", "correct, only under decreasing marginal utility"], "correct": 2}, {"id": 487, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "Under budget line 2, is bundle a=(2,6) affordable?", "explain": "Bundle a=(2,6) is not affordable on budget line 2: its cost (about 6.67) exceeds the income of 4, so it lies outside that budget set.", "opts": ["yes, exactly on the line", "no, its cost of about 6.67 exceeds the income of 4", "yes, with money left over", "cannot be determined"], "correct": 1}, {"id": 488, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "Under budget line 1, is bundle b=(3,3) affordable?", "explain": "Bundle b=(3,3) costs 3+3=6, which is within the income of 8 on budget line 1, so it is affordable.", "opts": ["no, it costs more than 8", "cannot be determined without prices", "yes, it costs 3+3=6, within the income of 8", "only if x and y are measured in the same units"], "correct": 2}, {"id": 489, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "Given that a was chosen while b was affordable (under budget line 1), and b was chosen only when a was NOT affordable (under budget line 2), this choice pattern:", "explain": "a is chosen when b is affordable, but b is chosen only when a is NOT affordable, so the situation that would create a contradiction never arises — consistent with WARP.", "opts": ["violates WARP because a and b were both chosen", "violates WARP because b is cheaper than a", "cannot be evaluated without a utility function", "is fully consistent with WARP; there is no contradiction"], "correct": 3}, {"id": 490, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "The pattern above does not violate WARP because:", "explain": "No WARP violation: because a is unaffordable under budget line 2, we never have b chosen while a is affordable, so the two-way contradiction cannot occur.", "opts": ["a is not affordable under budget line 2, so the situation needed for a contradiction, namely b chosen while a is affordable, never arises", "bundle b is strictly preferred to bundle a", "the consumer has non-transitive preferences", "budget line 1 lies entirely inside budget line 2"], "correct": 0}, {"id": 491, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "Under budget line 1, is bundle b=(2,5.6) affordable?", "explain": "Bundle b=(2,5.6) costs 2+5.6=7.6, within the income of 8 on budget line 1, so it is affordable.", "opts": ["no, it costs 8.4", "yes, it costs 2+5.6=7.6, within the income of 8", "only if prices change", "no, because b was chosen under budget line 2"], "correct": 1}, {"id": 492, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "Under budget line 2, is bundle a=(6,2) affordable?", "explain": "Bundle a=(6,2) costs 0.7·6+2=6.2, within the income of 7 on budget line 2, so it is affordable.", "opts": ["no, it costs 8", "cannot be determined", "yes, it costs 0.7(6)+2=6.2, within the income of 7", "no, because a was chosen under budget line 1"], "correct": 2}, {"id": 493, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "Given the results of Q5 and Q6, this choice pattern:", "explain": "Here a was chosen while b was affordable AND b was chosen while a was affordable, giving contradictory revealed preferences — a WARP violation.", "opts": ["is consistent because each bundle was chosen on its own budget line", "cannot be evaluated because the budget lines cross", "is consistent because a and b are different bundles", "violates WARP: a was chosen while b was affordable, and b was chosen while a was affordable"], "correct": 3}, {"id": 494, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "The deep reason the pattern in Q5 to Q7 is a genuine WARP violation is that:", "explain": "The pattern reveals both a preferred to b and b preferred to a at the same time, which is the defining contradiction WARP forbids.", "opts": ["it shows two contradictory revealed preferences, “a preferred to b” and “b preferred to a”, holding at the same time", "the budget lines have different intercepts", "the consumer's income increased", "bundle a contains more of good x than bundle b"], "correct": 0}, {"id": 495, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "A violation of WARP such as the one in Q7 implies that the observed choices:", "explain": "A WARP violation cannot come from any rational (complete, transitive) preference relation, because such preferences always generate consistent choices.", "opts": ["were generated by strictly convex preferences", "cannot have been generated by any rational (well-behaved) preference relation", "must involve an error in the experimenter's data entry", "are still consistent with some transitive preference ordering"], "correct": 1}, {"id": 496, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "On a diagram with two crossing budget lines, a WARP violation typically looks like:", "explain": "A typical WARP violation on crossing budget lines has each chosen bundle lying beyond the crossing point, so each was also affordable under the other budget.", "opts": ["both chosen bundles lying on the same budget line", "the chosen bundle always at a corner", "each chosen bundle lying beyond the crossing point, so it was also affordable under the other budget line", "the two budget lines never touching"], "correct": 2}, {"id": 497, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "If instead bundle a=(6,2) had NOT been affordable under budget line 2 (its cost exceeded 7), then the choice of b would:", "explain": "If a is not affordable when b is chosen, the two-way contradiction cannot form, so there is no WARP violation.", "opts": ["still be a WARP violation regardless", "be impossible to evaluate", "prove the preferences are irrational", "no longer create a contradiction, since a WARP violation requires that each bundle be affordable when the other is chosen"], "correct": 3}, {"id": 498, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "If a consumer chooses bundle A when bundle B is also affordable, we say that:", "explain": "Choosing A while B is affordable means A is directly revealed preferred to B — the basic definition of revealed preference.", "opts": ["B is directly revealed preferred to A", "A and B are indifferent", "A is directly revealed preferred to B", "B is not affordable"], "correct": 2}, {"id": 499, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "Revealed preference theory recovers information about preferences by:", "explain": "Revealed preference recovers preference information purely from observed choices under different budgets, without assuming any cardinal utility number.", "opts": ["assuming a specific utility function from the start", "surveying the consumer directly about their tastes", "measuring marginal utility in a laboratory", "observing actual choices made under different budgets, without needing to assume any utility number"], "correct": 3}, {"id": 500, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "If A is directly revealed preferred to B, and B is directly revealed preferred to C, then A is said to be:", "explain": "If A is directly revealed preferred to B and B directly revealed preferred to C, then A is indirectly revealed preferred to C by chaining.", "opts": ["indirectly revealed preferred to C", "directly revealed preferred to C only if there are two goods", "equally good as C", "not comparable to C"], "correct": 0}, {"id": 501, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "The Strong Axiom of Revealed Preference (SARP) differs from WARP mainly in that SARP:", "explain": "SARP strengthens WARP by also ruling out longer inconsistent cycles, using the full chain of revealed preference rather than single pairs.", "opts": ["applies only to two goods", "also rules out longer inconsistent cycles, using the full chain of revealed preference, not just single pairs", "applies only to corner solutions", "requires convex indifference curves"], "correct": 1}, {"id": 502, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "WARP is best described as ruling out:", "explain": "WARP rules out the direct two-way contradiction: A revealed preferred to B and then B revealed preferred to A.", "opts": ["any cycle of any length among revealed preferences", "preferences that are not convex", "a direct two-way contradiction: A revealed preferred to B, and then B revealed preferred to A", "budget lines that cross"], "correct": 2}, {"id": 503, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "SARP is needed, beyond WARP, in order to:", "explain": "SARP is what is needed to fully rationalize a data set with a complete, transitive preference relation, because it also excludes longer cycles.", "opts": ["rule out corner solutions", "guarantee convex indifference curves", "compute marginal utility", "fully rationalize a data set of choices with a well-behaved (complete, transitive) preference relation, including ruling out longer cycles"], "correct": 3}, {"id": 504, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "A choice pattern that violates WARP:", "explain": "A choice pattern that violates WARP cannot have been generated by any rational preference relation, convex or not.", "opts": ["cannot have been generated by any rational (complete and transitive) preference relation", "can still be generated by some rational preference relation, just not a convex one", "only affects the SARP test, not the underlying rationality", "implies the consumer has incomplete but possibly transitive preferences"], "correct": 0}, {"id": 505, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "The practical value of revealed preference theory, for testing demand behavior empirically, is that it lets economists:", "explain": "The practical power of revealed preference is testing the consistency of observed choices without ever assuming or estimating a cardinal utility function.", "opts": ["directly measure utils from survey data", "test the consistency of observed choices without ever having to assume or estimate a cardinal utility function", "prove that all consumers have convex preferences", "replace budget constraints with indifference curves"], "correct": 1}, {"id": 506, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "Suppose A is directly revealed preferred to B, and separately C is directly revealed preferred to A. Then, by the logic used to build SARP, we can say C is:", "explain": "From A directly revealed preferred to B and C directly revealed preferred to A, chaining gives C indirectly revealed preferred to B.", "opts": ["directly revealed preferred to B", "indifferent to B", "indirectly revealed preferred to B", "never comparable to B"], "correct": 2}, {"id": 507, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "Which statement correctly ranks the two axioms by strength?", "explain": "SARP is at least as strong as WARP: it requires WARP for every pair plus consistency across longer chains.", "opts": ["WARP is stronger than SARP", "SARP and WARP are always exactly equivalent, for any number of goods", "neither axiom is ever related to the other", "SARP is at least as strong as WARP: SARP requires WARP to hold for every pair, plus consistency across longer chains"], "correct": 3}, {"id": 508, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "num", "difficulty": "med", "q": "Jane buys 12 kg potatoes + 6 kg beef; p_pot=10, p_beef=250. Beef rises to 350. Slutsky income compensation? [Δp·old q = 100·6]", "explain": "Slutsky compensation gives the consumer just enough extra income to still afford the OLD bundle at the new prices: Δincome = Δp·(old quantity) = (350−250)·6 = 600.", "answer": 600, "display": "600"}, {"id": 509, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "reveal", "difficulty": "med", "q": "Price of good 2 rises, purchasing power (Slutsky) held constant. The new bundle has good 1 lower than x1¹ only if:", "explain": "Preserved verified key. Holding Slutsky purchasing power fixed isolates the substitution move; good 1 ends up below its reference level only through a negative (inferior-good) income response, i.e. when good 1 is inferior.", "a": "Good 1 is inferior."}, {"id": 510, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "reveal", "difficulty": "med", "q": "Rational, monotonic, strictly convex prefs; p2 rises, purchasing power held constant. Then the compensated bundle has:", "explain": "With rational, monotonic, strictly convex preferences the pure substitution (Slutsky) effect of a rise in p2 shifts the compensated bundle toward the now-relatively-cheaper good 1 and away from good 2: more good 1, less good 2.", "a": "More of good 1 and less of good 2 than the initial bundle."}, {"id": 511, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "reveal", "difficulty": "med", "q": "If a consumer has rational preferences, then his choice:", "explain": "Rational (complete, transitive) preferences generate choices that satisfy both WARP and SARP.", "a": "Must satisfy WARP and SARP."}, {"id": 512, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "num", "difficulty": "med", "q": "Clothing price +10%, food +5%; before the change food was 80% of the budget and clothing 20%. Consumer Price Index (Laspeyres)? [0.8·1.05+0.2·1.10]", "explain": "A Laspeyres-type CPI weights the price relatives by base-period budget shares: 0.8·1.05 + 0.2·1.10 = 1.06.", "answer": 1.06, "display": "1.06"}, {"id": 513, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "reveal", "difficulty": "med", "q": "William: London (6 fish&amp;chips, 6 pizza; p=6,7) → Liverpool (10 fish&amp;chips, 0 pizza; p=2,5). Which is true?", "explain": "At London prices (6,7) the London bundle (6,6) costs 78 while the Liverpool bundle (10,0) costs 60 ≤ 78, so London is directly revealed preferred to Liverpool. At Liverpool prices (2,5) the London bundle costs 42 greater than the Liverpool cost 20, so it was not affordable — no contradiction, no WARP violation.", "a": "The London bundle is directly revealed preferred to the Liverpool bundle, and there is no evidence he violates WARP."}, {"id": 514, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "reveal", "difficulty": "med", "q": "Prices of ALL goods double. Which is true?", "explain": "When every price scales by the same factor, the Laspeyres index equals that factor exactly
