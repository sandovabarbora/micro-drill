 (no substitution to bias it): all prices doubling gives an index of 2, measuring the cost-of-living change precisely.", "a": "The Laspeyres price index measures the change in the cost of living precisely (=2)."}, {"id": 515, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "reveal", "difficulty": "med", "q": "Mustafa: Algeria p=(4,3) bundle (5,4); Burundi p=(3,5) bundle (4,6); Congo bundle (1,8). Which is true?", "explain": "Burundi (3,5)·bundle(4,6)=42 and Algeria bundle (5,4) costs 35 ≤ 42, so Burundi is revealed preferred to Algeria; Algeria (4,3)·bundle(5,4)=32 and Congo (1,8) costs 28 ≤ 32, so Algeria is revealed preferred to Congo. Congo costs 43 greater than 42 at Burundi prices, so the Burundi-to-Congo link is only INDIRECT (via Algeria).", "a": "The Burundian bundle is indirectly revealed preferred to the Congo bundle."}, {"id": 516, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "reveal", "difficulty": "med", "q": "Larry chooses A=(8,6), p1=4, p2=7 (spends all income = 74). A is directly revealed preferred to which of (15,2),(7,8),(2,10)?", "explain": "Larry's income is 4·8+7·6=74. Bundle (15,2) costs 4·15+7·2=74 ≤ 74, so it was affordable when A was chosen and A is directly revealed preferred to it. The others cost 84 and 78, both above 74.", "a": "(15,2) — it costs 4·15+7·2=74 ≤ 74, so it was affordable when A was chosen."}, {"id": 517, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "reveal", "difficulty": "med", "q": "Consumer chooses x when y affordable, and y when z affordable, and choices satisfy SARP. Then if z is chosen:", "explain": "Under SARP, x is (indirectly) revealed preferred to z through the chain x→y→z, so if z is chosen neither x nor y may be affordable — otherwise z would be revealed preferred to something ranked above it, a forbidden cycle.", "a": "Neither x nor y can be affordable."}, {"id": 518, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "easy", "q": "A consumer picks bundle A when bundle B lies within the same budget. We conclude:", "explain": "Choosing A when B was affordable directly reveals A as at least as good as B: A is directly revealed preferred to B.", "opts": ["B is directly revealed preferred to A", "A is directly revealed preferred to B", "A and B are indifferent", "nothing, without a utility function"], "correct": 1}, {"id": 519, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "easy", "q": "The Weak Axiom of Revealed Preference says that:", "explain": "WARP forbids a two-way contradiction: you cannot have both A revealed preferred to B and B revealed preferred to A.", "opts": ["every affordable bundle is chosen at least once", "if A is revealed preferred to B, then B is never revealed preferred to A", "preferences must be convex", "budget lines may not cross"], "correct": 1}, {"id": 520, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "At prices (px, py) = (3, 2) a consumer spends all income on the bundle (4, 5). Is the bundle (6, 1) revealed inferior to what she chose?", "explain": "Income is 3·4+2·5 = 22. Bundle (6,1) costs 3·6+2·1 = 20 ≤ 22, so it was affordable and her chosen bundle is directly revealed preferred to it.", "opts": ["no, (6,1) costs more than her income", "yes, (6,1) costs 20 which is within her income of 22, so her choice is revealed preferred to it", "cannot tell without her utility", "yes, but only if (6,1) is cheaper per unit"], "correct": 1}, {"id": 521, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "Observation 1: at prices (2, 1) the consumer buys (4, 1). Observation 2: at prices (1, 2) she buys (1, 4). Do these choices violate WARP?", "explain": "Both incomes are 9. Bundle (1,4) costs 2·1+1·4 = 6 ≤ 9 in observation 1, and (4,1) costs 1·4+2·1 = 6 ≤ 9 in observation 2, so each is affordable when the other is chosen — a WARP violation.", "opts": ["no, the bundles are different", "yes: each bundle was affordable when the other was chosen, so both are revealed preferred to each other", "no, incomes differ", "cannot tell without utility"], "correct": 1}, {"id": 522, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "hard", "q": "Observation 1: at prices (1, 2) the consumer buys (6, 3). Observation 2: at prices (2, 1) she buys (3, 6). Are these choices consistent with WARP?", "explain": "Both incomes are 12. Bundle (3,6) costs 1·3+2·6 = 15 greater than 12 in observation 1, and (6,3) costs 2·6+1·3 = 15 greater than 12 in observation 2, so neither is affordable when the other is chosen — fully consistent with WARP.", "opts": ["no, they always violate WARP when budgets cross", "yes: neither bundle was affordable when the other was chosen, so no contradiction can arise", "no, the bundles differ", "cannot be judged"], "correct": 1}, {"id": 523, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "A data set shows A revealed preferred to B, B revealed preferred to C, and C revealed preferred to A. This three-step cycle:", "explain": "SARP forbids any revealed-preference cycle; a closed loop A→B→C→A is exactly the kind of longer inconsistency SARP rules out.", "opts": ["satisfies SARP", "violates SARP (and hence cannot come from rational preferences)", "is required by transitivity", "only violates WARP"], "correct": 1}, {"id": 524, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "easy", "q": "How does SARP go beyond WARP?", "explain": "WARP only bans pairwise reversals; SARP additionally bans longer cycles by chaining the full revealed-preference relation.", "opts": ["it applies only to two goods", "it rules out longer revealed-preference cycles, not just direct two-way reversals", "it requires convex indifference curves", "it needs cardinal utility"], "correct": 1}, {"id": 525, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "If A is directly revealed preferred to B and B is directly revealed preferred to C, then with respect to C, A is:", "explain": "Chaining two direct revealed preferences gives an INDIRECT revealed preference: A is indirectly revealed preferred to C.", "opts": ["indifferent to C", "indirectly revealed preferred to C", "directly revealed preferred to C", "not comparable to C"], "correct": 1}, {"id": 526, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "hard", "q": "Revealed preference lets us bound an unobserved indifference curve because:", "explain": "Recoverability: bundles revealed preferred to x are at least as good as x, and bundles x is revealed preferred to are no better, so the true indifference curve through x is bounded between these sets.", "opts": ["bundles revealed preferred to x lie on it", "bundles revealed preferred to x must be at least as good, and bundles to which x is revealed preferred must be no better, sandwiching the indifference set", "utility is directly measured", "the budget line is the indifference curve"], "correct": 1}, {"id": 527, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "At base prices (2, 3) the consumer chose the base bundle (4, 2). The later bundle (3, 1) costs 9 at those base prices, below the base spending of 14. This tells us:", "explain": "The later bundle was affordable when the base bundle was chosen (9 ≤ 14), so the base bundle is revealed preferred to it — equivalently the Laspeyres quantity index (p⁰·q¹)/(p⁰·q⁰) = 9/14 is below 1.", "opts": ["the later bundle is revealed preferred to the base bundle", "the base bundle is directly revealed preferred to the later bundle, matching a Laspeyres quantity index below 1", "nothing about preferences", "the two bundles are indifferent"], "correct": 1}, {"id": 528, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "At current prices (1, 4) the consumer chose (6, 1). The earlier bundle (2, 2) costs 10 at current prices, equal to the current spending of 10. This means:", "explain": "The earlier bundle was affordable at current prices (10 ≤ 10), so the current bundle is revealed preferred to it — equivalently the Paasche quantity index (p¹·q¹)/(p¹·q⁰) = 10/10 is at least 1.", "opts": ["the earlier bundle is revealed preferred to the current one", "the current bundle is revealed preferred to the earlier bundle, matching a Paasche quantity index of at least 1", "the two are indifferent", "nothing can be said"], "correct": 1}, {"id": 529, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "easy", "q": "Bruno the dog is offered treat A and treat B; he can reach both but grabs A. In revealed-preference terms:", "explain": "He chose A when B was equally available (affordable), so A is directly revealed preferred to B.", "opts": ["B is revealed preferred to A", "A is directly revealed preferred to B, since B was available and he chose A", "he is indifferent", "nothing is revealed"], "correct": 1}, {"id": 530, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "hard", "q": "Observation 1: at prices (3, 1) the consumer buys (5, 2). Observation 2: at prices (1, 3) she buys (2, 5). Is this a WARP violation?", "explain": "Both incomes equal 17. Bundle (2,5) costs 3·2+1·5 = 11 ≤ 17 in observation 1, and (5,2) costs 1·5+3·2 = 11 ≤ 17 in observation 2, so each was affordable when the other was chosen — a WARP violation.", "opts": ["no, the incomes differ so it cannot be judged", "yes: with both incomes equal to 17, each bundle was affordable when the other was chosen", "no, because the bundles are symmetric", "only if preferences are convex"], "correct": 1}, {"id": 531, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "A consumer with income 20 buys (5, 5) at prices (2, 2). Which bundle is directly revealed inferior to her choice?", "explain": "Her choice is directly revealed preferred to any affordable bundle. (8,1) costs 2·8+2·1 = 18 ≤ 20 (affordable); the others cost 22 and 24, above her income.", "opts": ["(8, 1), which costs 18 and was therefore affordable", "(9, 2), which costs 22", "(6, 6), which costs 24", "none, since she spent all her income"], "correct": 0}, {"id": 532, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "easy", "q": "The chief methodological advantage of revealed preference is that it:", "explain": "Revealed preference works entirely from observed price-quantity data and needs no cardinal utility, letting economists test consistency directly.", "opts": ["measures utils in a laboratory", "tests choice consistency using only observed prices and quantities, with no cardinal utility assumed", "assumes a Cobb-Douglas utility from the start", "requires interviewing the consumer"], "correct": 1}, {"id": 533, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "If A is (directly or indirectly) revealed preferred to B, SARP requires that:", "explain": "SARP forbids reversing any established revealed preference: if A is revealed preferred to B, then B cannot be revealed preferred to A, ruling out cycles.", "opts": ["B may still be revealed preferred to A", "B is never revealed preferred to A, so no cycle forms", "A and B are indifferent", "A is affordable whenever B is"], "correct": 1}, {"id": 534, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "hard", "q": "From two observations we learn that bundle x is revealed preferred to y, and z is revealed preferred to x. The recoverable ranking places:", "explain": "Revealed preference chains: z is revealed preferred to x and x to y, so the recovered ranking is z at least as good as x at least as good as y.", "opts": ["y above x above z", "z at least as good as x, and x at least as good as y", "x strictly above z", "no ordering at all"], "correct": 1}, {"id": 535, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "If one budget line lies entirely inside another (same prices, less income), then comparing the two chosen bundles:", "explain": "With nested budgets only one direction of affordability holds, so the two-way contradiction WARP forbids cannot occur — no violation is possible.", "opts": ["always violates WARP", "cannot violate WARP, because a bundle affordable on the inner budget is affordable on the outer one but not conversely", "is impossible to assess", "requires convexity"], "correct": 1}, {"id": 536, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "easy", "q": "A fan can afford either 90 minutes of football or 90 minutes of hockey and picks football. This choice:", "explain": "Football was chosen when hockey was equally affordable, so football is directly revealed preferred to hockey.", "opts": ["reveals hockey preferred to football", "directly reveals football preferred to hockey, since hockey was affordable and football was chosen", "reveals indifference", "reveals nothing about preference"], "correct": 1}, {"id": 537, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "med", "q": "Observation 1: at prices (1, 1) with income 10 the consumer buys (8, 2). Observation 2: at prices (1, 2) with income 10 she buys (4, 3). Are the choices consistent with WARP?", "explain": "In observation 1, (4,3) costs 7 ≤ 10 so the first bundle is revealed preferred to it. In observation 2, (8,2) costs 1·8+2·2 = 12 greater than 10, so it was not affordable and no reverse revelation occurs — consistent with WARP.", "opts": ["no, they violate WARP", "yes: bundle (4,3) was affordable in observation 1 so it is revealed inferior, and (8,2) was not affordable in observation 2, so no reversal occurs", "no, incomes are equal", "cannot be judged without utility"], "correct": 1}, {"id": 538, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "hard", "q": "A choice pattern can satisfy WARP yet still fail SARP when:", "explain": "WARP checks only pairs; a data set with no pairwise reversal can still hide a longer revealed-preference cycle that only SARP detects.", "opts": ["there is only one observation", "no pair is directly contradictory but a longer chain forms a cycle (A→B→C→A)", "prices never change", "the consumer is indifferent everywhere"], "correct": 1}, {"id": 539, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "hard", "q": "Which ranking of the two axioms by logical strength is correct?", "explain": "SARP implies WARP and adds the no-longer-cycles requirement, so SARP is at least as strong as WARP.", "opts": ["WARP is strictly stronger than SARP", "SARP is at least as strong as WARP: it implies WARP plus consistency over longer chains", "they are always equivalent for any data", "neither implies the other"], "correct": 1}, {"id": 540, "topic": "Q7", "topicName": "WARP & revealed preference", "type": "mc", "difficulty": "easy", "q": "Because a rational consumer's choices satisfy revealed preference, the compensated (Slutsky) own-price demand response must be:", "explain": "Revealed preference implies the Slutsky compensated own-price effect is non-positive — the compensated demand curve cannot slope up.", "opts": ["positive", "non-positive: revealed preference implies the compensated demand for a good does not rise when its own price rises", "zero always", "undefined"], "correct": 1}, {"id": 541, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "easy", "q": "In the endowment model the consumer's budget constraint is:", "explain": "In the endowment model money income is the market value of the endowment, so the budget is p1x1+p2x2 = p1ω1+p2ω2.", "opts": ["x<sub>1</sub>+x<sub>2</sub>=ω<sub>1</sub>+ω<sub>2</sub>", "p<sub>1</sub>x<sub>1</sub>+p<sub>2</sub>x<sub>2</sub>=M for a fixed money income M", "p<sub>1</sub>x<sub>1</sub>+p<sub>2</sub>x<sub>2</sub>=p<sub>1</sub>ω<sub>1</sub>+p<sub>2</sub>ω<sub>2</sub>", "p<sub>1</sub>x<sub>1</sub>=p<sub>2</sub>x<sub>2</sub>"], "correct": 2}, {"id": 542, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "easy", "q": "The budget line always passes through:", "explain": "Consuming exactly the endowment costs p1ω1+p2ω2, precisely its value, so ω always satisfies the budget equation.", "opts": ["the origin", "the endowment point ω", "the point where x<sub>1</sub>=0", "the midpoint between the two axis intercepts"], "correct": 1}, {"id": 543, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "easy", "q": "Why does the line always pass through ω?", "explain": "Buying exactly the endowment costs exactly what the endowment is worth, so ω is affordable at every price vector.", "opts": ["consuming exactly ω costs exactly what you own, so it is affordable at any price", "the consumer is forced to hold ω", "p<sub>1</sub> must equal p<sub>2</sub>", "ω is always the utility-maximising bundle"], "correct": 0}, {"id": 544, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "easy", "q": "The slope of the endowment budget line is:", "explain": "Rewriting p1x1+p2x2 = constant gives x2 = const minus (p1/p2)x1, a slope of minus p1/p2.", "opts": ["-ω<sub>1</sub>/ω<sub>2</sub>", "p<sub>1</sub>/p<sub>2</sub>", "-p<sub>2</sub>/p<sub>1</sub>", "-p<sub>1</sub>/p<sub>2</sub>"], "correct": 3}, {"id": 545, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "med", "q": "If p<sub>1</sub> falls, p<sub>2</sub> fixed, the line:", "explain": "The line always passes through ω; a lower p1 makes the slope minus p1/p2 less steep, so it pivots about ω and flattens.", "opts": ["pivots around ω, becoming flatter", "pivots around the origin", "shifts outward keeping the same slope", "pivots around ω, becoming steeper"], "correct": 0}, {"id": 546, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "med", "q": "In the FIXED-MONEY-INCOME model instead, a fall in p<sub>1</sub> pivots the line around:", "explain": "With fixed money income M the vertical intercept M/p2 is unchanged, so a fall in p1 swings the x1-intercept out, pivoting about the x2-intercept M/p2.", "opts": ["the endowment point", "the x<sub>1</sub>-intercept", "the x<sub>2</sub>-intercept, M/p<sub>2</sub>", "the origin"], "correct": 2}, {"id": 547, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "easy", "q": "The endowment income I=p<sub>1</sub>ω<sub>1</sub>+p<sub>2</sub>ω<sub>2</sub> is:", "explain": "I = p1ω1+p2ω2 is the market value of the endowment, so it changes when prices change.", "opts": ["constant, it never changes", "a function of prices: the market value of what you own", "always zero", "unrelated to ω"], "correct": 1}, {"id": 548, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "easy", "q": "At the bundle x=ω itself, the consumer is:", "explain": "Consuming exactly the endowment means zero net trade in every good.", "opts": ["a net buyer of good 1", "a net seller of good 2", "at the utility-maximising bundle for sure", "neither a net buyer nor a net seller of anything"], "correct": 3}, {"id": 549, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "med", "q": "If p<sub>1</sub> rises, p<sub>2</sub> fixed, the new line:", "explain": "A higher p1 steepens the slope minus p1/p2 while ω stays affordable, so the line pivots about ω and becomes steeper.", "opts": ["shifts up with no pivot", "becomes steeper, still through ω", "becomes flatter, still through ω", "no longer touches ω"], "correct": 1}, {"id": 550, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "med", "q": "Two different endowments with the same market value at the same prices trace:", "explain": "The budget line depends only on prices and the endowment's total value p1ω1+p2ω2; equal value at equal prices gives the identical line.", "opts": ["parallel, distinct lines", "perpendicular lines", "the same budget line", "lines that cross only at the origin"], "correct": 2}, {"id": 551, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "easy", "q": "Points on the budget line to the right of ω (more x<sub>1</sub> than ω<sub>1</sub>) are bundles where, if chosen, the consumer is:", "explain": "A point to the right of ω has x1 greater than ω1, i.e. she is buying good 1 on net.", "opts": ["unable to afford anything", "indifferent to ω", "a net seller of good 1", "a net buyer of good 1"], "correct": 3}, {"id": 552, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "easy", "q": "A consumer is a net buyer of good 1 if:", "explain": "A net buyer consumes more than she owns: x1* greater than ω1.", "opts": ["x<sub>1</sub><sup>*</sup>&gt;ω<sub>1</sub>", "x<sub>1</sub><sup>*</sup>&lt;ω<sub>1</sub>", "x<sub>1</sub><sup>*</sup>=ω<sub>1</sub>", "p<sub>1</sub>=0"], "correct": 0}, {"id": 553, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "easy", "q": "A consumer is a net seller of good 2 if:", "explain": "A net seller consumes less than she owns: x2* less than ω2, selling the difference.", "opts": ["x<sub>2</sub><sup>*</sup>=ω<sub>2</sub>", "x<sub>2</sub><sup>*</sup>&gt;ω<sub>2</sub>", "p<sub>2</sub>=0", "x<sub>2</sub><sup>*</sup>&lt;ω<sub>2</sub>"], "correct": 3}, {"id": 554, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "med", "q": "With exactly two goods, a strict net buyer of good 1 must (by the budget constraint) be:", "explain": "The budget through ω forces p1(x1 minus ω1) = minus p2(x2 minus ω2); buying good 1 on net makes the left side positive, so she must sell good 2 on net.", "opts": ["indifferent about good 2", "a strict net seller of good 2", "also a strict net buyer of good 2", "exactly at ω<sub>2</sub> for good 2"], "correct": 1}, {"id": 555, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "easy", "q": "A net buyer of good 1 is made BETTER off by:", "explain": "A net buyer of good 1 gains when the good she buys gets cheaper.", "opts": ["a rise in p<sub>2</sub>", "a rise in p<sub>1</sub>", "a fall in p<sub>1</sub>", "no price change affects her"], "correct": 2}, {"id": 556, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "easy", "q": "A net buyer of good 1 is made WORSE off by:", "explain": "A net buyer of good 1 is hurt when the good she buys gets more expensive.", "opts": ["a rise in p<sub>1</sub>", "a fall in p<sub>1</sub>", "a fall in p<sub>2</sub>", "a rise in her own endowment ω<sub>1</sub>"], "correct": 0}, {"id": 557, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "easy", "q": "A net seller of good 2 is made BETTER off by:", "explain": "A net seller of good 2 gains when the good she sells gets dearer.", "opts": ["a fall in p<sub>1</sub>", "a fall in p<sub>2</sub>", "a rise in p<sub>2</sub>", "a rise in ω<sub>1</sub>"], "correct": 2}, {"id": 558, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "easy", "q": "A net seller of good 2 is made WORSE off by:", "explain": "A net seller of good 2 is hurt when the good she sells gets cheaper.", "opts": ["a rise in p<sub>2</sub>", "a fall in p<sub>2</sub>", "a rise in p<sub>1</sub>", "a fall in p<sub>1</sub>"], "correct": 1}, {"id": 559, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "easy", "q": "The mirror rule: a net buyer gains when the price of the good she buys ____ ; a net seller gains when the price of the good she sells ____ .", "explain": "A net buyer gains when the price she pays falls; a net seller gains when the price she receives rises.", "opts": ["rises; rises", "rises; falls", "falls; rises", "falls; falls"], "correct": 2}, {"id": 560, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "med", "q": "A renter who owns no housing at all is a net ____ of housing services; a fall in rent makes her ____ .", "explain": "Owning no housing makes her a pure net buyer of housing services, so a rent (price) fall makes her better off.", "opts": ["seller; better off", "buyer; worse off", "seller; worse off", "buyer; better off"], "correct": 3}, {"id": 561, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "med", "q": "A farmer sells eggs and buys wheat. A fall in the price of wheat makes the farmer:", "explain": "The farmer is a net buyer of wheat, so a fall in the wheat price makes her better off.", "opts": ["worse off", "unaffected", "better off", "worse off, only if she also sells wheat"], "correct": 2}, {"id": 562, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "med", "q": "If a net buyer of good 1 sees p<sub>1</sub> fall, her utility:", "explain": "A net buyer of good 1 is made better off by a fall in p1, so her utility rises.", "opts": ["is impossible to sign without more information", "falls", "stays exactly the same", "rises"], "correct": 3}, {"id": 563, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "hard", "q": "By the WARP-style argument, a consumer who is a net buyer of good 1, after p<sub>1</sub> FALLS, will:", "explain": "Revealed preference rules out flipping to a net seller after a fall in the price of the good she buys, except at the knife-edge x1=ω1.", "opts": ["generally become a net seller of good 1", "remain a net buyer of good 1 (except possibly at a knife-edge)", "become a net buyer of good 2 instead", "always end up exactly at x<sub>1</sub><sup>*</sup>=ω<sub>1</sub>"], "correct": 1}, {"id": 564, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "hard", "q": "The first step of the argument shows that, after p<sub>1</sub> falls, the OLD optimal bundle x<sup>*</sup>:", "explain": "A net buyer has x1* greater than ω1 (right of ω); after p1 falls the flatter line lies above the old one there, so x* is strictly inside the new budget set.", "opts": ["is strictly affordable under the new budget, with income to spare", "is no longer affordable", "costs exactly the new income, no more no less", "becomes irrelevant once prices change"], "correct": 0}, {"id": 565, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "med", "q": "Since x<sup>*</sup> is strictly inside the new budget set, the new optimal bundle must be:", "explain": "Because x* is strictly interior to the new budget set she can afford something strictly better, so the new optimum is strictly preferred to x*.", "opts": ["strictly preferred to x<sup>*</sup>", "exactly as good as x<sup>*</sup>", "strictly worse than x<sup>*</sup>", "unrelated to x<sup>*</sup>"], "correct": 0}, {"id": 566, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "hard", "q": "The second step asks whether a hypothetical net-seller bundle (x<sub>1</sub>'<sup>*</sup>≤ω<sub>1</sub>), priced at the OLD prices, would have been:", "explain": "A would-be net-seller bundle (x1' at most ω1) valued at the OLD prices turns out weakly affordable then, contradicting x* having been the best choice at the old prices.", "opts": ["strictly preferred to ω automatically", "unaffordable at the old prices", "irrelevant to the old budget", "(weakly) affordable at the old prices, conflicting with x<sup>*</sup> having been the best choice back then"], "correct": 3}, {"id": 567, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "hard", "q": "The contradiction that rules out becoming a net seller is:", "explain": "Assuming she becomes a net seller forces x* to be both strictly better than and weakly worse than the same bundle, which is impossible.", "opts": ["prices would have to be negative", "x<sup>*</sup> would have to be simultaneously strictly better than, and weakly worse than, the hypothetical seller bundle", "the budget line would skip ω", "utility would be unbounded"], "correct": 1}, {"id": 568, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "hard", "q": "The one case the argument cannot rule out is the knife-edge one, where the consumer ends up:", "explain": "The only case not ruled out is landing exactly on the endowment, x1=ω1, trading nothing at the margin.", "opts": ["at a corner solution with x<sub>2</sub>=0", "buying only good 2", "selling good 1 for sure", "exactly at x<sub>1</sub>'<sup>*</sup>=ω<sub>1</sub>: trading nothing at the margin"], "correct": 3}, {"id": 569, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "med", "q": "In the fixed-income Slutsky equation the income term has coefficient -x<sub>1</sub>. In the endowment model this coefficient becomes:", "explain": "With an endowment the money income p1ω1+p2ω2 moves with p1, so the income coefficient changes from minus x1 to (ω1 minus x1).", "opts": ["(ω<sub>1</sub>-x<sub>1</sub>)", "+x<sub>1</sub>", "-ω<sub>1</sub>", "x<sub>1</sub>-ω<sub>1</sub>"], "correct": 0}, {"id": 570, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "med", "q": "This extra term exists because, in the endowment model:", "explain": "Only in the endowment model does income I=p1ω1+p2ω2 change with p1, which adds the endowment-income term.", "opts": ["preferences must be Cobb-Douglas", "the substitution effect vanishes", "income itself, I=p<sub>1</sub>ω<sub>1</sub>+p<sub>2</sub>ω<sub>2</sub>, moves with p<sub>1</sub>", "utility is measured in money"], "correct": 2}, {"id": 571, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "hard", "q": "For a net buyer of good 1 (x<sub>1</sub>&gt;ω<sub>1</sub>) with a normal good, the endowment-income term (ω<sub>1</sub>-x<sub>1</sub>) ∂ x<sub>1</sub>/∂ m is:", "explain": "For a net buyer ω1 minus x1 is negative and dx1/dm is positive, so the endowment-income term is negative and reinforces the negative substitution effect.", "opts": ["positive, and can make demand slope upward", "negative, reinforcing the (negative) substitution effect", "positive, offsetting the substitution effect", "always exactly zero"], "correct": 1}, {"id": 572, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "hard", "q": "For a net SELLER of good 1 (x<sub>1</sub>&lt;ω<sub>1</sub>) with a normal good, this same term is:", "explain": "For a net seller ω1 minus x1 is positive and dx1/dm is positive, so the term is positive and can outweigh the substitution effect: the mechanism behind backward-bending labour supply.", "opts": ["always zero for a seller", "negative, reinforcing the substitution effect", "irrelevant, sellers have no income effect", "positive, and can in principle outweigh the substitution effect: the mechanism behind backward-bending labor supply"], "correct": 3}, {"id": 573, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "num", "difficulty": "med", "q": "Milton endowed with 35 x and 20 y; px=5, py=7. Maximum quantity of x he can consume? [sell all y: (35·5+20·7)/5]", "explain": "Selling his whole endowment yields 35*5+20*7 = 315; all spent on x at px=5 buys 315/5 = 63.", "answer": 63, "display": "63"}, {"id": 574, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "num", "difficulty": "hard", "q": "Lucy: px=4, py=6, endowment 8 x and A units of y. NET demand for x is 3, GROSS demand for y is 10. Find A. [budget through endowment]", "explain": "Net demand for x is 3 so x*=11; gross y*=10. Budget through the endowment 4*11+6*10 = 4*8+6*A gives A = 12.", "answer": 12, "display": "12"}, {"id": 575, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "num", "difficulty": "hard", "q": "John: u=xy, endowed with 76 x and no y; px=4, py=1. His NET demand for y? [optimum x*=38 ⇒ y*=152, net y = 152−0]", "explain": "Income = 4*76 = 304; Cobb-Douglas u=xy spends half on y so y*=304/(2*1)=152, and owning no y makes net demand for y = 152.", "answer": 152, "display": "152"}, {"id": 576, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "num", "difficulty": "med", "q": "Lara: perfect substitutes (indifferent between x and y), endowment 8 x and 15 y; p_y = 3·p_x. Units of x she consumes? [sell y for x: 8+15·3]", "explain": "With px less than py, perfect substitutes hold only x; selling all y buys 15*(py/px)=15*3=45 units, plus the 8 owned gives 53.", "answer": 53, "display": "53"}, {"id": 577, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "reveal", "difficulty": "med", "q": "Jake: endowment (6,6), plans (5,8). Price of y falls, px fixed. His initial bundle (5,8):", "explain": "The budget pivots about the endowment (6,6); Jake was a net buyer of y, and after py falls his old bundle (5,8) is still affordable but no longer optimal.", "a": "Is still available and NOT optimal (the budget pivots around the endowment, opening better bundles)."}, {"id": 578, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "reveal", "difficulty": "med", "q": "James: px=4, py=6, endowment (10,10), plans (12,8). Prices change to px=6, py=9. Then he is:", "explain": "New prices (6,9) = 1.5*(4,6) scale income too, leaving the budget line unchanged, so he is neither better nor worse off.", "a": "Neither better off nor worse off (new prices proportional to the old direction through the endowment value)."}, {"id": 579, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "reveal", "difficulty": "hard", "q": "Endowment (5,8)→(8,7), same prices (px=4, py=7). After the endowment change:", "explain": "Same prices mean only endowment value matters: it rises from 4*5+7*8=76 to 4*8+7*7=81, a pure income increase, so an inferior x has lower gross demand.", "a": "If x is an inferior good, gross demand for x decreases."}, {"id": 580, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "reveal", "difficulty": "med", "q": "Bill: endowment (10,10), plans (8,14) — a net buyer of y. p_y rises, he moves to (9,11). Then:", "explain": "At (9,11) he still consumes more y than his endowment 10, so he stays a net buyer of y; a net buyer facing a higher price of that good is worse off.", "a": "Still a net buyer of y, so he must be worse off."}, {"id": 581, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "reveal", "difficulty": "med", "q": "At current prices the consumer neither buys nor sells (stays at her endowment). Which can happen?", "explain": "Starting exactly at the endowment, a rise in px steepens the line through ω and makes good x more valuable to sell, so she may become a net seller of x.", "a": "If the price of x rises, she might start SELLING good x."}, {"id": 582, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "reveal", "difficulty": "hard", "q": "Consumer is a net seller of x (consumes less x than her endowment). Which is correct?", "explain": "For a net seller of x a fall in px lowers the price she receives (worse off); the gross-demand response splits into a substitution effect (raises x) and an endowment/income effect whose sign depends on whether x is normal or inferior, so more than one listed statement is correct.", "a": "More of these are correct (about how normal/inferior x reacts to its own price fall)."}, {"id": 583, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "easy", "q": "The net demand for good 1 is defined as:", "explain": "Net demand is what she ends up consuming minus what she started with: x₁ minus ω₁, positive for a net buyer and negative for a net seller.", "opts": ["x₁ minus ω₁ (consumption minus endowment)", "ω₁ minus x₁", "x₁ plus ω₁", "x₁ times ω₁"], "correct": 0}, {"id": 584, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "easy", "q": "In the endowment model, gross demand for good 1 is:", "explain": "Gross demand is the total consumed, x₁; net demand is gross demand minus the endowment, x₁ minus ω₁.", "opts": ["the total amount x₁ she finally consumes", "only the extra units she buys in the market", "her endowment ω₁", "the amount she sells"], "correct": 0}, {"id": 585, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "easy", "q": "A consumer owns ω₁=10 units of good 1 and optimally consumes x₁=6. She is:", "explain": "Net demand = x₁ minus ω₁ = 6 minus 10 = minus 4, so she sells 4 units of good 1.", "opts": ["a net seller of 4 units of good 1", "a net buyer of 4 units of good 1", "at her endowment for good 1", "a net seller of 6 units"], "correct": 0}, {"id": 586, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "easy", "q": "A consumer with endowment ω₁=7 is a net buyer of 5 units of good 1. Her gross demand (total consumption) of good 1 is:", "explain": "Gross demand = endowment plus net purchases = 7 plus 5 = 12.", "opts": ["12", "2", "5", "35"], "correct": 0}, {"id": 587, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "med", "q": "Endowment ω=(10,5), prices p₁=2, p₂=4. Selling her whole endowment, the most of good 1 she could consume is:", "explain": "Endowment value = 2·10 plus 4·5 = 40; spent entirely on good 1 at p₁=2 that buys 40/2 = 20 units.", "opts": ["20", "10", "15", "40"], "correct": 0}, {"id": 588, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "med", "q": "Same data (ω=(10,5), p₁=2, p₂=4). The most of good 2 she could consume is:", "explain": "Endowment value 40 spent entirely on good 2 at p₂=4 buys 40/4 = 10 units.", "opts": ["10", "20", "40", "5"], "correct": 0}, {"id": 589, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "easy", "q": "Endowment ω=(20,10), prices p₁=3, p₂=4. The money value of her endowment (her budget) is:", "explain": "Endowment income = p₁ω₁ plus p₂ω₂ = 3·20 plus 4·10 = 60 plus 40 = 100.", "opts": ["100", "30", "40", "200"], "correct": 0}, {"id": 590, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "med", "q": "Preferences u=x₁x₂, endowment ω=(4,8), prices p₁=2, p₂=4. Her net demand for good 1 is:", "explain": "Income = 2·4 plus 4·8 = 40; Cobb-Douglas u=x₁x₂ sets x₁*=40/(2·2)=10, so net demand = 10 minus 4 = 6, a net buyer.", "opts": ["6 (net buyer)", "minus 6 (net seller)", "0", "3 (net buyer)"], "correct": 0}, {"id": 591, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "med", "q": "Same setup (u=x₁x₂, ω=(4,8), p₁=2, p₂=4). Her net demand for good 2 is:", "explain": "x₂*=40/(2·4)=5, so net demand = 5 minus 8 = minus 3: she sells 3 units of good 2, financing her 6 extra units of good 1 (2·6 = 4·3).", "opts": ["minus 3 (net seller)", "3 (net buyer)", "0", "minus 8"], "correct": 0}, {"id": 592, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "med", "q": "In that example she is a net buyer of good 1 (buys 6), so for good 2 she must be:", "explain": "With two goods the budget through ω forces buying one good on net to be paid for by selling the other, so she is a net seller of good 2.", "opts": ["a net seller of good 2", "also a net buyer of good 2", "at her endowment of good 2", "impossible to say"], "correct": 0}, {"id": 593, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "hard", "q": "Preferences u=x₁x₂, endowment ω=(4,8), p₂=4 fixed. As p₁ rises she switches from net buyer to net seller of good 1 exactly when p₁ reaches:", "explain": "She is at her endowment for good 1 when x₁*=ω₁: (4p₁ plus 32)/(2p₁)=4 gives p₁=8; above 8 she consumes less than ω₁ and becomes a net seller.", "opts": ["8", "4", "2", "16"], "correct": 0}, {"id": 594, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "hard", "q": "Prices p₁=2, p₂=3. A consumer owns 6 units of good 1 and B units of good 2. Her net demand for good 1 is 3 and her gross demand for good 2 is 8. Then B equals:", "explain": "x₁*=6 plus 3 = 9 and y*=8. The budget through the endowment 2·9 plus 3·8 = 2·6 plus 3·B gives B = 10.", "opts": ["10", "8", "6", "12"], "correct": 0}, {"id": 595, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "hard", "q": "Preferences u=min(x₁,x₂), endowment ω=(12,3), prices p₁=1, p₂=2. Her optimal consumption of each good is:", "explain": "Perfect complements sit on x₁=x₂; the budget 1·x₁ plus 2·x₂ = 1·12 plus 2·3 = 18 with x₁=x₂ gives (1 plus 2)x = 18, so x = 6.", "opts": ["6", "3", "9", "12"], "correct": 0}, {"id": 596, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "med", "q": "In that problem (u=min(x₁,x₂), ω=(12,3), optimum 6 of each) she is:", "explain": "She consumes 6 of good 1 (less than 12, sells 6) and 6 of good 2 (more than 3, buys 3): a net seller of good 1 and a net buyer of good 2, with values matching (1·6 = 2·3).", "opts": ["a net seller of good 1 and a net buyer of good 2", "a net buyer of both", "a net seller of both", "at her endowment"], "correct": 0}, {"id": 597, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "hard", "q": "Preferences u=x₁ plus x₂ (perfect substitutes), endowment ω=(10,10), p₁=1, p₂=2. Her optimal consumption of good 1 is:", "explain": "Since p₁ is below p₂ and the goods are equally liked, she holds only the cheaper good 1; selling all good 2 gives x₁ = (1·10 plus 2·10)/1 = 30.", "opts": ["30", "10", "20", "0"], "correct": 0}, {"id": 598, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "med", "q": "In the endowment Slutsky equation the income term is (ω₁ minus x₁)·∂x₁/∂m. For a consumer with ω₁=10 and x₁=6, the coefficient (ω₁ minus x₁) equals:", "explain": "ω₁ minus x₁ = 10 minus 6 = 4, positive because she consumes less than she owns (a net seller of good 1).", "opts": ["4 (positive; she is a net seller)", "minus 4", "minus 16", "6"], "correct": 0}, {"id": 599, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "med", "q": "For a net buyer with ω₁=6 and x₁=10, the endowment-Slutsky coefficient (ω₁ minus x₁) is:", "explain": "ω₁ minus x₁ = 6 minus 10 = minus 4, negative because a net buyer consumes more than she owns.", "opts": ["minus 4", "4", "16", "10"], "correct": 0}, {"id": 600, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "med", "q": "In the endowment model the Slutsky equation splits ∂x₁/∂p₁ into three parts. They are:", "explain": "With an endowment the total effect = ordinary substitution effect + ordinary income effect + the extra endowment-income effect, because the value of the endowment moves with p₁.", "opts": ["the substitution effect, the ordinary income effect, and the endowment-income effect", "only a substitution effect and an income effect", "two substitution effects and one income effect", "a substitution effect and a supply effect"], "correct": 0}, {"id": 601, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "hard", "q": "A net seller of a normal good sees its own price rise. Combining a negative substitution effect with a positive endowment-income effect, the total effect on her gross demand for that good is:", "explain": "For a net seller (ω₁ minus x₁ greater than 0) of a normal good the endowment-income term is positive and opposes the negative substitution term, so the sign is ambiguous: this is what makes backward-bending labour supply possible.", "opts": ["ambiguous in sign (the two effects oppose each other)", "always negative", "always positive", "always zero"], "correct": 0}, {"id": 602, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "med", "q": "After a price change, a consumer's ORIGINAL optimal bundle is still affordable at the new prices. Compared with before, she is:", "explain": "She could still buy her old bundle, so her new optimum is at least as good: a revealed-preference argument, making her weakly better off.", "opts": ["at least as well off (weakly better)", "strictly worse off", "exactly equally well off", "impossible to compare"], "correct": 0}, {"id": 603, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "hard", "q": "At prices (p₁,p₂)=(2,4) with endowment (10,10) she chose (4,13). Then p₁ rises to 4 (p₂ still 4). Her old bundle (4,13) is:", "explain": "New income = 4·10 plus 4·10 = 80; the old bundle now costs 4·4 plus 4·13 = 68, at most 80, so it is still (strictly) affordable.", "opts": ["still affordable (it costs 68, at most the new income 80)", "no longer affordable", "affordable only if p₂ also falls", "exactly on the new budget line"], "correct": 0}, {"id": 604, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "med", "q": "Same consumer: at (2,4) with endowment (10,10) she chose (4,13), a net seller of good 1; then p₁ rises to 4. She becomes:", "explain": "She sells good 1 (4 less than 10); a net seller is made better off when the price of the good she sells rises, so her welfare rises.", "opts": ["better off (a net seller when the price she receives rises)", "worse off", "exactly as well off", "a net buyer of good 1"], "correct": 0}, {"id": 605, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "hard", "q": "Preferences u=x₁x₂, endowment ω=(4,2). At p₁=2, p₂=4 she consumes exactly her endowment. If p₁ rises to 3 (p₂=4), her consumption of good 1 becomes:", "explain": "New income = 3·4 plus 4·2 = 20; x₁*=20/(2·3)=10/3, about 3.33, below ω₁=4, so the price rise turned her into a net seller of good 1.", "opts": ["10/3, about 3.33, so she is now a net seller of good 1", "exactly 4, still at her endowment", "5, a net buyer", "2"], "correct": 0}, {"id": 606, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "med", "q": "A consumer who currently neither buys nor sells (she consumes exactly her endowment). A rise in p₁ will, in general, make her:", "explain": "At the endowment her indifference curve is tangent to the old line; a steeper line (higher p₁) through ω moves her optimum to less good 1, so she starts selling good 1.", "opts": ["a net seller of good 1", "a net buyer of good 1", "unable to afford ω", "stay exactly at ω"], "correct": 0}, {"id": 607, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "easy", "q": "A consumer is a net seller of good 1 when her gross demand x₁ is:", "explain": "Selling on net means consuming less than owned: x₁ less than ω₁.", "opts": ["less than her endowment ω₁", "greater than ω₁", "equal to ω₁", "equal to zero"], "correct": 0}, {"id": 608, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "easy", "q": "The quantity p₁ω₁+p₂ω₂ (the market value of what the consumer owns) is her:", "explain": "It is the endowment's market value, which serves as her money income in the budget p₁x₁+p₂x₂ = p₁ω₁+p₂ω₂.", "opts": ["endowment income (the budget she can spend)", "consumer surplus", "substitution effect", "reservation price"], "correct": 0}, {"id": 609, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "easy", "q": "With p₁=6 and p₂=2, selling one unit of good 1 lets the consumer buy how many units of good 2?", "explain": "One unit of good 1 is worth p₁=6; at p₂=2 that buys 6/2 = 3 units of good 2.", "opts": ["3", "1/3", "12", "2"], "correct": 0}, {"id": 610, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "med", "q": "Endowment ω=(8,6), prices p₁=5, p₂=10. The horizontal intercept of the budget line (all wealth on good 1) is at x₁ =", "explain": "Endowment value = 5·8 plus 10·6 = 100; all spent on good 1 at p₁=5 gives x₁ = 100/5 = 20.", "opts": ["20", "8", "14", "100"], "correct": 0}, {"id": 611, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "med", "q": "Bruno the dog is given either 4 bones and 2 chews, or 2 bones and 4 chews. If a bone and a chew have the same price, the two gifts give Bruno:", "explain": "At equal prices both endowments have the same value (4 plus 2 = 2 plus 4 = 6 units' worth), and the budget line depends only on prices and endowment value, so it is identical.", "opts": ["the same budget line (equal total value)", "different, parallel budget lines", "budget lines that cross only at the origin", "no feasible bundles"], "correct": 0}, {"id": 612, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "med", "q": "A commuter grows vegetables (good 2) and buys petrol (good 1) to drive to work, buying far more petrol than she could ever sell. A rise in the petrol price makes her:", "explain": "She is a net buyer of good 1 (petrol); a net buyer is made worse off when the price of the good she buys rises.", "opts": ["worse off (she is a net buyer of petrol)", "better off", "exactly as well off", "a net seller of petrol"], "correct": 0}, {"id": 613, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "med", "q": "Prices are unchanged, but a consumer's endowment is replaced by a different bundle worth MORE at those prices. For her budget line this is:", "explain": "With prices fixed only the endowment's value matters; a higher value shifts the line out in parallel (same price ratio, more income).", "opts": ["a pure parallel outward shift (higher income, same slope)", "a pivot around the old endowment", "a steeper line", "no change at all"], "correct": 0}, {"id": 614, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "med", "q": "Endowment ω=(3,9), prices p₁=4, p₂=2. She chooses (6,3). The value she spends buying good 1 equals the value she raises selling good 2, namely:", "explain": "Net purchase of good 1 = 3 units, worth p₁·3 = 12; net sale of good 2 = 6 units, worth p₂·6 = 12; equal, so (6,3) lies on the budget line through ω.", "opts": ["12 = 12 (buys 3 of good 1 worth 12, sells 6 of good 2 worth 12)", "9 = 9", "3 = 6", "they do not balance"], "correct": 0}, {"id": 615, "topic": "Q8", "topicName": "Net buyer / seller (endowment)", "type": "mc", "difficulty": "hard", "q": "A net seller has ω₁=12, x₁=8, ∂x₁/∂m=0.5 (a normal good), and an own-substitution effect equal to minus 1. The endowment Slutsky total ∂x₁/∂p₁ = (substitution) + (ω₁ minus x₁)·∂x₁/∂m equals:", "explain": "(ω₁ minus x₁)·∂x₁/∂m = (12 minus 8)·0.5 = 2; total = minus 1 plus 2 = 1, positive, so gross demand rises with its own price: the backward-bending mechanism for a net seller.", "opts": ["1 (positive: demand rises with its own price)", "minus 1", "minus 3", "0"], "correct": 0}, {"id": 616, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "easy", "q": "In the labour-leisure model, the two goods the consumer chooses between are:", "explain": "The consumer trades off leisure against consumption; hours worked are the leftover time, not a separate choice good.", "opts": ["leisure and consumption", "leisure and hours worked", "the wage and consumption", "time and hours"], "correct": 0}, {"id": 617, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "easy", "q": "Hours worked L, leisure R, and the time endowment T are related by:", "explain": "All available time is either worked or enjoyed as leisure, so L = T minus R.", "opts": ["L=R-T", "L=T-R", "L=T+R", "L=RT"], "correct": 1}, {"id": 618, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "med", "q": "Rearranged, the budget line C=w(T-R)+m<sub>0</sub> reads:", "explain": "C = w(T minus R)+m0 = (m0+wT) minus wR, a line in R with intercept m0+wT and slope minus w.", "opts": ["C=m<sub>0</sub>-wR", "C=wT-m<sub>0</sub>R", "C=(m<sub>0</sub>+wT)-wR", "C=m<sub>0</sub>+R/w"], "correct": 2}, {"id": 619, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "easy", "q": "In this budget line, the wage w is best described as:", "explain": "Each hour of leisure costs the wage forgone, so w is the price of leisure.", "opts": ["total income", "a lump-sum transfer", "the price of consumption", "the price of leisure"], "correct": 3}, {"id": 620, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "easy", "q": "The slope dC/dR of the labour-leisure budget line equals:", "explain": "From C = (m0+wT) minus wR the slope dC/dR is minus w.", "opts": ["-w", "w", "-1/w", "-m<sub>0</sub>"], "correct": 0}, {"id": 621, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "easy", "q": "The bundle (R=T, C=m<sub>0</sub>) on this line is the point where the consumer:", "explain": "At R=T she uses all time as leisure and works zero hours, consuming only m0.", "opts": ["works every available hour", "takes all time as leisure and works zero hours", "sits at the interior optimum", "cannot afford the bundle"], "correct": 1}, {"id": 622, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "easy", "q": "Working every available hour (R=0) gives consumption equal to:", "explain": "Working every hour (R=0) gives C = m0 + wT.", "opts": ["m<sub>0</sub>", "wT", "m<sub>0</sub>+wT", "w+T"], "correct": 2}, {"id": 623, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "med", "q": "With T=10, w=1, m<sub>0</sub>=2, consumption at leisure R=6 equals:", "explain": "C = m0 + w(T minus R) = 2 + 1*(10 minus 6) = 6.", "opts": ["4", "16", "8", "6"], "correct": 3}, {"id": 624, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "easy", "q": "In that same example, hours worked at R=6 are:", "explain": "Hours worked L = T minus R = 10 minus 6 = 4.", "opts": ["4", "6", "10", "2"], "correct": 0}, {"id": 625, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "easy", "q": "At an interior labour-leisure optimum, the consumer's marginal rate of substitution between leisure and consumption equals:", "explain": "At an interior optimum the indifference curve is tangent to the budget line, so MRS = w.", "opts": ["m<sub>0</sub>", "the wage w", "T", "1"], "correct": 1}, {"id": 626, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "med", "q": "Holding T and m<sub>0</sub> fixed, a wage increase makes the budget line:", "explain": "A higher wage raises the price of leisure, steepening the line while it still passes through the endowment point, so it pivots and steepens.", "opts": ["shift outward in parallel", "shift inward in parallel", "steeper, pivoting at the fixed endowment point", "flatter, pivoting at the fixed endowment point"], "correct": 2}, {"id": 627, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "med", "q": "Mock-exam Q9 setup: C and R (leisure) are both normal goods, and the total time endowment rises. The new optimal consumption C<sub>1</sub><sup>*</sup> compared with the old C<sub>0</sub><sup>*</sup> is:", "explain": "With C and R both normal a bigger time endowment (a pure income gain) raises both, so C1* exceeds C0*.", "opts": ["lower", "unchanged", "ambiguous, could go either way", "higher"], "correct": 3}, {"id": 628, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "med", "q": "The reason a bigger time endowment raises BOTH leisure and consumption is that it:", "explain": "A larger T raises full income m0+wT at an unchanged wage (price of leisure), a pure income effect on two normal goods, raising both.", "opts": ["raises full income at an unchanged price ratio, a pure income effect on two normal goods", "lowers the wage", "raises the price of leisure", "has no effect on the budget line"], "correct": 0}, {"id": 629, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "easy", "q": "When only T rises (w and m<sub>0</sub> fixed), the relative price of leisure, the wage w:", "explain": "Raising T does not change the wage, so the price of leisure is unchanged.", "opts": ["rises", "stays exactly the same", "falls", "becomes negative"], "correct": 1}, {"id": 630, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "med", "q": "Because the relative price does not change when T rises, the effect on demand is:", "explain": "Because the wage (relative price of leisure) is unchanged, only an income effect operates when T rises.", "opts": ["a pure substitution effect", "split evenly between substitution and income effects", "a pure income effect", "impossible to sign"], "correct": 2}, {"id": 631, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "hard", "q": "If leisure were an inferior good instead of normal, a bigger time endowment would make optimal leisure R<sub>1</sub><sup>*</sup>:", "explain": "If leisure were inferior, the pure income gain from a bigger T would lower leisure.", "opts": ["rise", "stay the same", "double", "fall"], "correct": 3}, {"id": 632, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "easy", "q": "If leisure were inferior and R<sub>1</sub><sup>*</sup> fell as in the previous question, hours worked would:", "explain": "If R1* falls then L = T minus R rises: hours worked increase.", "opts": ["rise", "fall", "stay exactly the same", "become negative"], "correct": 0}, {"id": 633, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "hard", "q": "If consumption C were (hypothetically) an inferior good, a bigger time endowment would make C<sub>1</sub><sup>*</sup>:", "explain": "If consumption were inferior, the income gain from a bigger T would lower C.", "opts": ["rise", "fall", "stay the same", "be undefined"], "correct": 1}, {"id": 634, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "easy", "q": "Numerically: budget C=10-R (smaller endowment, T<sub>0</sub>=10) has optimum E<sub>0</sub>=(R,C)=(4,6); budget C=14-R (bigger endowment, T<sub>1</sub>=14) has optimum E<sub>1</sub>=(6,8). Leisure R rose from 4 to:", "explain": "Reading the optima, leisure R rose from 4 to 6.", "opts": ["4", "5", "6", "8"], "correct": 2}, {"id": 635, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "easy", "q": "In that same pair of optima, consumption C rose from 6 to:", "explain": "Reading the optima, consumption C rose from 6 to 8.", "opts": ["6", "7", "10", "8"], "correct": 3}, {"id": 636, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "easy", "q": "Using T<sub>0</sub>=10, T<sub>1</sub>=14, R<sub>0</sub>=4, R<sub>1</sub>=6, hours worked L=T-R went from 6 to:", "explain": "L = T minus R: L0 = 10 minus 4 = 6 and L1 = 14 minus 6 = 8.", "opts": ["8", "4", "2", "6"], "correct": 0}, {"id": 637, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "hard", "q": "The single word in the exam question that pins the answer down to “higher” rather than “ambiguous” is:", "explain": "Only the word 'normal' rules out the inferior case and pins the answer to 'higher' rather than 'ambiguous'.", "opts": ["“wage”", "“normal”", "“price”", "“substitution”"], "correct": 1}, {"id": 638, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "easy", "q": "A wage increase makes leisure relatively more expensive. The substitution effect alone therefore pushes the consumer toward:", "explain": "A wage rise makes leisure relatively dearer, so the substitution effect alone cuts leisure and raises hours.", "opts": ["more leisure, fewer hours", "no change in leisure", "less leisure, more hours worked", "more consumption only, leisure unaffected"], "correct": 2}, {"id": 639, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "easy", "q": "The same wage increase also makes the worker richer (higher full income). If leisure is normal, the income effect alone pushes toward:", "explain": "A wage rise raises full income; with leisure normal the income effect alone raises leisure and cuts hours.", "opts": ["less leisure, more hours", "no change", "less consumption", "more leisure, fewer hours worked"], "correct": 3}, {"id": 640, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "med", "q": "Because the substitution and income effects of a wage change point in opposite directions for leisure, the net effect of a wage rise on hours worked is:", "explain": "For leisure the substitution effect (cut) and income effect (raise) conflict, so the net effect of a wage rise on hours is ambiguous.", "opts": ["ambiguous in general", "always positive", "always negative", "always zero"], "correct": 0}, {"id": 641, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "med", "q": "This ambiguity is the standard explanation for why an individual's labour-supply curve (wage on the vertical axis, hours on the horizontal) can:", "explain": "Because the two effects conflict, hours can fall as the wage rises, giving a backward-bending supply curve.", "opts": ["be vertical", "bend backward at high wages", "be perfectly flat", "never slope upward"], "correct": 1}, {"id": 642, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "med", "q": "At relatively low wages, typically in these models, labour supply tends to be:", "explain": "At low wages the substitution effect usually dominates, so labour supply slopes up.", "opts": ["bending backward already", "vertical", "upward sloping, substitution effect dominating", "downward sloping everywhere"], "correct": 2}, {"id": 643, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "med", "q": "At high wages, the segment of the curve where hours FALL as the wage rises further reflects:", "explain": "Where hours fall as the wage rises further, the income effect has come to dominate the substitution effect.", "opts": ["the substitution effect finally dominating", "a fall in non-labour income", "an inferior consumption good", "the income effect dominating the substitution effect"], "correct": 3}, {"id": 644, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "med", "q": "A rise in non-labour (unearned) income m<sub>0</sub>, holding the wage fixed, changes the relative price of leisure:", "explain": "A change in m0 leaves the wage (price of leisure) unchanged, so there is no substitution effect.", "opts": ["not at all; there is no substitution effect", "by raising it", "by lowering it", "only if leisure is inferior"], "correct": 0}, {"id": 645, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "easy", "q": "With leisure a normal good, a rise in non-labour income m<sub>0</sub> alone (wage fixed) makes hours worked:", "explain": "A rise in m0 is a pure income effect; with leisure normal it raises leisure and cuts hours worked.", "opts": ["rise", "fall", "stay exactly the same", "become undefined"], "correct": 1}, {"id": 646, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "easy", "q": "Compared with a wage change, a change in non-labour income m<sub>0</sub> is:", "explain": "A change in non-labour income leaves the wage unchanged, so it is a pure income effect.", "opts": ["equally ambiguous, also has a substitution effect", "impossible to analyse", "unambiguous, a pure income effect only", "a pure substitution effect only"], "correct": 2}, {"id": 647, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "med", "q": "A lottery winner who suddenly receives a large lump sum of non-labour income, with leisure normal, is predicted by this model to work:", "explain": "A lottery win is a pure rise in m0; with leisure normal the income effect makes her work fewer hours.", "opts": ["more hours, pure substitution effect", "exactly the same hours", "more hours, pure income effect", "fewer hours, pure income effect"], "correct": 3}, {"id": 648, "topic": "Q9", "topicName": "Labour-leisure", "type": "num", "difficulty": "med", "q": "Alice: wage 6/h, 70 h/week, child allowance 40, wage taxed 10%. Maximum weekly consumption? [40 + 0.9·6·70]", "explain": "Maximum consumption uses all 70 hours: m0 + (1 minus t)*w*T = 40 + 0.9*6*70 = 40 + 378 = 418.", "answer": 418, "display": "418"}, {"id": 649, "topic": "Q9", "topicName": "Labour-leisure", "type": "num", "difficulty": "hard", "q": "Molly: u=CR, 16 h/day, no non-labour income, wage 3/h, needs 20/day, welfare = (needs−earnings) if she works ≥6 h. Daily welfare received?", "explain": "Welfare tops consumption up to needs (20) when she works at least 6h, so C=20 for any hours >=6; to maximise u=CR she works the minimum 6h, earns 3*6=18, and receives welfare 20 minus 18 = 2. (u=200 beats the no-welfare optimum u=192.)", "answer": 2, "display": "2"}, {"id": 650, "topic": "Q9", "topicName": "Labour-leisure", "type": "num", "difficulty": "hard", "q": "Lisa: u=C(2+R), 200 h/month, no non-labour income, wage 4/h, welfare 200 if she doesn't work. Hours she works?", "explain": "Working, u=C(2+R)=4(200 minus R)(2+R) is maximised at R=99, so L=200 minus 99=101 (u=40804 beats the not-working u=40400).", "answer": 101, "display": "101"}, {"id": 651, "topic": "Q9", "topicName": "Labour-leisure", "type": "num", "difficulty": "med", "q": "Henry: 25 h/week for leisure+work, allowance 110, wage 5/h, spends 175 on consumption. Relaxation hours? [C=110+5(25−R)=175 ⇒ 25−R=13]", "explain": "C = 110 + 5*(25 minus R) = 175 gives 25 minus R = 13, so relaxation time R = 12.", "answer": 12, "display": "12"}, {"id": 652, "topic": "Q9", "topicName": "Labour-leisure", "type": "reveal", "difficulty": "hard", "q": "Leisure is a normal good; fixed total time between work and leisure. Which is true?", "explain": "Correction: with leisure a NORMAL good a bigger time endowment is a pure rise in full income at an unchanged price of leisure, so the demand for leisure RISES (it would fall only if leisure were inferior). The original key stated the inferior-good result, so the answer is corrected here.", "a": "An increase in the total time available raises the demand for leisure (a pure income effect, since leisure is normal); it would fall only if leisure were inferior."}, {"id": 653, "topic": "Q9", "topicName": "Labour-leisure", "type": "reveal", "difficulty": "hard", "q": "Bill and Donald: same well-behaved prefs, leisure normal, no non-labour income, same time budget, Bill has the higher wage. Then:", "explain": "With no non-labour income both budget lines pass through (R=T, C=0), and the higher-wage line is steeper, so for consumption both the substitution and income effects of the higher wage point up: Donald (lower wage) always consumes less, though hours are ambiguous. (Consumption is taken to be normal, as usual.)", "a": "Donald might work more or less than Bill, but he will always consume less."}, {"id": 654, "topic": "Q9", "topicName": "Labour-leisure", "type": "reveal", "difficulty": "hard", "q": "An income-tax rate on earnings rises. Total tax payments always increase if:", "explain": "Revenue is t·w·L. If leisure demand rises with the after-tax wage, labour supply falls with the wage (backward-bending). A higher tax rate lowers the after-tax wage, so leisure falls and hours rise; both the rate and hours rise, so revenue always increases.", "a": "The consumer's demand for leisure is increasing in the real wage."}, {"id": 655, "topic": "Q9", "topicName": "Labour-leisure", "type": "reveal", "difficulty": "med", "q": "The real wage rises. Which is true?", "explain": "A worker is a net seller of leisure; when the price of leisure (the wage) rises, her old bundle stays affordable, so by revealed preference anyone who already worked is at least as well off, in fact strictly better.", "a": "A consumer who already worked before the change always becomes better off."}, {"id": 656, "topic": "Q9", "topicName": "Labour-leisure", "type": "num", "difficulty": "hard", "q": "Willy: wage 5/h, 100 h/week, a 100 grant, 50% tax on labour income, u=CR. Hours he chooses to work? [after-tax wage 2.5]", "explain": "After-tax wage = 0.5*5 = 2.5; full income = 100 + 2.5*100 = 350; u=CR spends half on leisure, so R = 175/2.5 = 70 and hours L = 100 minus 70 = 30.", "answer": 30, "display": "30"}, {"id": 657, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "med", "q": "John: u=CR, time endowment T=100 h, non-labour income m₀=50, after-tax wage w=2.5. His optimal consumption C is:", "explain": "Full income = m₀ plus wT = 50 plus 2.5·100 = 300; with u=CR he spends half on consumption, so C = 300/2 = 150.", "opts": ["150", "100", "250", "75"], "correct": 0}, {"id": 658, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "hard", "q": "Same John (u=CR, T=100, m₀=50, w=2.5). His optimal leisure R and hours worked L are:", "explain": "Leisure R = full income/(2w) = 300/(2·2.5) = 60, so hours worked L = T minus R = 100 minus 60 = 40.", "opts": ["R=60, L=40", "R=40, L=60", "R=50, L=50", "R=60, L=60"], "correct": 0}, {"id": 659, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "med", "q": "A worker earns wage 10/h, works up to 40 h, has non-labour income 50, and pays a 20% tax on labour income. Her maximum weekly consumption is:", "explain": "Take-home wage = 0.8·10 = 8; working all 40 h gives 8·40 = 320, plus non-labour income 50 = 370.", "opts": ["370", "400", "450", "320"], "correct": 0}, {"id": 660, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "easy", "q": "A person's reservation wage is:", "explain": "Below the reservation wage she supplies zero hours; at it she is indifferent between working and staying at the no-work point (R=T, C=m₀).", "opts": ["the wage at which she is just indifferent between working and not working", "the highest wage any employer will pay", "her non-labour income", "the after-tax wage"], "correct": 0}, {"id": 661, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "hard", "q": "Preferences u=CR, time endowment T=120, non-labour income m₀=60. Her reservation wage (below which she works zero hours) is:", "explain": "The reservation wage equals the MRS at the no-work point (R=T, C=m₀): MRS = C/R = m₀/T = 60/120 = 0.5.", "opts": ["0.5", "2", "1", "5"], "correct": 0}, {"id": 662, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "hard", "q": "Preferences u=CR, T=80, non-labour income m₀=40. She is offered a wage of 0.4/h. She will:", "explain": "Reservation wage = m₀/T = 40/80 = 0.5; the offered 0.4 is below it, so she supplies zero hours.", "opts": ["not work (0.4 is below her reservation wage of 0.5)", "work about half the time", "work all 80 hours", "work exactly 6 hours"], "correct": 0}, {"id": 663, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "med", "q": "A worker is paid w for the first H hours and a higher wage w' (greater than w) for hours beyond H. In the leisure-consumption diagram her budget line has:", "explain": "Below the kink (working more than H, i.e. less leisure) each hour earns the higher w', so that segment is steeper; the premium creates a convex kink at R = T minus H.", "opts": ["a kink, steeper in magnitude in the overtime region (less leisure)", "no kink, a single straight line", "a kink but flatter in the overtime region", "a horizontal segment"], "correct": 0}, {"id": 664, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "med", "q": "First 8 hours are paid 10/h, overtime beyond 8 h is paid 15/h, no non-labour income. Working 10 hours gives consumption:", "explain": "First 8 h: 8·10 = 80; 2 overtime hours: 2·15 = 30; total 110.", "opts": ["110", "100", "150", "130"], "correct": 0}, {"id": 665, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "med", "q": "Same overtime scheme (10/h up to 8 h, 15/h beyond, no non-labour income). Working exactly 8 hours gives consumption:", "explain": "Eight hours at the base wage: 8·10 = 80 (no overtime yet).", "opts": ["80", "120", "110", "150"], "correct": 0}, {"id": 666, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "med", "q": "Preferences u=CR, T=100, wage w=2. Non-labour income rises from 0 to 40. Optimal leisure changes by:", "explain": "R = full income/(2w); at m₀=0, R = 200/4 = 50; at m₀=40, R = 240/4 = 60; leisure rises by 10 (a pure income effect, leisure normal).", "opts": ["plus 10 (from 50 to 60)", "0", "minus 10", "plus 40"], "correct": 0}, {"id": 667, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "med", "q": "Same change (u=CR, T=100, w=2, m₀ from 0 to 40). Hours worked change by:", "explain": "Hours L = T minus R fall from 50 to 40 as leisure rises, i.e. by minus 10: more unearned income means less work when leisure is normal.", "opts": ["minus 10", "plus 10", "0", "minus 40"], "correct": 0}, {"id": 668, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "hard", "q": "Preferences u=CR, m₀=0, T=100. When the wage rises from 4 to 8, optimal hours worked change by:", "explain": "With m₀=0 and u=CR, R = wT/(2w) = T/2 = 50 for any wage, so hours L = 50 regardless: the substitution and income effects on leisure exactly cancel.", "opts": ["0 (they stay at 50)", "plus 25", "minus 25", "plus 50"], "correct": 0}, {"id": 669, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "hard", "q": "Preferences u=CR, m₀=40, T=100. When the wage rises from 4 to 8, optimal hours worked change by:", "explain": "R = (m₀ plus wT)/(2w): at w=4, R=(40 plus 400)/8=55, L=45; at w=8, R=(40 plus 800)/16=52.5, L=47.5; hours rise by 2.5 because the fixed m₀ weakens the income effect so substitution dominates.", "opts": ["plus 2.5 (from 45 to 47.5)", "0", "minus 2.5", "plus 10"], "correct": 0}, {"id": 670, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "med", "q": "With a proportional tax t on labour income, the interior labour-leisure optimum sets the marginal rate of substitution of leisure for consumption equal to:", "explain": "The price of leisure is the take-home wage w(1 minus t), so tangency requires MRS = w(1 minus t).", "opts": ["the after-tax wage w(1 minus t)", "the gross wage w", "the tax rate t", "non-labour income m₀"], "correct": 0}, {"id": 671, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "med", "q": "For u=CR the MRS of leisure for consumption is C/R. At an optimum with after-tax wage 3 and leisure R=40, consumption C is:", "explain": "The optimum sets C/R = after-tax wage = 3, so C = 3·40 = 120.", "opts": ["120", "40", "12", "3"], "correct": 0}, {"id": 672, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "med", "q": "A higher labour-income tax lowers the take-home wage. For a worker on the upward-sloping part of the labour-supply curve, hours worked will:", "explain": "On the upward-sloping (substitution-dominant) range, a lower after-tax wage reduces hours worked.", "opts": ["fall", "rise", "stay exactly the same", "become negative"], "correct": 0}, {"id": 673, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "easy", "q": "In C = m₀ + w(1 minus t)(T minus R), the term w(1 minus t) represents:", "explain": "Each hour of leisure costs the wage forgone after tax, w(1 minus t).", "opts": ["the take-home (after-tax) wage, the price of leisure", "total tax paid", "non-labour income", "the time endowment"], "correct": 0}, {"id": 674, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "med", "q": "With m₀=20, wage w=10, tax t=0.2, time endowment T=50, the worker's full income (value of all time worked plus m₀) is:", "explain": "Full income = m₀ plus w(1 minus t)T = 20 plus 0.8·10·50 = 20 plus 400 = 420.", "opts": ["420", "520", "400", "70"], "correct": 0}, {"id": 675, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "easy", "q": "If the wage on offer is below a person's reservation wage, she chooses to work:", "explain": "Below the reservation wage the no-work corner (R=T, C=m₀) is best, so she supplies zero hours.", "opts": ["zero hours (a corner at R=T)", "all available hours", "exactly half her time", "more as the wage falls further"], "correct": 0}, {"id": 676, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "med", "q": "Preferences u=CR, m₀=0, wage w=2. The time endowment rises from T=100 to T=120. Optimal leisure changes by:", "explain": "R = wT/(2w) = T/2, so R rises from 50 to 60 as T rises: a pure income effect, since the wage (price of leisure) is unchanged.", "opts": ["plus 10 (from 50 to 60)", "0", "minus 10", "plus 20"], "correct": 0}, {"id": 677, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "hard", "q": "An individual labour-supply curve bends backward over a range precisely when, there, leisure is:", "explain": "A wage rise's substitution effect cuts leisure while its income effect (leisure normal) raises it; backward bending occurs when the income effect dominates.", "opts": ["a normal good whose income effect outweighs the substitution effect", "an inferior good", "a Giffen good", "a perfect complement to consumption"], "correct": 0}, {"id": 678, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "med", "q": "Two people have identical preferences and the same wage, but Ann has higher non-labour income than Ben. With leisure normal, Ann works:", "explain": "Higher unearned income is a pure income effect; with leisure normal it raises leisure and lowers hours, so Ann works less.", "opts": ["fewer hours than Ben", "more hours than Ben", "exactly the same hours", "zero hours necessarily"], "correct": 0}, {"id": 679, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "med", "q": "Holding preferences and the time endowment fixed, a person with higher non-labour income m₀ has a reservation wage that is:", "explain": "The reservation wage equals MRS at (R=T, C=m₀); for u=CR that is m₀/T, which rises with m₀, so richer non-labour income makes work less tempting.", "opts": ["higher (she needs a bigger wage to start working)", "lower", "unchanged", "always zero"], "correct": 0}, {"id": 680, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "med", "q": "At wage 4 a worker chooses 40 hours; at wage 6 she chooses 36 hours; at wage 8 she chooses 30 hours. Over the range shown her labour supply is:", "explain": "Hours fall (40, 36, 30) as the wage rises, so the income effect dominates and the supply curve bends backward.", "opts": ["backward bending (hours fall as the wage rises)", "upward sloping", "perfectly inelastic", "horizontal"], "correct": 0}, {"id": 681, "topic": "Q9", "topicName": "Labour-leisure", "type": "mc", "difficulty": "med", "q": "Gross wage 20/h; the labour-income tax falls from 40% to 25%. The take-home wage rises from:", "ex
